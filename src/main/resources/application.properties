# ====================================================
# PRODUCTION CONFIGURATION (Render Deployment)
# ====================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# =====================
# DATABASE - MongoDB (Atlas)
# REQUIRED: Set MONGO_URI in Render environment variables
# Format: mongodb+srv://user:pass@cluster.mongodb.net/dbname?retryWrites=true&w=majority
# =====================
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://kilingepazasauti_db_user:hugongaa@cluster0.oyiolad.mongodb.net/school_db?retryWrites=true&w=majority&appName=Cluster0}
# =====================
# THYMELEAF
# =====================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# =====================
# LOGGING
# =====================
logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# =====================
# FILE UPLOAD LIMITS
# =====================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================
# ACTUATOR (Health checks for Render)
# =====================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# =====================
# CLOUDINARY STORAGE
# =====================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# =====================
# ADMIN CREDENTIALS (Environment variables)
# =====================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin2.email=${ADMIN2_EMAIL:}
app.student.email=${STUDENT_EMAIL:}
app.student.password=${STUDENT_PASSWORD:}

# =====================
# ERROR HANDLING
# =====================
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# =====================
# EMAIL SETTINGS (GMAIL SMTP)
