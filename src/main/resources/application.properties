# ====================================================
# PRODUCTION CONFIGURATION (Render Deployment)
# ====================================================

server.port=8080
server.address=0.0.0.0

# Default Spring Boot session timeout is 30 minutes, which logs users out
# too aggressively for a student community app — bumped to 4 hours for
# anyone who doesn't check "Keep me signed in" (that path uses the
# separate 30-day remember-me cookie configured in SecurityConfig instead).
server.servlet.session.timeout=4h

# =====================
# DATABASE - MongoDB (Atlas)
# REQUIRED: Set MONGO_URI in Render environment variables
# Format: mongodb+srv://user:pass@cluster.mongodb.net/dbname?retryWrites=true&w=majority
# =====================
spring.data.mongodb.uri=${MONGODB_URI:}
# Every model has @Indexed / @CompoundIndex fields (email, programType,
# levelNo, semesterNo, category, etc.) but Spring Data MongoDB never
# actually creates them in the database unless this is enabled — without
# it every query on those fields was a full collection scan.
spring.data.mongodb.auto-index-creation=true
# =====================
# THYMELEAF
# =====================
# spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# =====================
# LOGGING
# =====================
logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# =====================
# FILE UPLOAD LIMITS
# =====================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =====================
# ACTUATOR (Health checks for Render)
# =====================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# =====================
# CLOUDINARY STORAGE
# =====================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# =====================
# ADMIN CREDENTIALS (Environment variables)
# =====================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin2.email=${ADMIN2_EMAIL:}
app.student.email=${STUDENT_EMAIL:}
app.student.password=${STUDENT_PASSWORD:}

# =====================
# ERROR HANDLING
# =====================
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# =====================
# EMAIL SETTINGS (GMAIL SMTP)
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
# REQUIRED: Set MAIL_PASSWORD env var to your Gmail App Password
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =====================
# GOOGLE LOGIN
# =====================
google.client.id=${GOOGLE_CLIENT_ID:}

# =====================
# VAPID Keys for Web Push Notifications
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:support@4lazie.com}

# =====================
# ENCRYPTION
# =====================
app.encryption.secret-key=${ENCRYPTION_SECRET_KEY:}

# =====================
# HIGH-LEVEL MAGIC OPTIMIZATIONS
# =====================
# 1. Server-Side Compression (Gzip)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. Thymeleaf Template Caching (Instant Render)
spring.thymeleaf.cache=true

# 3. Static Resource Caching (Browsers won't re-download CSS/JS)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**


