# ====================================================
# DEVELOPMENT CONFIGURATION (Local)
# ====================================================

server.port=8080

# =====================
# DATABASE - MongoDB (Local or Test Atlas)
# =====================
# Default to a local MongoDB instance, or specify test cluster via env
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/school_db_dev}

# =====================
# THYMELEAF
# =====================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# =====================
# LOGGING
# =====================
logging.level.org.springframework=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# =====================
# VAPID Keys for Web Push Notifications (Dev / Test)
# =====================
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:support@4lazie.com}
