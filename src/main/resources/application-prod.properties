# ====================================================
# PRODUCTION CONFIGURATION (Render Deployment)
# ====================================================

server.port=${PORT:8080}
server.address=0.0.0.0

# =====================
# DATABASE - MongoDB (Atlas)
# =====================
# REQUIRED: Set MONGODB_URI in Render environment variables
spring.data.mongodb.uri=${MONGODB_URI:}

# =====================
# THYMELEAF
# =====================
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# =====================
# LOGGING
# =====================
logging.level.org.springframework=WARN
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
# (Optional) Log to a file if supported by your hosting environment
# logging.file.name=logs/school-system.log

# =====================
# ACTUATOR (Health checks for Render)
# =====================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# =====================
# VAPID Keys for Web Push Notifications (Production)
# =====================
vapid.public.key=${VAPID_PUBLIC_KEY:}
vapid.private.key=${VAPID_PRIVATE_KEY:}
vapid.subject=mailto:admin@4lazie.com
