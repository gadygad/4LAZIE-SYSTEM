<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - 4LAZIE Premium</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <style>
        body {
            background: #10b981 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .premium-card {
            width: 100%;
            max-width: 400px !important;
            padding: 2.5rem 2rem !important;
            margin: 0 auto !important;
            background: rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
        }
        @media (max-width: 576px) {
            .auth-container {
                padding: 0.5rem;
            }
            .premium-card {
                padding: 1.25rem 1rem !important;
                border-radius: 16px !important;
            }
        }
        .premium-btn {
            width: 100% !important;
            margin: 0 auto !important;
            display: flex;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
</head>
<body>
    <div class="bg-glow">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="auth-container">
        <div class="premium-card">
            
            <div class="text-center mb-4 pb-2">
                <a href="/" class="text-decoration-none d-inline-block mb-1">
                    <span class="text-gradient fw-bold" style="font-size: 2.5rem; letter-spacing: -1.8px;">4LAZIE</span>
                </a>
                <h4 class="fw-bold mb-1 mt-2 text-dark-custom" style="letter-spacing: -0.5px;">Verify OTP</h4>
                <p class="text-muted-custom" style="font-size: 0.85rem; font-weight: 500;">Enter the 6-digit OTP sent to <strong th:text="${email}"></strong></p>
            </div>

            <!-- Premium Glassmorphism Toast Notifications -->
            <div th:if="${success != null or error != null}" class="premium-toast-container">
                <div th:if="${success}" class="premium-toast" id="toastSuccess">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="premium-toast error" id="toastError">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}"></span>
                </div>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    document.querySelectorAll('.premium-toast').forEach(function(toast) {
                        setTimeout(function() { 
                            toast.classList.add('fade-out');
                            setTimeout(function() { toast.parentElement.remove(); }, 500);
                        }, 3000);
                    });
                });
            </script>

            <form th:action="@{/verify-otp}" method="post">
                <input type="hidden" name="email" th:value="${email}" />
                <div class="mb-4">
                    <label class="form-label text-muted-custom fw-semibold mb-2" style="font-size: 0.85rem;">6-Digit OTP</label>
                    <input type="text" name="otp" id="otp" class="premium-input shadow-none" placeholder="e.g. 123456" required autocomplete="off" maxlength="6" pattern="\d{6}" style="letter-spacing: 5px; text-align: center; font-size: 1.5rem; font-weight: bold;">
                </div>

                <button type="submit" class="premium-btn mb-4">
                    Verify OTP <i class="bi bi-check-circle-fill ms-2"></i>
                </button>
            </form>

            <div class="text-center pt-2" style="border-top: 1px solid rgba(15,23,42,0.05);">
                <span class="text-muted-custom" style="font-size: 0.95rem;">Remembered your password?</span> 
                <a th:href="@{/login}" class="text-gradient fw-bold text-decoration-none ms-1" style="font-size: 0.95rem;">Back to Login</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
