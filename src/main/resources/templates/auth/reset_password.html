        "name": "Godfrey Charles Nyagwisi"

          "name": "Godfrey Charles Nyagwisi"
        }

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",

          "@type": "Answer",

<body>
    <div class="auth-container">
        <div class="premium-card">
            
            <div class="text-center mb-4 pb-2">
                <a href="/" class="text-decoration-none d-inline-block mb-1">
                    <span class="text-gradient fw-bold" style="font-size: 2.5rem; letter-spacing: -1.8px;">4LAZIE</span>
                </a>
                <h4 class="fw-bold mb-1 mt-2 text-dark-custom" style="letter-spacing: -0.5px;">Enter New Password</h4>
                <p class="text-muted-custom" style="font-size: 0.85rem; font-weight: 500;">Enter your new password and confirm</p>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert d-flex align-items-center p-3 mb-4 rounded-4" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #065f46; font-size: 0.85rem; backdrop-filter: blur(5px); transition: all 0.3s ease;">
                <i class="bi bi-exclamation-triangle-fill fs-5 me-3"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                
                <div class="mb-3 position-relative">
                    <input type="password" name="password" id="password-input" class="premium-input shadow-none" placeholder="New Password (at least 6 characters)" minlength="6" required style="padding-right: 40px;">
                    <i class="bi bi-eye position-absolute top-50 translate-middle-y" id="toggle-password" style="right: 15px; cursor: pointer; color: #64748b; font-size: 1.1rem; transition: color 0.2s;"></i>
                </div>

                <button type="submit" class="btn-premium-gold w-100 justify-content-center mb-4">
                    Change Password <i class="bi bi-check-circle-fill ms-2"></i>
                </button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('toggle-password').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password-input');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
            this.style.color = type === 'text' ? '#10b981' : '#64748b';
        });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
