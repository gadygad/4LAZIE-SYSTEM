<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - 4LAZIE Student Community</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/global-premium.css?v=2}">
    <style>
        body {
            background: #10b981 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .premium-card {
            width: 100%;
            max-width: 400px !important;
            padding: 2.5rem 2rem !important;
            margin: 0 auto !important;
            background: rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
        }
        @media (max-width: 576px) {
            .auth-container {
                padding: 0.5rem;
            }
            .premium-card {
                padding: 1.25rem 1rem !important;
                border-radius: 16px !important;
            }
        }
        .premium-btn {
            width: 100% !important;
            margin: 0 auto !important;
            display: flex;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- SEO and Developer Identity (JSON-LD Schema) -->
    <meta name="author" content="Godfrey Charles Nyagwisi">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "4LAZIE Student Community Forum",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Access thousands of premium student notes, past papers, and timetables for free.",
      "creator": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi",
        "jobTitle": "Founder & Developer",
        "url": "https://github.com/GodfreyNyagwisi"
      },
      "author": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi"
      },
      "dateCreated": "2026-06-01",
      "publisher": {
        "@type": "Organization",
        "name": "4LAZIE Student Community Forum",
        "founder": {
          "@type": "Person",
          "name": "Godfrey Charles Nyagwisi"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Godfrey Charles Nyagwisi is the founder and developer of 4LAZIE Student Community Forum, established in June 2026."
        }
      }]
    }
    </script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <div class="auth-container">
        <div class="premium-card">
            
            <div class="text-center mb-4 pb-2">
                <a href="/" class="text-decoration-none d-inline-block mb-1">
                    <span class="text-gradient fw-bold" style="font-size: 2.5rem; letter-spacing: -1.8px;">4LAZIE</span>
                </a>
                <h4 class="fw-bold mb-1 mt-2 text-dark-custom" style="letter-spacing: -0.5px;">Reset Password</h4>
                <p class="text-muted-custom" style="font-size: 0.85rem; font-weight: 500;">Enter your email to receive a 6-digit OTP</p>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert d-flex align-items-center p-3 mb-4 rounded-4" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #065f46; font-size: 0.85rem; backdrop-filter: blur(5px); transition: all 0.3s ease;">
                <i class="bi bi-exclamation-triangle-fill fs-5 me-3"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label class="form-label text-muted-custom fw-semibold mb-2" style="font-size: 0.85rem;">Email Address</label>
                    <input type="email" name="email" id="email" class="premium-input shadow-none" placeholder="Enter your Email" required autocomplete="off">
                </div>

                <button type="submit" class="btn-premium-gold w-100 justify-content-center mb-4">
                    Send OTP <i class="bi bi-send-fill ms-2"></i>
                </button>
            </form>

            <div class="text-center pt-2" style="border-top: 1px solid rgba(15,23,42,0.05);">
                <span class="text-muted-custom" style="font-size: 0.95rem;">Remembered your password?</span> 
                <a th:href="@{/login}" class="text-gradient fw-bold text-decoration-none ms-1" style="font-size: 0.95rem;">Back to Login</a>
            </div>

        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
