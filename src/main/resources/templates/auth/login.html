<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 4LAZIE Student Community</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <style>
        body {
            background: #10b981 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .premium-card {
            width: 100%;
            max-width: 400px !important;
            padding: 2.5rem 2rem !important;
            margin: 0 auto !important;
            background: rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
        }
        @media (max-width: 576px) {
            .auth-container {
                padding: 0.5rem;
            }
            .premium-card {
                padding: 1.25rem 1rem !important;
                border-radius: 16px !important;
            }
        }
        .premium-btn {
            width: 100% !important;
            margin: 0 auto !important;
            display: flex;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- SEO and Developer Identity (JSON-LD Schema) -->
    <meta name="author" content="Godfrey Charles Nyagwisi">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "4LAZIE Student Community Forum",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Access thousands of premium student notes, past papers, and timetables for free.",
      "creator": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi",
        "jobTitle": "Founder & Developer",
        "url": "https://github.com/GodfreyNyagwisi"
      },
      "author": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi"
      },
      "dateCreated": "2026-06-01",
      "publisher": {
        "@type": "Organization",
        "name": "4LAZIE Student Community Forum",
        "founder": {
          "@type": "Person",
          "name": "Godfrey Charles Nyagwisi"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Godfrey Charles Nyagwisi is the founder and developer of 4LAZIE Student Community Forum, established in June 2026."
        }
      }]
    }
    </script>
</head>
<body>

    <div class="auth-container">
        <div class="premium-card">
            
            <div class="text-center mb-4 pb-2">
                <a href="/" class="text-decoration-none d-inline-block mb-1">
                    <span class="fw-bold" style="font-size: 2.2rem; letter-spacing: -1.8px; color: #0f172a; font-weight: 900 !important;">4LAZIE</span>
                </a>
                <h4 class="fw-bold mb-1 mt-2 text-dark-custom" style="letter-spacing: -0.5px;">Welcome Back</h4>
                <p class="text-muted-custom" style="font-size: 0.85rem; font-weight: 500;">Enter your credentials to continue</p>
            </div>

            <!-- Inline Premium Alerts -->
            <div th:if="${param.registered != null or param.verify_notice != null or param.verified != null or param.error != null or param.logout != null}" class="mb-4">
                <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                    <i class="bi bi-check-circle-fill me-2 fs-5 text-success"></i>
                    <div>Registration successful! Please log in.</div>
                </div>
                
                <div th:if="${param.verify_notice}" class="alert alert-warning d-flex align-items-center" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                    <i class="bi bi-envelope-check-fill me-2 fs-5 text-warning"></i>
                    <div>Please check your email to verify your account.</div>
                </div>

                <div th:if="${param.verified}" class="alert alert-success d-flex align-items-center" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                    <i class="bi bi-patch-check-fill me-2 fs-5 text-success"></i>
                    <div>Email verified successfully. You can now log in.</div>
                </div>

                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5 text-danger"></i>
                    <div th:text="${session != null and session.SPRING_SECURITY_LAST_EXCEPTION != null ? session.SPRING_SECURITY_LAST_EXCEPTION.message : 'Invalid email or password.'}"></div>
                </div>

                <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center" role="alert" style="border-radius: 12px; font-size: 0.9rem;">
                    <i class="bi bi-shield-lock-fill me-2 fs-5 text-info"></i>
                    <div>You have securely logged out.</div>
                </div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <input type="text" name="email" class="premium-input shadow-none" placeholder="Email or Username" required autocomplete="off">
                </div>
                
                <div class="mb-4 position-relative">
                    <input type="password" name="password" id="password-input" class="premium-input shadow-none" placeholder="Password" required style="padding-right: 40px;">
                    <i class="bi bi-eye position-absolute top-50 translate-middle-y" id="toggle-password" style="right: 15px; cursor: pointer; color: #64748b; font-size: 1.1rem; transition: color 0.2s;"></i>
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 px-2">
                    <div class="form-check d-flex align-items-center mb-3 mb-sm-0 m-0 p-0">
                        <input class="form-check-input m-0 me-2" type="checkbox" name="remember" id="remember" />
                        <label class="form-check-label fw-medium text-muted-custom" for="remember" style="font-size: 0.85rem; cursor: pointer;">Keep me signed in</label>
                    </div>
                    <a href="/forgot-password" class="text-decoration-none" style="font-size: 0.85rem; color: #047857; font-weight: 700; transition: color 0.3s;" onmouseover="this.style.color='#059669'" onmouseout="this.style.color='#047857'">Forgot Password?</a>
                </div>

                <button type="submit" class="premium-btn mb-4 text-center">
                    Sign In
                </button>
            </form>

            <div class="d-flex align-items-center mb-4">
                <hr class="flex-grow-1" style="border-color: rgba(15,23,42,0.1); margin: 0;">
                <span class="mx-3" style="color: rgba(15,23,42,0.4); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Or continue with</span>
                <hr class="flex-grow-1" style="border-color: rgba(15,23,42,0.1); margin: 0;">
            </div>

            <div class="d-flex justify-content-center mb-4">
                <div id="g_id_onload"
                     th:data-client_id="${googleClientId}"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
            </div>

            <!-- Hidden form to submit the token with CSRF protection -->
            <form id="google-login-form" th:action="@{/register/google}" method="post" style="display: none;">
                <input type="hidden" name="credential" id="google-credential">
            </form>

            <div class="text-center pt-2" style="border-top: 1px solid rgba(15,23,42,0.05);">
                <span class="text-muted-custom" style="font-size: 0.95rem;">New to 4LAZIE?</span> 
                <a th:href="@{/register}" class="fw-bold text-decoration-none ms-1" style="font-size: 0.95rem; color: #0f172a;">Create free account</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            document.getElementById('google-credential').value = response.credential;
            document.getElementById('google-login-form').submit();
        }
        
        document.getElementById('toggle-password').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password-input');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
            this.style.color = type === 'text' ? '#10b981' : '#64748b';
        });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
