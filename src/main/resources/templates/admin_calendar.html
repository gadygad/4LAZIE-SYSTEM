<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Academic Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Outfit', sans-serif;
        }

        .main-content {
            margin-left: 0;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
            }
        }

        .card-custom {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: none;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #ced4da;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
            border-color: #10b981;
        }

        .btn-warning {
            background-color: #10b981;
            border-color: #10b981;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .btn-warning:hover {
            background-color: #059669;
            border-color: #059669;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- SEO and Developer Identity (JSON-LD Schema) -->
    <meta name="author" content="Godfrey Charles Nyagwisi">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "4LAZIE Student Community Forum",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Access thousands of premium student notes, past papers, and timetables for free.",
      "creator": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi",
        "jobTitle": "Founder & Developer",
        "url": "https://github.com/GodfreyNyagwisi"
      },
      "author": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi"
      },
      "dateCreated": "2026-06-01",
      "publisher": {
        "@type": "Organization",
        "name": "4LAZIE Student Community Forum",
        "founder": {
          "@type": "Person",
          "name": "Godfrey Charles Nyagwisi"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Godfrey Charles Nyagwisi is the founder and developer of 4LAZIE Student Community Forum, established in June 2026."
        }
      }]
    }
    </script>
</head>
<body>

<!-- Offcanvas Admin Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='calendar')}"></div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Manage Academic Calendar</h2>
        <button class="btn btn-sm btn-success d-flex align-items-center rounded-pill px-3 shadow-sm" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
            <i class="bi bi-list me-2"></i> Admin Menu
        </button>
    </div>

    <!-- Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Upload Form -->
    <div class="card-custom">
        <h4 class="mb-4"><i class="bi bi-plus-circle-fill text-warning me-2"></i> Upload New Academic Calendar</h4>
        <form action="/admin/calendar/upload" method="POST" enctype="multipart/form-data">
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Academic Year</label>
                    <input type="text" name="academicYear" class="form-control" placeholder="E.g. 2025/2026" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Calendar PDF/Image File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <h5 class="fw-bold text-primary mb-3">Semester 1 Dates</h5>
                    <div class="mb-3">
                        <label class="form-label">CAT 1 Date</label>
                        <input type="text" name="sem1Cat1Date" class="form-control" placeholder="e.g. 13 Jan 2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CAT 2 Date</label>
                        <input type="text" name="sem1Cat2Date" class="form-control" placeholder="e.g. 02 Mar 2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">UE Date</label>
                        <input type="text" name="sem1UeDate" class="form-control" placeholder="e.g. 23 Mar 2026 - 02 Apr 2026" required>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <h5 class="fw-bold text-success mb-3">Semester 2 Dates</h5>
                    <div class="mb-3">
                        <label class="form-label">CAT 1 Date</label>
                        <input type="text" name="sem2Cat1Date" class="form-control" placeholder="e.g. 01 Jun 2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CAT 2 Date</label>
                        <input type="text" name="sem2Cat2Date" class="form-control" placeholder="e.g. 20 Jul 2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">UE Date</label>
                        <input type="text" name="sem2UeDate" class="form-control" placeholder="e.g. 10 Aug 2026 - 21 Aug 2026" required>
                    </div>
                </div>
            </div>

            <div class="form-check mb-4 mt-2">
                <input class="form-check-input" type="checkbox" name="isCurrent" id="isCurrent" value="true" checked>
                <label class="form-check-label fw-bold" for="isCurrent">
                    Set as Current Calendar
                </label>
            </div>

            <button type="submit" class="btn btn-warning w-100">
                <i class="bi bi-save-fill me-2"></i> Save Academic Calendar
            </button>
        </form>
    </div>

    <!-- Existing Calendars -->
    <div class="card-custom">
        <h4 class="mb-4"><i class="bi bi-table text-warning me-2"></i> Existing Calendars</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Academic Year</th>
                        <th>Status</th>
                        <th>Sem 1 UE</th>
                        <th>Sem 2 UE</th>
                        <th>Upload Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cal : ${calendars}">
                        <td th:text="${cal.academicYear}" class="fw-bold">2025/2026</td>
                        <td>
                            <span th:if="${cal.isCurrent}" class="badge bg-success">Current</span>
                            <span th:unless="${cal.isCurrent}" class="badge bg-secondary">Archived</span>
                        </td>
                        <td th:text="${cal.sem1UeDate}">...</td>
                        <td th:text="${cal.sem2UeDate}">...</td>
                        <td th:text="${#temporals.format(cal.uploadedAt, 'dd MMM yyyy')}">...</td>
                        <td>
                            <a th:if="${cal.fileUrl}" th:href="${#strings.startsWith(cal.fileUrl, 'http')} ? ${cal.fileUrl} : @{'/uploads/' + ${cal.fileUrl}}" class="btn btn-sm btn-outline-primary" target="_blank">
                                <i class="bi bi-eye"></i> View PDF
                            </a>
                            <form th:action="@{/admin/calendar/{id}/delete(id=${cal.id})}" method="POST" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this calendar?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(calendars)}">
                        <td colspan="6" class="text-center text-muted py-4">No academic calendars available.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Bottom Navigation -->
<div th:replace="~{fragments/bottom_nav :: nav('calendar')}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
