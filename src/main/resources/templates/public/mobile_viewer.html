<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${note.title} + ' - 4LAZIE'">Document Viewer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        
        .viewer-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #0f172a;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }

        .doc-title {
            flex-grow: 1;
            margin: 0 15px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        .download-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        .iframe-container {
            position: absolute;
            top: 61px; /* Height of header */
            left: 0;
            right: 0;
            bottom: 0;
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Loading animation */
        .loader {
            position: absolute;
            z-index: -1; /* Behind iframe */
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="viewer-header">
        <a href="javascript:history.back()" class="back-btn">
            <i class="bi bi-arrow-left fs-5"></i>
        </a>
        <div class="doc-title" th:text="${note.title}">Document Title</div>
        <a th:href="@{/download/{id}(id=${note.id})}" class="download-btn">
            <i class="bi bi-cloud-arrow-down-fill"></i> Save
        </a>
    </div>

    <div class="iframe-container">
        <div class="loader">
            <div class="spinner-border text-success mb-2" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span style="font-size: 0.85rem; font-weight: 500;">Loading Document...</span>
        </div>
        <iframe th:src="${googleDocsUrl}"></iframe>
    </div>

</body>
</html>
