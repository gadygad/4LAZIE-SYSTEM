<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your College/University - 4LAZIE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #06331d 0%, #0a5c34 55%, #0c8245 100%);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .picker-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 32px 26px 26px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        }
        .logo-badge {
            background: #111;
            border: 2px solid #10b981;
            border-radius: 8px;
            padding: 6px 14px;
            display: inline-block;
            margin-bottom: 18px;
        }
        .logo-badge span {
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: 1.5px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: #0f172a;
            margin: 0 0 6px;
        }
        p.lead {
            color: #64748b;
            font-size: 0.88rem;
            margin: 0 0 22px;
            line-height: 1.5;
        }
        .search-box {
            position: relative;
            margin-bottom: 18px;
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .search-box input {
            width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px 14px 11px 40px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: #10b981;
        }
        .college-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
        }
        .college-option {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            text-align: left;
            border: 2px solid #eef2f0;
            border-radius: 14px;
            padding: 12px 14px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .college-option:hover {
            border-color: #10b981;
            background: rgba(16,185,129,0.05);
        }
        .college-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(16,185,129,0.1);
            color: #059669;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .college-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .college-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .college-text .name { font-weight: 600; font-size: 0.88rem; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .college-text .short { font-size: 0.75rem; color: #94a3b8; }
        .empty-state {
            text-align: center;
            padding: 24px 8px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .not-listed {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 0.8rem;
            color: #059669;
            text-decoration: none;
            font-weight: 500;
        }
        .not-listed:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="picker-card">
    <div class="logo-badge"><span>4LAZIE</span></div>
    <h1>Which College/University are you from?</h1>
    <p class="lead">Choose your college to see notes, courses, past papers and discussions relevant to you. You can change this anytime.</p>

    <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" id="collegeSearch" placeholder="Search your College/University..." autocomplete="off">
    </div>

    <div class="college-list" id="collegeList">
        <form th:each="inst : ${institutions}" th:action="@{/choose-college/select}" method="post" class="college-option-form" style="margin:0;">
            <input type="hidden" name="institutionId" th:value="${inst.id}">
            <input type="hidden" name="redirect" th:value="${redirectTo}">
            <button type="submit" class="college-option" th:attr="data-search=${#strings.toLowerCase(inst.name + ' ' + inst.shortName)}">
                <span class="college-icon">
                    <img th:if="${inst.logoUrl != null and !inst.logoUrl.isEmpty()}" th:src="${inst.logoUrl}" alt="logo">
                    <i th:if="${inst.logoUrl == null or inst.logoUrl.isEmpty()}" class="bi bi-bank2"></i>
                </span>
                <span class="college-text">
                    <span class="name" th:text="${inst.name}">College Name</span>
                    <span class="short" th:text="${inst.shortName}">Short Name</span>
                </span>
            </button>
        </form>
        <div class="empty-state" th:if="${institutions.isEmpty()}">
            No colleges are set up yet.
        </div>
    </div>

    <div class="empty-state" id="noMatch" style="display:none;">No college matches that search.</div>

    <a class="not-listed" th:href="@{${redirectTo}}">Just exploring — skip for now</a>
</div>

<script>
    document.getElementById('collegeSearch').addEventListener('input', function () {
        var q = this.value.trim().toLowerCase();
        var forms = document.querySelectorAll('.college-option-form');
        var visibleCount = 0;
        forms.forEach(function (form) {
            var btn = form.querySelector('.college-option');
            var haystack = btn.getAttribute('data-search') || '';
            var match = haystack.indexOf(q) !== -1;
            form.style.display = match ? '' : 'none';
            if (match) visibleCount++;
        });
        document.getElementById('noMatch').style.display = (visibleCount === 0 && forms.length > 0) ? 'block' : 'none';
    });
</script>

</body>
</html>
