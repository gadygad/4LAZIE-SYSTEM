<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Notes - Admin Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Premium Global CSS -->
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- SEO and Developer Identity (JSON-LD Schema) -->
    <meta name="author" content="Godfrey Charles Nyagwisi">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "4LAZIE Student Community Forum",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Access thousands of premium student notes, past papers, and timetables for free.",
      "creator": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi",
        "jobTitle": "Founder & Developer",
        "url": "https://github.com/GodfreyNyagwisi"
      },
      "author": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi"
      },
      "dateCreated": "2026-06-01",
      "publisher": {
        "@type": "Organization",
        "name": "4LAZIE Student Community Forum",
        "founder": {
          "@type": "Person",
          "name": "Godfrey Charles Nyagwisi"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Godfrey Charles Nyagwisi is the founder and developer of 4LAZIE Student Community Forum, established in June 2026."
        }
      }]
    }
    </script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>

    <!-- Premium Admin Navbar -->
    <nav class="navbar sticky-top py-2" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(16,185,129,0.15); box-shadow: 0 10px 30px rgba(16,185,129,0.05); z-index: 1040;">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap">
            <!-- Brand -->
            <a class="navbar-brand d-flex align-items-center text-decoration-none flex-shrink-1 overflow-hidden me-2" th:href="${session.user != null ? '/admin/dashboard' : '/'}">
                <div class="d-flex align-items-center justify-content-center me-2 flex-shrink-0" style="width: 34px; height: 34px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; box-shadow: 0 6px 15px rgba(16,185,129,0.35);">
                    <i class="bi bi-shield-check text-white" style="font-size: 1rem;"></i>
                </div>
                <div class="d-flex align-items-center text-nowrap" style="transition: all 0.5s cubic-bezier(0.25,1,0.5,1); cursor: pointer;" onmouseover="this.style.transform='scale(1.02) translateY(-1px)';" onmouseout="this.style.transform='none';">
                    <div style="background-color: #111111; border: 3px solid #10b981; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);">
                        <span style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.25rem; letter-spacing: 2px; line-height: 1; text-transform: uppercase;">4LAZIE</span>
                    </div>
                    <span class="admin-brand-text ms-1" style="font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN</span>
                </div>
            </a>
            <div class="flex-shrink-0" th:replace="~{fragments/top_actions :: actions}"></div>
        </div>
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(16,185,129,0.8) 50%, transparent 100%); box-shadow: 0 -2px 15px rgba(16,185,129,0.4);"></div>
    </nav>
    <style>
        .admin-brand-text { font-size: 1.6rem; }
        @media (max-width: 576px) { .admin-brand-text { font-size: 1.15rem; } }
        @media (min-width: 577px) and (max-width: 768px) { .admin-brand-text { font-size: 1.3rem; } }
    </style>

    <div class="container py-4">
        <!-- Premium Glassmorphism Toast Notifications -->
        <div th:if="${success != null or error != null}" class="premium-toast-container">
            <div th:if="${success}" class="premium-toast" id="toastSuccess">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="premium-toast error" id="toastError">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Notes Table -->
            <div class="col-lg-12">
                <div class="position-relative" style="padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); border-radius: 24px;">
                    <button class="btn btn-sm btn-success position-absolute top-0 end-0 mt-3 me-3 d-flex align-items-center rounded-pill px-3 shadow-sm" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
                        <i class="bi bi-list me-2"></i> Admin Menu
                    </button>
                    
                    <div class="text-center mb-2">
                        <div class="mx-auto mb-1 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; background: linear-gradient(135deg, rgba(16, 185, 129,0.15), rgba(5, 150, 105,0.05)); border-radius: 14px; box-shadow: 0 10px 25px rgba(16, 185, 129,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129,0.2);">
                            <i class="bi bi-journal-text" style="font-size: 1.5rem; color: #10b981;"></i>
                        </div>
                        <h1 class="fw-bolder mb-2" style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase;">MANAGE NOTES</h1>
                    </div>

                    <!-- Search & Filter -->
                    <div class="mb-3">
                        <input type="text" id="searchNotes" class="form-control" placeholder="Search notes by title, module, or category..." style="border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2); padding: 10px 16px; font-size: 0.9rem; transition: all 0.3s;" onfocus="this.style.borderColor='#10b981'; this.style.boxShadow='0 0 0 3px rgba(16,185,129,0.1)';" onblur="this.style.borderColor='rgba(16,185,129,0.2)'; this.style.boxShadow='none';">
                    </div>

                    <div class="table-responsive bg-white rounded-4 shadow-sm" style="border: 1px solid #f1f5f9;">
                        <table class="table table-hover align-middle mb-0" id="notesTable">
                            <thead style="background-color: #f8fafc;">
                                <tr>
                                    <th class="py-3 px-3 fw-semibold text-muted" style="border-bottom: 2px solid #e2e8f0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">TITLE</th>
                                    <th class="py-3 px-3 fw-semibold text-muted d-none d-md-table-cell" style="border-bottom: 2px solid #e2e8f0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">MODULE</th>
                                    <th class="py-3 px-3 fw-semibold text-muted" style="border-bottom: 2px solid #e2e8f0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">CATEGORY</th>
                                    <th class="py-3 px-3 fw-semibold text-muted d-none d-md-table-cell" style="border-bottom: 2px solid #e2e8f0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">DATE</th>
                                    <th class="py-3 px-3 fw-semibold text-muted text-center" style="border-bottom: 2px solid #e2e8f0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px;">ACTION</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="note : ${notes}" class="admin-note-row" style="transition: all 0.3s ease;">
                                    <td class="py-3 px-3" style="font-weight: 600; color: #1e293b; font-size: 0.85rem;">
                                        <a th:href="@{'/view/' + ${note.encryptedSlug}}" class="text-decoration-none" style="color: #1e293b; transition: color 0.3s;" onmouseover="this.style.color='#10b981'" onmouseout="this.style.color='#1e293b'" th:text="${note.title}">Note Title</a>
                                    </td>
                                    <td class="py-3 px-3 d-none d-md-table-cell" style="color: #64748b; font-size: 0.8rem;" th:text="${note.moduleName}">Module</td>
                                    <td class="py-3 px-3">
                                        <span class="badge" style="background: rgba(16, 185, 129, 0.1); color: #059669; font-weight: 600; padding: 5px 10px; border-radius: 8px; font-size: 0.75rem;" th:text="${note.category}">Note</span>
                                    </td>
                                    <td class="py-3 px-3 d-none d-md-table-cell" style="color: #94a3b8; font-size: 0.8rem;" th:text="${note.uploadDate != null ? #temporals.format(note.uploadDate, 'dd MMM yyyy') : 'N/A'}">Date</td>
                                    <td class="py-3 px-3 text-center">
                                        <div class="d-flex justify-content-center align-items-center gap-2">
                                            <form th:action="@{'/admin/notes/' + ${note.id} + '/toggle-general'}" method="post" style="display: inline;">
                                                <button type="submit" class="btn btn-sm" th:style="${note.isGeneral} ? 'background: rgba(16, 185, 129, 0.08); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.15); border-radius: 10px; font-weight: 600; font-size: 0.75rem; padding: 5px 12px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);' : 'background: rgba(245, 158, 11, 0.08); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.15); border-radius: 10px; font-weight: 600; font-size: 0.75rem; padding: 5px 12px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);'" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(16,185,129,0.2)';" onmouseout="this.style.transform='none'; this.style.boxShadow='none';">
                                                    <i th:class="${note.isGeneral} ? 'bi bi-star-fill me-1' : 'bi bi-star me-1'"></i><span th:text="${note.isGeneral} ? 'GENERAL' : 'MAKE GEN'"></span>
                                                </button>
                                            </form>
                                            <form th:action="@{'/admin/notes/' + ${note.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this note?');" style="display: inline;">
                                                <button type="submit" class="btn btn-sm" style="background: rgba(220, 38, 38, 0.08); color: #dc2626; border: 1px solid rgba(220, 38, 38, 0.15); border-radius: 10px; font-weight: 600; font-size: 0.75rem; padding: 5px 12px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(220,38,38,0.2)'; this.style.background='rgba(220,38,38,0.15)';" onmouseout="this.style.transform='none'; this.style.boxShadow='none'; this.style.background='rgba(220,38,38,0.08)';">
                                                    <i class="bi bi-trash3-fill me-1"></i>DEL
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(notes)}">
                                    <td colspan="5" class="text-center py-5" style="color: #94a3b8;">
                                        <i class="bi bi-journal-x" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
                                        No notes found.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3 text-center" style="color: #94a3b8; font-size: 0.8rem;">
                        Total: <strong th:text="${#lists.size(notes)}" style="color: #10b981;">0</strong> notes
                    </div>
                </div>
            </div>

            <!-- Offcanvas Admin Sidebar -->
            <div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='notes')}"></div>
        </div>
    </div>

    <!-- Include Footer -->
    <div style="border-top: 1px solid #e2e8f0; background: #ffffff;">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Search Filter Script -->
    <script>
        document.getElementById('searchNotes').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const rows = document.querySelectorAll('.admin-note-row');
            rows.forEach(function(row) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        });

                        // Auto-remove toast notifications after 3 seconds
        document.querySelectorAll('.premium-toast').forEach(function(toast) {
            setTimeout(function() { 
                toast.classList.add('fade-out');
                setTimeout(function() { toast.parentElement.remove(); }, 500);
            }, 3000);
        });
    </script>


    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
