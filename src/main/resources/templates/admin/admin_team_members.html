<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Team Members - Admin Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Premium Global CSS -->
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>

    <!-- Premium Admin Navbar -->
    <nav class="navbar sticky-top py-2" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(16,185,129,0.15); box-shadow: 0 10px 30px rgba(16,185,129,0.05); z-index: 1040;">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap">
            <!-- Brand -->
            <a class="navbar-brand d-flex align-items-center text-decoration-none flex-shrink-1 overflow-hidden me-2" th:href="${session.user != null ? '/admin/dashboard' : '/'}">
                <div class="d-flex align-items-center justify-content-center me-2 flex-shrink-0" style="width: 34px; height: 34px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; box-shadow: 0 6px 15px rgba(16,185,129,0.35);">
                    <i class="bi bi-shield-check text-white" style="font-size: 1rem;"></i>
                </div>
                <div class="d-flex align-items-center text-nowrap" style="transition: all 0.5s cubic-bezier(0.25,1,0.5,1); cursor: pointer;" onmouseover="this.style.transform='scale(1.02) translateY(-1px)';" onmouseout="this.style.transform='none';">
                    <div style="background-color: #111111; border: 3px solid #10b981; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);">
                        <span style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.25rem; letter-spacing: 2px; line-height: 1; text-transform: uppercase;">4LAZIE</span>
                    </div>
                    <span class="admin-brand-text ms-1" style="font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN</span>
                </div>
            </a>
            <div class="flex-shrink-0" th:replace="~{fragments/top_actions :: actions}"></div>
        </div>
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(16,185,129,0.8) 50%, transparent 100%); box-shadow: 0 -2px 15px rgba(16,185,129,0.4);"></div>
    </nav>
    <style>
        .admin-brand-text { font-size: 1.6rem; }
        @media (max-width: 576px) { .admin-brand-text { font-size: 1.15rem; } }
        @media (min-width: 577px) and (max-width: 768px) { .admin-brand-text { font-size: 1.3rem; } }
    </style>

    <div class="container py-4">
        <!-- Premium Glassmorphism Toast Notifications -->
        <div th:if="${success != null or error != null}" class="premium-toast-container">
            <div th:if="${success}" class="premium-toast" id="toastSuccess">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="premium-toast error" id="toastError">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-12">
                <div class="position-relative" style="padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); border-radius: 24px;">
                    <button class="btn btn-sm btn-success position-absolute top-0 end-0 mt-3 me-3 d-flex align-items-center rounded-pill px-3 shadow-sm" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
                        <i class="bi bi-list me-2"></i> Admin Menu
                    </button>
                    
                    <div class="text-center mb-2">
                        <div class="mx-auto mb-1 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; background: linear-gradient(135deg, rgba(16, 185, 129,0.15), rgba(5, 150, 105,0.05)); border-radius: 14px; box-shadow: 0 10px 25px rgba(16, 185, 129,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129,0.2);">
                            <i class="bi bi-people-fill" style="font-size: 1.5rem; color: #10b981;"></i>
                        </div>
                        <h1 class="fw-bolder mb-2" style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase;">TEAM MEMBERS</h1>
                        <button type="button" class="btn btn-sm mb-3" data-bs-toggle="modal" data-bs-target="#addTeamMemberModal" style="background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 8px 20px; font-weight: 600; border-radius: 12px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                            <i class="bi bi-person-plus-fill me-1"></i> ADD MEMBER
                        </button>
                    </div>

                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-2">
                        <div th:each="member : ${teamMembers}" class="col">
                            <div class="card h-100" style="border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden;">
                                <div style="height: 150px; overflow: hidden; background: #f8fafc; position: relative;">
                                    <img th:if="${member.imagePath != null}" th:src="${member.imagePath}" alt="Photo" style="width: 100%; height: 100%; object-fit: cover; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));">
                                    <div th:unless="${member.imagePath != null}" class="d-flex align-items-center justify-content-center h-100">
                                        <i class="bi bi-person text-secondary" style="font-size: 3rem;"></i>
                                    </div>
                                    <span class="badge position-absolute top-0 end-0 m-2" th:classappend="${member.active ? 'bg-success' : 'bg-danger'}" th:text="${member.active ? 'Active' : 'Inactive'}"></span>
                                </div>
                                <div class="card-body p-4 text-center">
                                    <h5 class="fw-bold mb-1" style="font-family: 'Outfit', sans-serif; color: #1e293b;" th:text="${member.name}">Name</h5>
                                    <p class="mb-3 fw-semibold" style="color: #10b981; font-size: 0.9rem;" th:text="${member.role}">Role</p>
                                    <p class="text-muted fst-italic" style="font-size: 0.85rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;" th:text="${member.quote}">Quote</p>
                                    <div class="mt-2 text-start">
                                        <small class="text-muted">Display Order: <strong th:text="${member.displayOrder}"></strong></small>
                                    </div>
                                </div>
                                <div class="card-footer bg-white border-0 p-3 d-flex justify-content-between align-items-center">
                                    <button class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-semibold" data-bs-toggle="modal" th:data-bs-target="'#editTeamMemberModal-' + ${member.id}">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </button>
                                    <div class="d-flex gap-2">
                                        <form th:action="@{'/admin/team-members/' + ${member.id} + '/toggle-status'}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary rounded-pill" title="Toggle Status">
                                                <i class="bi bi-power"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{'/admin/team-members/' + ${member.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this team member?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill" title="Delete">
                                                <i class="bi bi-trash3-fill"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(teamMembers)}" class="text-center py-5">
                        <i class="bi bi-people text-muted" style="font-size: 3rem;"></i>
                        <h5 class="mt-3 text-muted">No Team Members found.</h5>
                        <p class="text-muted">Click 'Add Member' to start building the gallery.</p>
                    </div>

                </div>
            </div>

            <!-- Offcanvas Admin Sidebar -->
            <div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='team-members')}"></div>
        </div>
    </div>

    <!-- Add Team Member Modal -->
    <div class="modal fade" id="addTeamMemberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 24px; border: 1px solid rgba(16, 185, 129, 0.2);">
                <div class="modal-header text-white" style="background: linear-gradient(135deg, #10b981, #059669); border-radius: 24px 24px 0 0;">
                    <h5 class="modal-title fw-bold" style="font-family: 'Outfit', sans-serif;"><i class="bi bi-person-plus-fill me-2"></i>Add Team Member</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/team-members/add}" method="post" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Role/Title</label>
                            <input type="text" name="role" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Inspirational Quote</label>
                            <textarea name="quote" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Display Order</label>
                            <input type="number" name="displayOrder" class="form-control" value="0">
                            <small class="text-muted">Lower numbers appear first (e.g., 1, 2, 3).</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Photo (Optional but recommended)</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-3">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success rounded-pill px-4" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">Save Member</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Team Member Modals -->
    <div th:each="member : ${teamMembers}">
        <div class="modal fade" th:id="'editTeamMemberModal-' + ${member.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 24px; border: 1px solid rgba(16, 185, 129, 0.2);">
                    <div class="modal-header text-white" style="background: linear-gradient(135deg, #10b981, #059669); border-radius: 24px 24px 0 0;">
                        <h5 class="modal-title fw-bold" style="font-family: 'Outfit', sans-serif;"><i class="bi bi-pencil-square me-2"></i>Edit Team Member</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{'/admin/team-members/' + ${member.id} + '/edit'}" method="post" enctype="multipart/form-data">
                        <div class="modal-body p-4">
                            <div class="mb-3 text-center" th:if="${member.imagePath != null}">
                                <img th:src="${member.imagePath}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid #10b981; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Name</label>
                                <input type="text" name="name" th:value="${member.name}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Role/Title</label>
                                <input type="text" name="role" th:value="${member.role}" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Inspirational Quote</label>
                                <textarea name="quote" class="form-control" rows="3" th:text="${member.quote}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Display Order</label>
                                <input type="number" name="displayOrder" th:value="${member.displayOrder}" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Update Photo (Leave blank to keep current)</label>
                                <input type="file" name="image" class="form-control" accept="image/*">
                            </div>
                        </div>
                        <div class="modal-footer border-0 p-3">
                            <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success rounded-pill px-4" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div style="border-top: 1px solid #e2e8f0; background: #ffffff;">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Auto-remove toast notifications after 3 seconds
        document.querySelectorAll('.premium-toast').forEach(function(toast) {
            setTimeout(function() { 
                toast.classList.add('fade-out');
                setTimeout(function() { toast.parentElement.remove(); }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
