<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messages | 4LAZIE Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        body { font-family:'Inter',sans-serif; background:#f8fafc; min-height:100vh; color:#1e293b; }

        .ambient-bg {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;
            background: radial-gradient(circle at 10% 20%, rgba(16,185,129,0.07), transparent 35%),
                        radial-gradient(circle at 90% 80%, rgba(99,102,241,0.04), transparent 35%);
            background-color: #f8fafc;
        }

        /* Two-panel layout */
        .msg-container {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(16,185,129,0.07);
            height: calc(100vh - 120px);
            overflow: hidden;
            display: flex;
            margin-top: 16px;
            margin-bottom: 16px;
            position: relative;
        }
        .list-col {
            width: 330px; flex-shrink: 0;
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
            background: rgba(248,252,250,0.6);
        }
        .chat-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Inbox item */
        .inbox-item {
            padding: 13px 16px; cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            transition: all 0.25s; display: flex; align-items: center; gap: 12px;
        }
        .inbox-item:hover { background: rgba(16,185,129,0.05); }
        .inbox-item.active { background: rgba(16,185,129,0.09); border-left: 3px solid #10b981; }
        .inbox-item.has-unread { background: rgba(99,102,241,0.04); }

        /* Avatar ring */
        .av-ring {
            width: 46px; height: 46px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-weight: 800; font-size: 1rem; color: white;
            font-family: 'Outfit', sans-serif; position: relative; overflow: hidden;
        }
        .unread-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 13px; height: 13px; border-radius: 50%;
            background: #6366f1; border: 2px solid white;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge { 0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,0.4)} 50%{box-shadow:0 0 0 5px rgba(99,102,241,0)} }

        /* Chat header */
        .chat-header {
            padding: 13px 18px; background: rgba(255,255,255,0.97);
            backdrop-filter: blur(14px); border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 13px; flex-shrink: 0;
        }
        /* Messages */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 16px 18px;
            background: radial-gradient(circle at 8% 15%,rgba(16,185,129,0.04),transparent 35%),
                        radial-gradient(circle at 92% 85%,rgba(99,102,241,0.03),transparent 35%),#f8fafc;
            display: flex; flex-direction: column; gap: 7px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.15); border-radius: 2px; }

        .msg-row { display: flex; align-items: flex-end; gap: 8px; animation: popIn 0.3s ease forwards; }
        .msg-row.self { flex-direction: row-reverse; }
        @keyframes popIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        .av-sm {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 800; color: white; overflow: hidden;
        }
        .av-sm img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

        /* Removed old bubble styles */
        .bubble { max-width: 100%; padding: 0; font-size: 0.9rem; line-height: 1.55; word-break: break-word; }

        /* Typing cursor */
        .typing-cursor::after { content:'▋'; animation:blink-c 0.7s step-start infinite; }
        @keyframes blink-c { 50%{opacity:0;} }

        /* Input */
        .chat-input-area {
            background: rgba(255,255,255,0.97); border-top: 1px solid rgba(0,0,0,0.04);
            padding: 10px 16px 12px; flex-shrink: 0;
        }
        .input-shell {
            display: flex; align-items: flex-end; gap: 10px;
            background: #f8fffe; border: 1.5px solid rgba(99,102,241,0.18);
            border-radius: 20px; padding: 9px 12px; transition: all 0.3s;
        }
        .input-shell:focus-within { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.08); }
        #adminMsgInput {
            flex: 1; border: none; outline: none; background: transparent;
            font-family: 'Inter', sans-serif; font-size: 0.88rem; color: #1e293b;
            resize: none; max-height: 110px; min-height: 22px; line-height: 1.5;
        }
        #adminMsgInput::placeholder { color: #b0bec5; }
        .send-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg,#6366f1,#4f46e5);
            border: none; color: white; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }
        .send-btn:hover { transform: scale(1.12) rotate(8deg); }
        .send-btn:disabled { background:#e2e8f0; box-shadow:none; transform:none; cursor:not-allowed; }

        /* Empty pane */
        .empty-pane {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #94a3b8; text-align: center; padding: 40px;
        }

        @media(max-width:768px) {
            .msg-container { height: calc(100vh - 140px); border-radius: 16px; }
            .list-col { width:100%; }
            .chat-col { position:absolute; top:0; left:0; width:100%; height:100%; transform:translateX(100%); transition:transform 0.35s ease; z-index:10; background: #f8fafc; }
            .msg-container.chat-open .list-col { opacity:0; pointer-events:none; }
            .msg-container.chat-open .chat-col { transform:translateX(0); }
        }
    </style>
</head>
<body>
<div class="ambient-bg"></div>

<!-- Navbar (same as admin_dashboard) -->
<nav class="navbar sticky-top py-2" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(16, 185, 129, 0.15); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.05); z-index: 1040;">
    <div class="container d-flex justify-content-between align-items-center flex-nowrap">
        <a class="navbar-brand d-flex align-items-center text-decoration-none flex-shrink-1 overflow-hidden me-2" th:href="@{/admin/dashboard}">
            <div class="d-flex align-items-center justify-content-center me-2 flex-shrink-0" style="width: 34px; height: 34px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; box-shadow: 0 6px 15px rgba(16, 185, 129, 0.35);">
                <i class="bi bi-shield-check text-white" style="font-size: 1rem;"></i>
            </div>
            <div class="d-flex align-items-center text-nowrap">
                <span class="magic-brand-text">4LAZIE</span>
                <span class="ms-1" style="font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.4rem; letter-spacing: -0.5px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN</span>
            </div>
        </a>
        <div class="flex-shrink-0" th:replace="~{fragments/top_actions :: actions}"></div>
    </div>
    <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(16, 185, 129, 0.8) 50%, transparent 100%);"></div>
</nav>

<div class="container-fluid px-2 px-md-4" style="position:relative;">
<div class="msg-container" id="adminMsgContainer">

    <!-- LEFT: Student list -->
    <div class="list-col">
        <div style="padding:16px 18px;border-bottom:1px solid rgba(0,0,0,0.05);background:rgba(255,255,255,0.8);flex-shrink:0;">
            <div style="font-family:'Outfit',sans-serif;font-weight:800;font-size:1rem;color:#1e293b;">
                <i class="bi bi-chat-dots-fill me-2" style="color:#10b981;"></i>Direct Messages
            </div>
            <div th:if="${unreadCount != null and unreadCount > 0}" style="font-size:0.72rem;color:#6366f1;font-weight:700;margin-top:2px;">
                <i class="bi bi-circle-fill me-1" style="font-size:0.45rem;"></i>
                <span th:text="${unreadCount}">0</span> unread conversation(s)
            </div>
            <div th:if="${unreadCount == null or unreadCount == 0}" style="font-size:0.72rem;color:#94a3b8;font-weight:600;margin-top:2px;">
                All caught up ✓
            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${chatViews == null or chatViews.isEmpty()}" class="text-center p-4">
            <div style="width:60px;height:60px;border-radius:50%;background:rgba(16,185,129,0.08);display:flex;align-items:center;justify-content:center;margin:20px auto 12px;color:#10b981;font-size:1.6rem;">
                <i class="bi bi-inbox-fill"></i>
            </div>
            <div style="font-weight:700;color:#64748b;font-size:0.9rem;">No conversations yet</div>
            <div style="font-size:0.78rem;color:#94a3b8;margin-top:4px;">Students will appear here when they message you.</div>
        </div>

        <!-- Chat list -->
        <div class="overflow-auto flex-grow-1" style="scrollbar-width:thin;">
            <div th:each="cv : ${chatViews}"
                 class="inbox-item"
                 th:classappend="${cv.chat.hasUnreadForAdmin} ? 'has-unread' : ''"
                 th:id="'inbox-' + ${cv.chat.id}"
                 th:data-chat-id="${cv.chat.id}"
                 th:data-student-name="${cv.chat.studentName}"
                 th:data-student-course="${cv.student != null and cv.student.courseProgram != null ? cv.student.courseProgram : ''}"
                 th:data-student-pic="${cv.student != null and cv.student.profilePicture != null ? cv.student.profilePicture : ''}"
                 th:data-student-initial="${cv.student != null ? #strings.substring(cv.student.name,0,1).toUpperCase() : 'S'}"
                 th:onclick="'openAdminChat(this)'"
            >
                <!-- Avatar -->
                <div class="av-ring"
                     th:style="${cv.student != null and cv.student.profilePicture != null} ? 'background:transparent;' : 'background:linear-gradient(135deg,#10b981,#059669);'">
                    <img th:if="${cv.student != null and cv.student.profilePicture != null}"
                         th:src="${cv.student.profilePicture.startsWith('http') ? cv.student.profilePicture : '/uploads/' + cv.student.profilePicture}"
                         alt="Student" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                    <span th:unless="${cv.student != null and cv.student.profilePicture != null}"
                          th:text="${cv.student != null ? #strings.substring(cv.student.name,0,1).toUpperCase() : 'S'}">S</span>
                    <div th:if="${cv.chat.hasUnreadForAdmin}" class="unread-dot"></div>
                </div>

                <div style="flex:1;overflow:hidden;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-weight:700;font-size:0.88rem;color:#1e293b;" th:text="${cv.chat.studentName}">Student</span>
                        <small style="font-size:0.68rem;color:#94a3b8;flex-shrink:0;margin-left:6px;" th:text="${cv.lastMsgTime}">Time</small>
                    </div>
                    <p style="margin:2px 0 0;font-size:0.78rem;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                       th:text="${(cv.lastSenderIsAdmin ? 'You: ' : '') + cv.lastMsg}">preview</p>
                    <div th:if="${cv.student != null and cv.student.courseProgram != null}"
                         style="font-size:0.65rem;color:#10b981;font-weight:700;margin-top:1px;text-transform:uppercase;letter-spacing:0.4px;"
                         th:text="${cv.student.courseProgram}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Chat panel -->
    <div class="chat-col" id="adminChatCol">

        <!-- Default (no selection) -->
        <div id="adminChatDefault" class="empty-pane">
            <div style="width:72px;height:72px;border-radius:50%;background:rgba(99,102,241,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
                <i class="bi bi-chat-heart-fill" style="font-size:2rem;color:#6366f1;"></i>
            </div>
            <div style="font-weight:700;font-size:0.95rem;color:#475569;margin-bottom:5px;">Select a student</div>
            <div style="font-size:0.8rem;color:#94a3b8;max-width:220px;line-height:1.5;">Click on a student from the list to open their conversation.</div>
        </div>

        <!-- Active chat header (shown by JS) -->
        <div id="adminActiveChatHeader" class="chat-header" style="display:none;">
            <button class="btn btn-light d-md-none p-1 me-1" onclick="closeAdminChat()" style="border-radius:8px;">
                <i class="bi bi-arrow-left fs-5"></i>
            </button>
            <div id="adminChatAvatar" class="av-sm" style="width:42px;height:42px;font-size:0.9rem;background:linear-gradient(135deg,#10b981,#059669);flex-shrink:0;border-radius:50%;"></div>
            <div style="flex:1;overflow:hidden;">
                <div id="adminChatName" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:0.95rem;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                <div id="adminChatCourse" style="font-size:0.68rem;color:#10b981;font-weight:700;"></div>
            </div>
            <div class="flex-shrink-0">
                <span style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.18);color:#4f46e5;padding:3px 10px;border-radius:50px;font-size:0.65rem;font-weight:800;display:inline-flex;align-items:center;gap:4px;">
                    <span id="liveIndicator" style="width:6px;height:6px;border-radius:50%;background:#6366f1;animation:blink-dot 1.5s ease-in-out infinite;display:inline-block;"></span>
                    ADMIN
                </span>
            </div>
        </div>

        <div id="adminChatMessages" class="chat-messages" style="display:none;"></div>

        <div id="adminChatInput" class="chat-input-area" style="display:none;">
            <div class="input-shell">
                <textarea id="adminMsgInput" placeholder="Type a message to student..." rows="1"></textarea>
                <button id="adminSendBtn" class="send-btn" onclick="adminSendMessage()">
                    <i class="bi bi-send-fill" style="font-size:0.82rem;"></i>
                </button>
            </div>
            <div style="text-align:center;margin-top:4px;font-size:0.62rem;color:#b0bec5;">
                <i class="bi bi-shield-lock-fill me-1"></i>Admin · Enter to send · Shift+Enter for new line
            </div>
        </div>
    </div>

</div>
</div>

<!-- Admin Sidebar -->
<div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='messages')}"></div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
    let currentChatId = null;
    let isSending = false;
    let sseConn = null;
    let sseActive = false;
    let typeQueue = [];
    let isTyping = false;
    let pollTimer = null;
    // ID-based deduplication — reset when switching chats
    let renderedIds = new Set();

    const msgsEl = document.getElementById('adminChatMessages');
    const esc = t => (t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

    function scrollToBottom() { if (msgsEl) setTimeout(() => msgsEl.scrollTop = msgsEl.scrollHeight, 50); }

    function drainQueue() {
        if (typeQueue.length === 0) { isTyping = false; return; }
        isTyping = true;
        const { el, text } = typeQueue.shift();
        el.classList.add('typing-cursor');
        let i = 0;
        const tick = () => {
            if (i < text.length) {
                el.innerHTML += esc(text.charAt(i++));
                scrollToBottom();
                setTimeout(tick, 28);
            } else { el.classList.remove('typing-cursor'); drainQueue(); }
        };
        tick();
    }

    function makeBubble(msg, isNew) {
        const isAdmin = !!msg.isSelf;
        const row = document.createElement('div');
        row.id = 'msg-' + msg.id;
        // Slack/Discord style: always left-aligned, no row-reverse + magical slide
        row.style.cssText = 'display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;padding:10px 14px;border-radius:12px;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;transform-origin:left center;border-left:3px solid transparent;';
        
        row.onmouseover = () => {
            row.style.background = isAdmin ? 'linear-gradient(90deg, rgba(99,102,241,0.04), transparent)' : 'linear-gradient(90deg, rgba(16,185,129,0.04), transparent)';
            row.style.borderLeftColor = isAdmin ? '#6366f1' : '#10b981';
            row.style.transform = 'translateX(4px)';
        };
        row.onmouseout = () => {
            row.style.background = 'transparent';
            row.style.borderLeftColor = 'transparent';
            row.style.transform = 'translateX(0)';
        };

        // Avatar
        const avDiv = document.createElement('div');
        avDiv.className = 'av-sm';
        if (isAdmin) {
            avDiv.style.cssText = 'background:linear-gradient(135deg,#6366f1,#4f46e5);width:34px;height:34px;font-size:0.9rem;';
            avDiv.textContent = 'A';
        } else {
            const pic = msg.senderProfilePicture;
            if (pic) {
                const src = pic.startsWith('http') ? pic : '/uploads/' + pic;
                avDiv.style.cssText = 'background:transparent;width:34px;height:34px;';
                avDiv.innerHTML = `<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
            } else {
                avDiv.style.cssText = 'background:linear-gradient(135deg,#10b981,#059669);width:34px;height:34px;font-size:0.9rem;';
                avDiv.textContent = (msg.senderName || 'S').charAt(0).toUpperCase();
            }
        }
        row.appendChild(avDiv);

        const contentCol = document.createElement('div');
        contentCol.style.cssText = 'flex:1;min-width:0;';

        const headerRow = document.createElement('div');
        headerRow.style.cssText = 'display:flex;align-items:baseline;gap:8px;margin-bottom:2px;';
        
        const nameEl = document.createElement('span');
        nameEl.style.cssText = 'font-weight:700;font-size:0.9rem;color:#0f172a;letter-spacing:-0.2px;';
        nameEl.textContent = isAdmin ? 'You (Admin)' : (msg.senderName || 'Student');
        
        const timeEl = document.createElement('span');
        timeEl.style.cssText = 'font-size:0.72rem;color:#94a3b8;font-weight:500;';
        timeEl.textContent = msg.time || '';
        
        headerRow.appendChild(nameEl);
        headerRow.appendChild(timeEl);

        const textEl = document.createElement('div');
        textEl.style.cssText = 'font-size:0.92rem;color:#334155;line-height:1.55;word-break:break-word;';

        contentCol.appendChild(headerRow);
        contentCol.appendChild(textEl);
        row.appendChild(contentCol);

        if (!isAdmin && isNew) {
            typeQueue.push({ el: textEl, text: msg.messageText || '' });
            if (!isTyping) drainQueue();
        } else {
            textEl.innerHTML = esc(msg.messageText || '');
        }
        return row;
    }

    function renderMessages(msgs, isNew) {
        if (!Array.isArray(msgs) || msgs.length === 0) return;
        let added = 0;
        for (const msg of msgs) {
            const msgId = msg.id;
            if (!msgId || renderedIds.has(msgId)) continue;
            renderedIds.add(msgId);
            msgsEl.appendChild(makeBubble(msg, isNew));
            added++;
        }
        if (added > 0) scrollToBottom();
    }

    function connectSSE(chatId) {
        if (sseConn) { try { sseConn.close(); } catch(e){} }
        sseActive = false; typeQueue = []; isTyping = false;
        renderedIds = new Set();
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

        // 1. Fetch history immediately via HTTP (most reliable)
        fetch('/admin/chat/' + chatId + '/messages', { credentials: 'same-origin' })
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(d => { if (d.success && Array.isArray(d.messages)) renderMessages(d.messages, false); })
            .catch(e => console.log('Admin history fetch failed:', e));

        // 2. Connect SSE for live updates
        const es = new EventSource('/admin/chat/' + chatId + '/stream');
        sseConn = es;
        es.addEventListener('init', e => { try { renderMessages(JSON.parse(e.data), false); sseActive = true; } catch(err){} });
        es.addEventListener('message', e => { try { renderMessages(JSON.parse(e.data), true); } catch(err){} });
        es.onerror = () => {
            es.close(); sseActive = false;
            if (!pollTimer) {
                pollTimer = setInterval(() => {
                    if (sseActive || currentChatId !== chatId) { clearInterval(pollTimer); pollTimer = null; return; }
                    fetch('/admin/chat/' + chatId + '/messages', { credentials: 'same-origin' })
                        .then(r => r.json())
                        .then(d => { if (d.success) renderMessages(d.messages, true); })
                        .catch(() => {});
                }, 3000);
            }
        };
    }

    function fallbackPoll(chatId) {
        if (sseActive || currentChatId !== chatId) return;
        fetch('/admin/chat/' + chatId + '/messages', { credentials: 'same-origin' })
            .then(r => r.json())
            .then(d => { if (d.success) renderMessages(d.messages, true); })
            .catch(() => {})
            .finally(() => setTimeout(() => fallbackPoll(chatId), 3000));
    }

    window.openAdminChat = function(el) {
        const chatId      = el.dataset.chatId;
        const name        = el.dataset.studentName || 'Student';
        const course      = el.dataset.studentCourse || '';
        const pic         = el.dataset.studentPic || '';
        const initial     = el.dataset.studentInitial || 'S';
        currentChatId = chatId;

        // Highlight
        document.querySelectorAll('.inbox-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const dot = el.querySelector('.unread-dot'); if (dot) dot.remove();
        const badge = el.querySelector('[style*="background:#6366f1"]'); if (badge && badge.tagName==='SPAN') badge.remove();
        el.classList.remove('has-unread');

        // Update header
        const avatarEl = document.getElementById('adminChatAvatar');
        if (avatarEl) {
            if (pic) {
                const src = pic.startsWith('http') ? pic : '/uploads/' + pic;
                avatarEl.innerHTML = `<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                avatarEl.style.background = 'transparent';
            } else {
                avatarEl.innerHTML = initial;
                avatarEl.style.background = 'linear-gradient(135deg,#10b981,#059669)';
            }
        }
        const nameEl2 = document.getElementById('adminChatName');
        if (nameEl2) nameEl2.textContent = name;
        const courseEl = document.getElementById('adminChatCourse');
        if (courseEl) courseEl.textContent = course ? '📚 ' + course.toUpperCase() : '';

        document.getElementById('adminActiveChatHeader').style.display = 'flex';
        document.getElementById('adminChatMessages').style.display = 'flex';
        document.getElementById('adminChatInput').style.display = 'block';
        document.getElementById('adminChatDefault').style.display = 'none';

        if (window.innerWidth <= 768) {
            document.getElementById('adminMsgContainer').classList.add('chat-open');
        }
        if (msgsEl) msgsEl.innerHTML = ''; // clear before fetch
        connectSSE(chatId);
    };

    window.closeAdminChat = function() {
        document.getElementById('adminMsgContainer').classList.remove('chat-open');
    };

    window.adminSendMessage = function() {
        const input = document.getElementById('adminMsgInput');
        const sendBtn = document.getElementById('adminSendBtn');
        const text = input ? input.value.trim() : '';
        if (!text || !currentChatId || isSending) return;
        isSending = true;
        if (sendBtn) sendBtn.disabled = true;

        const tempId = 'temp-' + Date.now();
        // Optimistic bubble
        msgsEl.appendChild(makeBubble({
            id: tempId,
            isSelf: true, senderName: 'Admin',
            messageText: text,
            time: new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})
        }, false));
        scrollToBottom();
        if (input) { input.value = ''; input.style.height = 'auto'; }

        // Get CSRF Token safely (meta tag with cookie fallback)
        let csrfToken = '';
        let csrfHeader = 'X-XSRF-TOKEN';
        const metaToken = document.querySelector('meta[name="_csrf"]');
        if (metaToken) {
            csrfToken = metaToken.getAttribute('content');
            csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        } else {
            const match = document.cookie.match(new RegExp('(^| )XSRF-TOKEN=([^;]+)'));
            if (match) csrfToken = match[2];
        }

        const fd = new FormData();
        fd.append('messageText', text);
        fetch('/admin/chat/' + currentChatId + '/send', { 
            method:'POST', 
            body:fd, 
            headers: { [csrfHeader]: csrfToken },
            credentials:'same-origin' 
        })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    const el = document.getElementById('msg-' + tempId);
                    if (el) el.id = 'msg-' + d.id;
                }
            })
            .finally(() => {
                isSending = false;
                if (sendBtn) sendBtn.disabled = false;
                if (input) input.focus();
            });
    };

    // Textarea auto-resize + Enter to send
    const adminInput = document.getElementById('adminMsgInput');
    if (adminInput) {
        adminInput.addEventListener('input', () => {
            adminInput.style.height = 'auto';
            adminInput.style.height = Math.min(adminInput.scrollHeight, 110) + 'px';
        });
        adminInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.adminSendMessage(); }
        });
    }

    // CSS animation for live dot
    const s = document.createElement('style');
    s.textContent = '@keyframes blink-dot{0%,100%{opacity:1}50%{opacity:0.2}}';
    document.head.appendChild(s);
})();
</script>
</body>
</html>
