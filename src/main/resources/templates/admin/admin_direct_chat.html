<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="'Chat · ' + ${student != null ? student.name : chat.studentName} + ' | 4LAZIE Admin'">Admin Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSRF -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #0b0f19;
            --surface:     #131929;
            --surface2:    #1a2236;
            --border:      rgba(255,255,255,0.07);
            --sent-from:   #10b981;
            --sent-to:     #06b6d4;
            --recv-bg:     rgba(255,255,255,0.07);
            --recv-border: rgba(255,255,255,0.10);
            --text:        #e2e8f0;
            --muted:       #64748b;
            --accent:      #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
        }

        /* ── BACKGROUND GLOW ── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse 60% 40% at 10% 0%,   rgba(16,185,129,0.15), transparent),
                radial-gradient(ellipse 50% 35% at 90% 100%, rgba(6,182,212,0.12),  transparent);
            pointer-events: none;
        }

        /* ══ NAVBAR ══════════════════════════════════════ */
        .chat-nav {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            background: rgba(11,15,25,0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .chat-nav::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--sent-from) 40%, var(--sent-to) 60%, transparent);
            opacity: 0.6;
        }

        .back-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(16,185,129,0.2);
            border-color: var(--sent-from);
            color: #6ee7b7;
            transform: translateX(-2px);
        }

        .nav-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--sent-from), var(--sent-to));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit', sans-serif; font-weight: 900;
            font-size: 1rem; color: white; flex-shrink: 0;
            box-shadow: 0 0 0 2px rgba(16,185,129,0.4), 0 4px 16px rgba(16,185,129,0.3);
            position: relative;
        }
        .nav-avatar .online-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 11px; height: 11px; border-radius: 50%;
            background: #22c55e;
            border: 2px solid var(--bg);
            animation: pulse-green 2s ease-in-out infinite;
        }
        @keyframes pulse-green {
            0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
            50%      { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
        }

        .nav-info { flex: 1; min-width: 0; }
        .nav-info h6 {
            font-family: 'Outfit', sans-serif; font-weight: 800;
            font-size: 0.95rem; color: #f1f5f9; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .nav-info small {
            font-size: 0.68rem; color: #22c55e; font-weight: 600; letter-spacing: 0.3px;
        }

        .nav-badge {
            background: linear-gradient(135deg, var(--sent-from), var(--sent-to));
            color: white; padding: 4px 14px; border-radius: 50px;
            font-size: 0.65rem; font-weight: 800; letter-spacing: 1px;
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap; flex-shrink: 0;
        }
        .live-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #fff;
            animation: blink-d 1.4s ease-in-out infinite;
        }
        @keyframes blink-d { 0%,100%{opacity:1} 50%{opacity:0.2} }

        /* ══ CHAT BODY ═══════════════════════════════════ */
        .chat-body {
            flex: 1; overflow-y: auto;
            padding: 18px 16px;
            display: flex; flex-direction: column; gap: 2px;
            background: var(--bg);
        }
        .chat-body::-webkit-scrollbar { width: 4px; }
        .chat-body::-webkit-scrollbar-track { background: transparent; }
        .chat-body::-webkit-scrollbar-thumb { background: rgba(16,185,129,0.3); border-radius: 2px; }

        /* Date separator */
        .date-sep { text-align: center; margin: 16px 0 8px; }
        .date-sep span {
            background: rgba(255,255,255,0.06);
            color: var(--muted); font-size: 0.65rem; font-weight: 700;
            letter-spacing: 1.2px; padding: 4px 14px; border-radius: 50px;
            text-transform: uppercase; border: 1px solid var(--border);
        }

        /* ── MESSAGE ROW ── */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 2px 0;
            /* Incoming from left */
            opacity: 0;
            transform: translateX(-32px) scale(0.95);
            animation: slideInL 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        .msg-row.self {
            flex-direction: row-reverse;
            transform: translateX(32px) scale(0.95);
            animation: slideInR 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        @keyframes slideInL {
            from { opacity:0; transform: translateX(-32px) scale(0.95); }
            to   { opacity:1; transform: translateX(0)     scale(1); }
        }
        @keyframes slideInR {
            from { opacity:0; transform: translateX(32px)  scale(0.95); }
            to   { opacity:1; transform: translateX(0)     scale(1); }
        }

        /* Avatar small */
        .av-xs {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit', sans-serif; font-weight: 900;
            font-size: 0.72rem; color: white; flex-shrink: 0;
            overflow: hidden;
        }
        .av-xs img { width: 100%; height: 100%; object-fit: cover; }

        /* Content column */
        .msg-col {
            display: flex; flex-direction: column;
            max-width: 68%; gap: 4px;
        }
        .msg-row.self .msg-col { align-items: flex-end; }
        .msg-row:not(.self) .msg-col { align-items: flex-start; }

        /* Sender label */
        .msg-label {
            font-size: 0.67rem; font-weight: 700;
            color: var(--muted); padding: 0 4px; letter-spacing: 0.3px;
        }
        .msg-row.self .msg-label { color: #6ee7b7; }

        /* Bubble */
        .bubble {
            padding: 10px 16px;
            font-size: 0.875rem; line-height: 1.65;
            word-break: break-word;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1),
                        box-shadow 0.2s ease;
            cursor: default;
        }
        .bubble:hover { transform: scale(1.018); }

        /* Received (left) — frosted glass dark */
        .bubble.recv {
            background: var(--recv-bg);
            border: 1px solid var(--recv-border);
            border-radius: 4px 18px 18px 18px;
            color: var(--text);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        /* Sent (right) — vibrant violet→cyan gradient */
        .bubble.sent {
            background: linear-gradient(135deg, var(--sent-from) 0%, var(--sent-to) 100%);
            border-radius: 18px 4px 18px 18px;
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(16,185,129,0.45);
            border: none;
        }
        .bubble.sent::before {
            content: '';
            position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
            pointer-events: none;
        }

        .b-time {
            font-size: 0.58rem; display: block; margin-top: 5px;
            opacity: 0.5; letter-spacing: 0.2px;
        }
        .bubble.sent .b-time { text-align: right; }
        .bubble.recv .b-time { text-align: left; color: var(--muted); }

        /* Typing cursor */
        .typing-cursor::after {
            content: '▋'; animation: blink-c 0.7s step-start infinite;
            opacity: 0.8;
        }
        @keyframes blink-c { 50% { opacity:0; } }

        /* Typing dots (incoming) */
        .typing-row { display: none; }
        .typing-row.show { display: flex; }
        .dot-bub {
            background: var(--recv-bg); border: 1px solid var(--recv-border);
            border-radius: 18px; padding: 12px 16px;
            display: flex; gap: 5px; align-items: center;
            backdrop-filter: blur(8px);
        }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--muted); animation: dotB 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.30s; }
        @keyframes dotB { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }

        /* Empty state */
        .empty-wrap {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px; gap: 12px;
        }
        .empty-icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(6,182,212,0.1));
            border: 1px solid rgba(16,185,129,0.25);
            display: flex; align-items: center; justify-content: center;
        }
        .empty-wrap p { font-size: 0.82rem; color: var(--muted); max-width: 220px; line-height: 1.6; }

        /* ══ INPUT AREA ════════════════════════════════ */
        .input-area {
            background: rgba(11,15,25,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 12px 16px 16px;
            flex-shrink: 0;
        }
        .input-shell {
            display: flex; align-items: flex-end; gap: 10px;
            background: var(--surface2);
            border: 1.5px solid rgba(16,185,129,0.2);
            border-radius: 22px; padding: 10px 14px;
            transition: all 0.3s ease;
        }
        .input-shell:focus-within {
            border-color: var(--sent-from);
            box-shadow: 0 0 0 4px rgba(16,185,129,0.12), 0 4px 24px rgba(16,185,129,0.15);
        }
        #msgInput {
            flex: 1; border: none; outline: none;
            background: transparent;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
            color: var(--text); resize: none;
            max-height: 120px; min-height: 24px; line-height: 1.5;
        }
        #msgInput::placeholder { color: var(--muted); }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--sent-from), var(--sent-to));
            border: none; color: white; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
                        box-shadow 0.3s ease;
            box-shadow: 0 4px 16px rgba(16,185,129,0.5);
        }
        .send-btn:hover { transform: scale(1.14) rotate(10deg); box-shadow: 0 6px 24px rgba(16,185,129,0.65); }
        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { background: var(--surface2); box-shadow: none; transform: none; cursor: not-allowed; }
        .input-hint {
            text-align: center; margin-top: 6px;
            font-size: 0.62rem; color: #334155; letter-spacing: 0.3px;
        }

        @media (max-width: 576px) { .msg-col { max-width: 82%; } }
    </style>
</head>
<body>

    <!-- ══ NAVBAR ══ -->
    <div class="chat-nav">
        <a th:href="@{'/admin/users/' + ${chat.studentId} + '/profile'}" class="back-btn">
            <i class="bi bi-arrow-left" style="font-size:0.9rem;"></i>
        </a>

        <div class="nav-avatar">
            <span th:text="${student != null ? #strings.substring(student.name,0,1).toUpperCase() : #strings.substring(chat.studentName,0,1).toUpperCase()}">S</span>
            <div class="online-dot"></div>
        </div>

        <div class="nav-info">
            <h6 th:text="${student != null ? student.name : chat.studentName}">Student</h6>
            <small><i class="bi bi-circle-fill" style="font-size:0.5rem;"></i> Active now</small>
        </div>

        <div class="nav-badge">
            <div class="live-dot"></div>
            <i class="bi bi-shield-fill"></i> ADMIN
        </div>
    </div>

    <!-- ══ CHAT BODY ══ -->
    <div class="chat-body" id="chatBody">

        <div class="empty-wrap" id="emptyEl">
            <div class="empty-icon">
                <i class="bi bi-chat-heart-fill" style="font-size:2rem; background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i>
            </div>
            <strong style="color:#e2e8f0; font-family:'Outfit',sans-serif;">Start the conversation</strong>
            <p>Send a message to connect directly with <strong th:text="${student != null ? student.name : chat.studentName}" style="color:#6ee7b7;">this student</strong>.</p>
        </div>

        <div id="msgWrap"></div>

        <!-- Typing indicator -->
        <div class="msg-row typing-row" id="typingIndicator">
            <div class="av-xs" style="background:linear-gradient(135deg,#06b6d4,#10b981);">S</div>
            <div class="dot-bub">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>
    </div>

    <!-- ══ INPUT ══ -->
    <div class="input-area">
        <div class="input-shell">
            <textarea id="msgInput" placeholder="Type a message..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" title="Send">
                <i class="bi bi-send-fill" style="font-size:0.85rem;"></i>
            </button>
        </div>
        <div class="input-hint">
            <i class="bi bi-lock-fill"></i> Private &bull; Enter to send &bull; Shift+Enter for new line
        </div>
    </div>

    <input type="hidden" id="CHAT_ID" th:value="${chat.id}">

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
    (() => {
        const CHAT_ID  = document.getElementById('CHAT_ID').value;
        const SSE_URL  = `/admin/chat/${CHAT_ID}/stream`;
        const SEND_URL = `/admin/chat/${CHAT_ID}/send`;
        const POLL_URL = `/admin/chat/${CHAT_ID}/messages`;

        const chatBody = document.getElementById('chatBody');
        const msgWrap  = document.getElementById('msgWrap');
        const emptyEl  = document.getElementById('emptyEl');
        const input    = document.getElementById('msgInput');
        const sendBtn  = document.getElementById('sendBtn');

        let rendered    = 0;
        let isSending   = false;
        let sseActive   = false;
        let typingQueue = [];
        let isTyping    = false;

        const esc = t => String(t)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/\n/g,'<br>');

        function avatarHtml(isSelf, name, pic) {
            if (isSelf) {
                return `<div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:900;font-size:0.7rem;font-family:'Outfit',sans-serif;box-shadow:0 0 0 2px rgba(16,185,129,0.4);">Y</div>`;
            }
            if (pic) {
                const src = pic.startsWith('http') ? pic : '/uploads/' + pic;
                return `<div style="width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(6,182,212,0.3);"><img src="${src}" style="width:100%;height:100%;object-fit:cover;"></div>`;
            }
            const ini = (name || 'S').charAt(0).toUpperCase();
            return `<div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#10b981);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:900;font-size:0.72rem;font-family:'Outfit',sans-serif;box-shadow:0 0 0 2px rgba(6,182,212,0.3);">${ini}</div>`;
        }

        function makeBubble(msg, typeIt = false) {
            const isSelf = msg.isSelf;

            const row = document.createElement('div');
            row.className = 'msg-row' + (isSelf ? ' self' : '');
            row.id = 'msg-' + msg.id;

            const avW = document.createElement('div');
            avW.innerHTML = avatarHtml(isSelf, msg.senderName, msg.senderProfilePicture);
            row.appendChild(avW.firstElementChild);

            const col = document.createElement('div');
            col.className = 'msg-col';

            const label = document.createElement('span');
            label.className = 'msg-label';
            label.textContent = isSelf ? 'You (Admin)' : (msg.senderName || 'Student');
            col.appendChild(label);

            const bubble = document.createElement('div');
            bubble.className = 'bubble ' + (isSelf ? 'sent' : 'recv');

            const textEl = document.createElement('div');
            const timeEl = document.createElement('span');
            timeEl.className = 'b-time';
            timeEl.textContent = msg.time || '';

            bubble.appendChild(textEl);
            bubble.appendChild(timeEl);
            col.appendChild(bubble);
            row.appendChild(col);

            if (typeIt && !isSelf) {
                typingQueue.push({ el: textEl, text: msg.messageText || '' });
                if (!isTyping) drainQueue();
            } else {
                textEl.innerHTML = esc(msg.messageText || '');
            }

            return row;
        }

        function drainQueue() {
            if (!typingQueue.length) { isTyping = false; return; }
            isTyping = true;
            const { el, text } = typingQueue.shift();
            el.classList.add('typing-cursor');
            let i = 0;
            const tick = () => {
                if (i < text.length) {
                    el.innerHTML += esc(text.charAt(i++));
                    scrollBot(false);
                    setTimeout(tick, 22);
                } else {
                    el.classList.remove('typing-cursor');
                    drainQueue();
                }
            };
            tick();
        }

        function renderMessages(msgs, isNew = false) {
            if (!Array.isArray(msgs) || !msgs.length) return;
            emptyEl.style.display = 'none';
            const start = rendered;
            for (let i = start; i < msgs.length; i++) {
                msgWrap.appendChild(makeBubble(msgs[i], isNew && i >= start));
            }
            rendered = msgs.length;
            scrollBot(isNew);
        }

        function scrollBot(smooth = true) {
            chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
        }

        function connectSSE() {
            const es = new EventSource(SSE_URL);
            es.addEventListener('init', e => {
                try { renderMessages(JSON.parse(e.data), false); } catch(err){}
                scrollBot(false); sseActive = true;
            });
            es.addEventListener('message', e => {
                try { renderMessages(JSON.parse(e.data), true); } catch(err){}
            });
            es.onerror = () => {
                es.close(); sseActive = false;
                setTimeout(fallbackPoll, 1500);
            };
        }

        function fallbackPoll() {
            if (sseActive) return;
            fetch(POLL_URL, { credentials: 'same-origin' })
                .then(r => r.json())
                .then(d => { if (d.success) renderMessages(d.messages, true); })
                .catch(() => {})
                .finally(() => setTimeout(fallbackPoll, 1500));
        }

        function sendMessage() {
            const text = input.value.trim();
            if (!text || isSending) return;
            isSending = true; sendBtn.disabled = true;
            input.value = ''; input.style.height = 'auto';

            let csrfToken = '', csrfHeader = 'X-XSRF-TOKEN';
            const metaT = document.querySelector('meta[name="_csrf"]');
            if (metaT) {
                csrfToken  = metaT.getAttribute('content');
                csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
            } else {
                const m = document.cookie.match(/(^| )XSRF-TOKEN=([^;]+)/);
                if (m) csrfToken = m[2];
            }
            const fd = new FormData();
            fd.append('messageText', text);
            fetch(SEND_URL, {
                method:'POST', body:fd,
                headers:{ [csrfHeader]: csrfToken },
                credentials:'same-origin'
            })
            .then(r => r.json())
            .catch(() => ({ success:false }))
            .finally(() => { isSending = false; sendBtn.disabled = false; input.focus(); });
        }

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        sendBtn.addEventListener('click', sendMessage);

        connectSSE();
        setTimeout(() => scrollBot(false), 300);
    })();
    </script>
</body>
</html>
