<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Gaps - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
    <link rel="stylesheet" th:href="@{/css/responsive-system.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>

    <!-- Premium Admin Navbar -->
    <nav class="navbar sticky-top py-2" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(16,185,129,0.15); box-shadow: 0 10px 30px rgba(16,185,129,0.05); z-index: 1040;">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap">
            <a class="navbar-brand d-flex align-items-center text-decoration-none flex-shrink-1 overflow-hidden me-2" th:href="${session.user != null ? '/admin/dashboard' : '/'}">
                <div class="d-flex align-items-center justify-content-center me-2 flex-shrink-0" style="width: 34px; height: 34px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; box-shadow: 0 6px 15px rgba(16,185,129,0.35);">
                    <i class="bi bi-shield-check text-white" style="font-size: 1rem;"></i>
                </div>
                <div class="d-flex align-items-center text-nowrap">
                    <div style="background-color: #111111; border: 3px solid #10b981; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);">
                        <span style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.25rem; letter-spacing: 2px; line-height: 1; text-transform: uppercase;">4LAZIE</span>
                    </div>
                    <span class="admin-brand-text ms-1" style="font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN</span>
                </div>
            </a>
            <div class="flex-shrink-0" th:replace="~{fragments/top_actions :: actions}"></div>
        </div>
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(16,185,129,0.8) 50%, transparent 100%); box-shadow: 0 -2px 15px rgba(16,185,129,0.4);"></div>
    </nav>
    <style>
        .admin-brand-text { font-size: 1.6rem; }
        @media (max-width: 576px) { .admin-brand-text { font-size: 1.15rem; } }
        @media (min-width: 577px) and (max-width: 768px) { .admin-brand-text { font-size: 1.3rem; } }
        .gap-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 16px; padding: 16px; transition: box-shadow 0.2s ease; }
        .gap-card:hover { box-shadow: 0 8px 24px rgba(16,185,129,0.08); }
        .missing-badge { background: rgba(220,38,38,0.08); color: #dc2626; font-weight: 600; padding: 4px 10px; border-radius: 8px; font-size: 0.72rem; }
    </style>

    <div class="container py-4">
        <div class="row g-4">
            <div class="col-lg-12">
                <div class="position-relative" style="padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); border-radius: 24px;">
                    <button class="btn btn-sm btn-success position-absolute top-0 end-0 mt-3 me-3 d-flex align-items-center rounded-pill px-3 shadow-sm" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
                        <i class="bi bi-list me-2"></i> Admin Menu
                    </button>

                    <div class="text-center mb-4">
                        <div class="mx-auto mb-1 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; background: linear-gradient(135deg, rgba(220,38,38,0.15), rgba(220,38,38,0.05)); border-radius: 14px; box-shadow: 0 10px 25px rgba(220,38,38,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(220,38,38,0.2);">
                            <i class="bi bi-patch-question-fill" style="font-size: 1.5rem; color: #dc2626;"></i>
                        </div>
                        <h1 class="fw-bolder mb-1" style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase;">CONTENT GAPS</h1>
                        <p style="color: #94a3b8; font-size: 0.85rem;">
                            Subjects still missing one or more of Quiz, Exercise, Possible Qns, UE Qns, CAT 1 or CAT 2.
                        </p>
                    </div>

                    <h6 class="fw-bold mb-3" style="color: #1e293b; letter-spacing: 0.5px;">
                        INCOMPLETE <span class="badge rounded-pill bg-danger ms-1" th:text="${#lists.size(gaps)}">0</span>
                        <span class="text-muted fw-normal" style="font-size: 0.8rem;" th:text="'of ' + ${totalSubjects} + ' subjects'"></span>
                    </h6>

                    <div class="d-flex flex-column gap-3 mb-2">
                        <div th:each="g : ${gaps}" class="gap-card">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                                <div style="min-width: 0; flex: 1 1 300px;">
                                    <div class="fw-bold mb-1" style="color: #1e293b; font-size: 0.95rem;" th:text="${g.subject.name}">Subject</div>
                                    <div class="mb-2" style="font-size: 0.78rem; color: #94a3b8;"
                                         th:text="'Level ' + ${g.subject.levelNo} + ', Semester ' + ${g.subject.semesterNo}">Level 1, Semester 1</div>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span class="missing-badge" th:each="c : ${g.missingCategories}" th:text="${c}">CATEGORY</span>
                                    </div>
                                </div>
                                <a th:href="@{/admin/questions}" class="btn btn-sm flex-shrink-0" style="background: rgba(16,185,129,0.1); color: #059669; border: 1px solid rgba(16,185,129,0.2); border-radius: 10px; font-weight: 600; font-size: 0.75rem; padding: 6px 14px;">
                                    <i class="bi bi-plus-circle me-1"></i>ADD QUESTIONS
                                </a>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(gaps)}" class="text-center py-5" style="color: #94a3b8;">
                            <i class="bi bi-check2-circle" style="font-size: 2rem; display: block; margin-bottom: 8px; color: #10b981;"></i>
                            Every subject already has all 5 practice categories covered.
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='questions')}"></div>
        </div>
    </div>

    <div style="border-top: 1px solid #e2e8f0; background: #ffffff;">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
