<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Requests - 4LAZIE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
    <link rel="stylesheet" th:href="@{/css/responsive-system.css}">

    <style>
        body { background: #f8fafc; min-height: 100vh; }
        .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); overflow: hidden; pointer-events: none; }
        .ambient-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: orbFloat 20s infinite alternate ease-in-out; }
        .ambient-orb-1 { width: 500px; height: 500px; background: rgba(16, 185, 129, 0.2); top: -100px; left: -100px; }
        .ambient-orb-2 { width: 400px; height: 400px; background: rgba(5, 150, 105, 0.15); bottom: 10%; right: -50px; animation-delay: -5s; }
        @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -50px) scale(1.1); } }

        .premium-table-container { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 40px rgba(16, 185, 129, 0.08); overflow: hidden; padding: 2px; }
        .table-responsive-wrapper { background: #ffffff; border-radius: 22px; overflow: hidden; }
        .table { margin-bottom: 0; }
        .table thead { background: rgba(248, 250, 252, 0.8); border-bottom: 2px solid rgba(16, 185, 129, 0.1); }
        .table thead th { color: #64748b; font-weight: 600; font-size: 0.75rem; letter-spacing: 0.5px; padding: 16px; border: none; text-transform: uppercase; }
        .table tbody tr { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-bottom: 1px solid #f1f5f9; }
        .table tbody tr:hover { background: rgba(16, 185, 129, 0.03); }
        .table td { padding: 16px; vertical-align: middle; border: none; }

        .btn-approve { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-approve:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); color: white; }
        .btn-reject { background: white; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; transition: all 0.3s ease; }
        .btn-reject:hover { background: #ef4444; color: white; transform: translateY(-2px); }

        .empty-state { padding: 60px 20px; text-align: center; }
        .empty-icon-wrap { width: 80px; height: 80px; margin: 0 auto 20px; background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.05)); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

    <div class="ambient-bg">
        <div class="ambient-orb ambient-orb-1"></div>
        <div class="ambient-orb ambient-orb-2"></div>
    </div>

    <nav class="navbar sticky-top py-2" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border-bottom: 1px solid rgba(16,185,129,0.15); box-shadow: 0 10px 30px rgba(16,185,129,0.05); z-index: 1040;">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap">
            <a class="navbar-brand d-flex align-items-center text-decoration-none flex-shrink-1 overflow-hidden me-2" th:href="${session.user != null ? '/admin/dashboard' : '/'}">
                <div class="d-flex align-items-center justify-content-center me-2 flex-shrink-0" style="width: 34px; height: 34px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; box-shadow: 0 6px 15px rgba(16,185,129,0.35);">
                    <i class="bi bi-patch-check-fill text-white" style="font-size: 1rem;"></i>
                </div>
                <div class="d-flex align-items-center text-nowrap">
                    <div style="background-color: #111111; border: 3px solid #10b981; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center;">
                        <span style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.25rem; letter-spacing: 2px;">4LAZIE</span>
                    </div>
                    <span class="admin-brand-text ms-1" style="font-family: 'Outfit', sans-serif; font-weight: 900; background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ADMIN</span>
                </div>
            </a>
            <div class="flex-shrink-0" th:replace="~{fragments/top_actions :: actions}"></div>
        </div>
    </nav>
    <style>
        .admin-brand-text { font-size: 1.6rem; }
        @media (max-width: 576px) { .admin-brand-text { font-size: 1.15rem; } }
        @media (min-width: 577px) and (max-width: 768px) { .admin-brand-text { font-size: 1.3rem; } }
    </style>

    <div class="container my-4">
        <div th:if="${success != null or error != null}" class="premium-toast-container">
            <div th:if="${success}" class="premium-toast" id="toastSuccess">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="premium-toast error" id="toastError">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <div class="row g-4 position-relative">
            <div class="d-flex justify-content-end w-100 position-absolute" style="top: 0; right: 10px; z-index: 5;">
                <button class="btn btn-sm btn-success d-flex align-items-center rounded-pill px-3 shadow-sm" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar" style="background: white; color: #10b981; border: 1px solid rgba(16,185,129,0.2);">
                    <i class="bi bi-list me-2"></i> Admin Menu
                </button>
            </div>

            <div class="col-12 mt-5">
                <div class="text-center mb-4">
                    <div class="mx-auto mb-2 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; background: linear-gradient(135deg, rgba(16, 185, 129,0.15), rgba(5, 150, 105,0.05)); border-radius: 16px; box-shadow: 0 10px 25px rgba(16, 185, 129,0.2); border: 1px solid rgba(16, 185, 129,0.2);">
                        <i class="bi bi-patch-check-fill" style="font-size: 2rem; color: #10b981;"></i>
                    </div>
                    <h1 class="fw-bolder mb-2" style="font-family: 'Outfit', sans-serif; font-size: 2.2rem; background: linear-gradient(135deg, #1e293b 0%, #334155 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Verification Requests</h1>
                    <p class="text-muted" style="font-size: 1rem;">Approve or reject students requesting the verified badge.</p>
                </div>

                <div class="premium-table-container">
                    <div class="table-responsive-wrapper">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Requester</th>
                                    <th>Reason</th>
                                    <th>Date Requested</th>
                                    <th class="text-end pe-4">Decide</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="req : ${requests}">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(16,185,129,0.1); display: flex; align-items: center; justify-content: center; color: #10b981; font-size: 1.1rem; overflow: hidden;">
                                                <img th:if="${requesters.get(req.userId) != null and requesters.get(req.userId).profilePicture != null}" th:src="${requesters.get(req.userId).profilePicture}" style="width:100%; height:100%; object-fit:cover;">
                                                <i th:unless="${requesters.get(req.userId) != null and requesters.get(req.userId).profilePicture != null}" class="bi bi-person-badge-fill"></i>
                                            </div>
                                            <div>
                                                <div class="fw-bold text-dark" style="font-size: 0.95rem; line-height: 1.2;" th:text="${requesters.get(req.userId) != null ? requesters.get(req.userId).name : 'Unknown user'}">Name</div>
                                                <small class="text-muted" style="font-size: 0.75rem;" th:text="${requesters.get(req.userId) != null ? requesters.get(req.userId).email : ''}">email</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td style="max-width: 320px;">
                                        <span class="badge rounded-pill mb-1" style="background: rgba(16,185,129,0.1); color: #059669; font-size: 0.7rem; font-weight: 700;" th:text="${req.category != null ? #strings.replace(req.category, '_', ' ') : 'OTHER'}">CATEGORY</span>
                                        <div style="font-size: 0.88rem; color: #334155;" th:text="${req.reason}">Reason</div>
                                    </td>
                                    <td style="color: #64748b; font-size: 0.9rem;" th:text="${#temporals.format(req.requestDate, 'dd MMM yyyy, HH:mm')}">Date</td>
                                    <td class="text-end pe-4">
                                        <div class="d-flex justify-content-end gap-2">
                                            <form th:action="@{/admin/verification-requests/{id}/approve(id=${req.id})}" method="post">
                                                <button type="submit" class="btn-approve"><i class="bi bi-check-lg me-1"></i> Approve</button>
                                            </form>
                                            <form th:action="@{/admin/verification-requests/{id}/reject(id=${req.id})}" method="post">
                                                <button type="submit" class="btn-reject"><i class="bi bi-x-lg"></i> Reject</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${requests.empty}">
                                    <td colspan="4">
                                        <div class="empty-state">
                                            <div class="empty-icon-wrap">
                                                <i class="bi bi-patch-check-fill" style="font-size: 2.5rem; color: #10b981;"></i>
                                            </div>
                                            <h4 class="fw-bolder" style="font-family: 'Outfit', sans-serif; color: #1e293b;">No pending requests</h4>
                                            <p class="text-muted mx-auto" style="max-width: 400px;">Nobody is currently waiting for badge verification.</p>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='verification-requests')}"></div>
        </div>
    </div>

    <div style="margin-top: 60px;">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
