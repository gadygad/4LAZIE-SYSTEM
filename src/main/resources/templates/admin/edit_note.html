<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
    <link rel="stylesheet" th:href="@{/css/responsive-system.css}">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .edit-card { max-width: 640px; margin: 40px auto; padding: 32px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 8px 32px rgba(16,185,129,0.1); border-radius: 24px; }
        .form-label { font-weight: 600; color: #334155; font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav class="navbar sticky-top py-2" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(28px); border-bottom: 1px solid rgba(16,185,129,0.15); box-shadow: 0 10px 30px rgba(16,185,129,0.05); z-index: 1040;">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" href="/admin/dashboard">
                <div style="background-color: #111111; border: 3px solid #10b981; padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center;">
                    <span style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.1rem; letter-spacing: 2px;">4LAZIE</span>
                </div>
                <span class="ms-1" style="font-family: 'Outfit', sans-serif; font-weight: 900; color: #10b981;">ADMIN</span>
            </a>
            <a href="/admin/notes" class="btn btn-sm btn-outline-secondary rounded-pill px-3"><i class="bi bi-arrow-left me-1"></i> Back to Notes</a>
            <button class="btn btn-sm btn-success d-flex align-items-center rounded-pill px-3 shadow-sm" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
                <i class="bi bi-list me-2"></i> Admin Menu
            </button>
        </div>
    </nav>

    <div class="edit-card">
        <h4 class="fw-bold mb-1" style="font-family: 'Outfit', sans-serif; color: #1e293b;"><i class="bi bi-pencil-square me-2" style="color:#10b981;"></i>Edit Note</h4>
        <p class="text-muted small mb-4">This is a plain uploaded note — you can edit its details below. To replace the actual file, delete this note and upload a new one.</p>

        <form th:action="@{'/admin/notes/' + ${note.id} + '/edit'}" method="post">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" th:value="${note.title}" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Module Code</label>
                    <input type="text" name="moduleCode" class="form-control" th:value="${note.moduleCode}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Module Name</label>
                    <input type="text" name="moduleName" class="form-control" th:value="${note.moduleName}">
                </div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label">NTA / Year Level</label>
                    <input type="number" name="levelNo" class="form-control" th:value="${note.levelNo}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Semester</label>
                    <select name="semesterNo" class="form-select">
                        <option value="1" th:selected="${note.semesterNo == 1}">Semester I</option>
                        <option value="2" th:selected="${note.semesterNo == 2}">Semester II</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Academic Year</label>
                    <input type="text" name="academicYear" class="form-control" th:value="${note.academicYear}">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" th:value="${note.category}" placeholder="e.g. Note, Past Paper, Assignment">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold"><i class="bi bi-check-circle-fill me-2"></i>Save Changes</button>
                <a href="/admin/notes" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
<script src="/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='notes')}"></div>
</body>
</html>
