<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Notifications - 4LAZIE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">

    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .page-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 3rem 0 2rem;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: -40px;
        }
        .noti-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .noti-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.1);
        }
        .noti-card.unread {
            background: rgba(16, 185, 129, 0.03);
            border-left: 4px solid #10b981;
        }
        .noti-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .noti-icon.info { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .noti-icon.success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .noti-icon.warning { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .noti-icon.danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
</head>

<body>
    <div class="page-layout">
        <!-- Offcanvas Sidebar for Mobile -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileOffcanvasSidebar" aria-labelledby="mobileOffcanvasSidebarLabel" style="width: 300px; background: linear-gradient(180deg, #1c1f30 0%, #26293d 100%); z-index: 1055;">
            <div class="offcanvas-header" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                <h5 class="offcanvas-title text-white" id="mobileOffcanvasSidebarLabel" style="font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: -1px;">4LAZIE</h5>
                <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body p-0" style="overflow-x: hidden;">
                <aside th:replace="~{fragments/sjuit_components :: sidebar}"></aside>
            </div>
        </div>

        <!-- Sidebar Desktop -->
        <aside class="hero-sidebar d-none d-xl-block">
            <div th:replace="~{fragments/sjuit_components :: sidebar}"></div>
        </aside>

        <div class="main-content flex-grow-1">
            <!-- Header Navigation -->
            <nav class="navbar navbar-light navbar-custom sticky-top py-1" style="background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 1020; border-bottom: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);">
                <div class="container d-flex justify-content-between align-items-center flex-nowrap">
                    <button class="btn border-0 d-xl-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileOffcanvasSidebar" aria-controls="mobileOffcanvasSidebar" style="background: rgba(59, 130, 246, 0.1); color: var(--primary); width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 10px;">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <a class="navbar-brand d-flex align-items-center" th:href="${session.user != null ? '/dashboard' : '/'}" style="text-decoration: none;">
                        <span class="fs-3 me-2" style="font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">4LAZIE</span>
                    </a>
                    
                    <div th:replace="~{fragments/navbar_actions :: actions}"></div>
                </div>
            </nav>

            <div class="page-header shadow-sm">
                <div class="container text-center position-relative z-1">
                    <h2 class="fw-bold mb-2" style="font-family: 'Outfit', sans-serif; letter-spacing: -0.5px;"><i class="bi bi-bell me-2"></i> All Notifications</h2>
                    <p class="mb-0" style="opacity: 0.9;">View your recent updates and activity</p>
                </div>
            </div>

            <div class="container" style="max-width: 800px; padding-top: 60px; padding-bottom: 80px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-dark mb-0">Your Activity</h5>
                    <button class="btn btn-sm btn-outline-success rounded-pill" onclick="markAllRead()" th:if="${unreadNotificationCount > 0}">
                        <i class="bi bi-check-all"></i> Mark all as read
                    </button>
                </div>

                <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                    <div class="mb-3">
                        <i class="bi bi-bell-slash text-muted" style="font-size: 3rem; opacity: 0.5;"></i>
                    </div>
                    <h5 class="fw-bold text-dark">No Notifications Yet</h5>
                    <p class="text-muted">You're all caught up! Check back later for updates.</p>
                </div>

                <div th:if="${not #lists.isEmpty(notifications)}">
                    <a th:each="noti : ${notifications}" th:href="@{'/api/notifications/click/' + ${noti.id}}" class="noti-card" th:classappend="${!noti.read} ? 'unread' : ''">
                        <div class="noti-icon" th:classappend="${noti.type == 'DOWNLOAD' ? 'success' : (noti.type == 'UPLOAD' ? 'info' : 'warning')}">
                            <i th:class="${noti.type == 'DOWNLOAD' ? 'bi bi-download' : (noti.type == 'UPLOAD' ? 'bi bi-upload' : 'bi bi-bell-fill')}"></i>
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h6 class="fw-bold mb-0 text-dark" th:text="${noti.title}">Notification Title</h6>
                                <small class="text-muted" th:text="${#temporals.format(noti.createdAt, 'dd MMM, HH:mm')}">Just now</small>
                            </div>
                            <p class="mb-0 text-secondary" style="font-size: 0.95rem; line-height: 1.5;" th:text="${noti.message}">Notification message content goes here.</p>
                        </div>
                        <div th:if="${!noti.read}" class="align-self-center ms-2">
                            <span class="badge bg-success rounded-pill" style="width: 10px; height: 10px; padding: 0;">&nbsp;</span>
                        </div>
                    </a>
                </div>
            </div>

            <div th:replace="~{fragments/bottom_nav :: bottomNav}"></div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function markAllRead() {
            fetch('/api/notifications/mark-read', {
                method: 'POST',
            }).then(response => {
                if(response.ok) {
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
