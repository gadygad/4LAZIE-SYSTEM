<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - 4LAZIE Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
</head>
<body>
    <div class="bg-glow">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    <div class="error-container">
        <div class="premium-card">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
            <h2 class="fw-bold mt-3">Oops! Something went wrong</h2>
            <p class="text-danger fw-bold" style="font-size: 1.1rem;">EXCEPTION OCCURRED:</p>
            <p class="text-muted" style="background: #f8d7da; padding: 10px; border-radius: 5px; text-align: left; word-wrap: break-word;">
                <strong th:text="${exception != null ? exception.getClass().getSimpleName() : 'Unknown Exception'}">Exception Type</strong>: 
                <span th:text="${message != null ? message : 'No details available'}">An unexpected error occurred.</span>
            </p>
            <a href="/" class="btn-home">Return to Home</a>
        </div>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
