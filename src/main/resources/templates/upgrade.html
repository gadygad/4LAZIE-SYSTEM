<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Premium - 4LAZIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
</head>
<body class="bg-light">

    <!-- Header Navbar -->
    <nav class="navbar navbar-dark navbar-custom sticky-top py-1">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="${session.user != null ? '/dashboard' : '/'}">
                <span class="brand-font fs-3 fw-bold"><i class="bi bi-journal-text text-dark me-2"></i>4LAZIE</span>
            </a>
            <div th:replace="~{fragments/navbar_actions :: actions}"></div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 text-center">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background: #ffffff;">
                    <div class="card-header border-0 py-4" style="background: var(--accent-gradient);">
                        <h2 class="fw-bold text-white mb-0" style="font-family: 'Outfit', sans-serif;"><i class="bi bi-person-plus-fill text-warning me-2"></i>Account Required</h2>
                    </div>
                    <div class="card-body p-5">
                        <div class="mb-4">
                            <i class="bi bi-lock-fill text-secondary" style="font-size: 4rem; opacity: 0.5;"></i>
                        </div>
                        <h4 class="fw-bold mb-3 text-dark">Unlock the Best Study Materials</h4>
                        <p class="text-secondary mb-4" style="font-size: 1.1rem; line-height: 1.6;">
                            This document is a <strong>Past Paper / Assignment</strong> and is reserved for Registered Students. 
                            Create a free account today to access all past papers, assignments, and exclusive resources!
                        </p>
                        
                        <div class="d-grid gap-3">
                            <a href="/register" class="btn btn-warning btn-lg fw-bold rounded-pill shadow-sm" style="font-family: 'Outfit', sans-serif; letter-spacing: 1px;">
                                <i class="bi bi-person-plus-fill me-2"></i>CREATE FREE ACCOUNT
                            </a>
                            <a href="/dashboard" class="btn btn-light btn-lg fw-bold rounded-pill text-secondary">
                                Go Back
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
