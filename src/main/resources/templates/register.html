<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - 4LAZIE Student Community</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <style>
        body {
            background: #10b981 !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .premium-card {
            width: 100%;
            max-width: 400px !important;
            padding: 2.5rem 2rem !important;
            margin: 0 auto !important;
            background: rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
        }
        @media (max-width: 576px) {
            .auth-container {
                padding: 0.5rem;
            }
            .premium-card {
                padding: 1.25rem 1rem !important;
                border-radius: 16px !important;
            }
        }
        .premium-btn {
            width: 100% !important;
            margin: 0 auto !important;
            display: flex;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
</head>
<body>

    <div class="auth-container">
        <div class="premium-card">
            
            <div class="text-center mb-4 pb-2">
                <a href="/" class="text-decoration-none d-inline-block mb-1">
                    <span class="fw-bold" style="font-size: 2.2rem; letter-spacing: -1.8px; color: #0f172a; font-weight: 900 !important;">4LAZIE</span>
                </a>
                <h4 class="fw-bold mb-1 mt-2 text-dark-custom" style="letter-spacing: -0.5px;">Create Account</h4>
                <p class="text-muted-custom" style="font-size: 0.85rem; font-weight: 500;">Join the smart generation today</p>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert d-flex align-items-center p-3 mb-4 rounded-4" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #065f46; font-size: 0.85rem; backdrop-filter: blur(5px); transition: all 0.3s ease;">
                <i class="bi bi-exclamation-triangle-fill fs-5 me-3"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post" th:object="${user}">
                
                <div class="mb-3">
                    <select id="institutionId" name="institution.id" class="premium-input form-select shadow-none" style="cursor: pointer;" required>
                        <option value="" disabled selected>Select Your Institution</option>
                        <option th:each="inst : ${institutions}" th:value="${inst.id}" th:text="${inst.name}"></option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <select th:field="*{courseProgram}" id="courseProgram" class="premium-input form-select shadow-none" style="cursor: pointer;" required>
                        <option value="" disabled selected>Select Your Course / Program</option>
                        <option th:each="course : ${courses}" th:value="${course.name}" th:text="${course.name}"></option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <input type="text" name="name" th:field="*{name}" class="premium-input shadow-none" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Full Name (e.g., Careen Godfrey)" required pattern="^[a-zA-Z\-']+(?:\s+[a-zA-Z\-']+)+$" title="Please enter at least two names (e.g., Careen Godfrey)" autocomplete="off">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback" style="font-size: 0.8rem; font-weight: 500; margin-top: 4px;"></div>
                </div>
                
                <div class="mb-3">
                    <input type="email" name="email" th:field="*{email}" class="premium-input shadow-none" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="Email Address" required autocomplete="off">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback" style="font-size: 0.8rem; font-weight: 500; margin-top: 4px;"></div>
                </div>
                
                <div class="mb-4">
                    <input type="password" name="password" th:field="*{password}" class="premium-input shadow-none" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Password" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="invalid-feedback" style="font-size: 0.8rem; font-weight: 500; margin-top: 4px;"></div>
                </div>

                <button type="submit" class="premium-btn mb-4">
                    Sign Up Now
                </button>
            </form>

            <div class="d-flex align-items-center mb-4">
                <hr class="flex-grow-1" style="border-color: rgba(15,23,42,0.1); margin: 0;">
                <span class="mx-3" style="color: rgba(15,23,42,0.4); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Or continue with</span>
                <hr class="flex-grow-1" style="border-color: rgba(15,23,42,0.1); margin: 0;">
            </div>

            <div class="d-flex justify-content-center mb-4 position-relative">
                <div id="google-overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; cursor: not-allowed;" onclick="alert('Please select both your Institution and Course/Program first before signing up with Google.')"></div>
                <div id="g_id_onload"
                     data-client_id="226739305071-2b7frq975mp822vaua8404aci2cej5ds.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_up_with"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
            </div>

            <!-- Hidden form to submit the token with CSRF protection -->
            <form id="google-login-form" th:action="@{/register/google}" method="post" style="display: none;">
                <input type="hidden" name="credential" id="google-credential">
                <input type="hidden" name="courseProgram" id="google-course">
                <input type="hidden" name="institutionId" id="google-institution">
            </form>

            <div class="text-center pt-2" style="border-top: 1px solid rgba(15,23,42,0.05);">
                <span class="text-muted-custom" style="font-size: 0.95rem;">Already registered?</span> 
                <a th:href="@{/login}" class="fw-bold text-decoration-none ms-1" style="font-size: 0.95rem; color: #0f172a;">Sign In</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function checkGoogleAuthOverlay() {
            const courseVal = document.getElementById('courseProgram').value;
            const instVal = document.getElementById('institutionId').value;
            if (courseVal && instVal) {
                document.getElementById('google-overlay').style.display = 'none';
            } else {
                document.getElementById('google-overlay').style.display = 'block';
            }
        }

        document.getElementById('courseProgram').addEventListener('change', checkGoogleAuthOverlay);
        document.getElementById('institutionId').addEventListener('change', checkGoogleAuthOverlay);

        function handleCredentialResponse(response) {
            const courseDropdown = document.getElementById('courseProgram');
            const instDropdown = document.getElementById('institutionId');
            
            if (!courseDropdown.value || !instDropdown.value) {
                alert("Please select both your Institution and Course first before signing up with Google.");
                return;
            }
            
            document.getElementById('google-credential').value = response.credential;
            document.getElementById('google-course').value = courseDropdown.value;
            document.getElementById('google-institution').value = instDropdown.value;
            document.getElementById('google-login-form').submit();
        }
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
