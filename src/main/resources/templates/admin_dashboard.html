<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Admin Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Premium Global CSS -->
    <link rel="stylesheet" th:href="@{/css/premium-theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- SEO and Developer Identity (JSON-LD Schema) -->
    <meta name="author" content="Godfrey Charles Nyagwisi">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "4LAZIE Student Community Forum",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Access thousands of premium student notes, past papers, and timetables for free.",
      "creator": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi",
        "jobTitle": "Founder & Developer",
        "url": "https://github.com/GodfreyNyagwisi"
      },
      "author": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi"
      },
      "dateCreated": "2026-06-01",
      "publisher": {
        "@type": "Organization",
        "name": "4LAZIE Student Community Forum",
        "founder": {
          "@type": "Person",
          "name": "Godfrey Charles Nyagwisi"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Godfrey Charles Nyagwisi is the founder and developer of 4LAZIE Student Community Forum, established in June 2026."
        }
      }]
    }
    </script>
</head>

<body>

    <!-- Premium Header Navbar -->
    <nav class="navbar sticky-top py-2" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(16, 185, 129,0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.03); z-index: 1040;">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Brand -->
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="${session.user != null ? '/dashboard' : '/'}">
                <div class="d-flex align-items-center justify-content-center me-2" style="width: 36px; height: 36px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; box-shadow: 0 4px 10px rgba(16, 185, 129,0.3);">
                    <i class="bi bi-journal-bookmark-fill text-white" style="font-size: 1.1rem;"></i>
                </div>
                <div class="d-flex align-items-center" style="transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer;" onmouseover="this.style.transform='scale(1.03) translateY(-1px)';" onmouseout="this.style.transform='none';">
                    <span style="font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.8rem; color: #1e293b; letter-spacing: -1px; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.05);">4LAZIE</span>
                    <div class="ms-2 position-relative d-inline-flex align-items-center">
                        <span style="font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.8rem; letter-spacing: -0.5px; background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0px 4px 15px rgba(16, 185, 129,0.4); position: relative; z-index: 2; padding-right: 2px;">ADMIN</span>
                    </div>
                </div>
            </a>
            
            <div th:replace="~{fragments/top_actions :: actions}"></div>
        </div>
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, rgba(16, 185, 129,0) 0%, rgba(16, 185, 129,0.8) 50%, rgba(16, 185, 129,0) 100%); box-shadow: 0 2px 10px rgba(16, 185, 129,0.5);"></div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        
        <div class="row g-4">
            <!-- Left Column: Main Dashboard Content -->
            <div class="col-lg-12">
                
                <!-- Welcome Banner -->
                <div class="mb-4" style="padding: 24px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 24px; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2); color: white; position: relative; overflow: hidden;">
                    <button class="btn btn-sm btn-light position-absolute top-0 end-0 mt-3 me-3 d-flex align-items-center rounded-pill px-3 shadow-sm text-success fw-bold" style="z-index: 10;" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar">
                        <i class="bi bi-list me-2"></i> Admin Menu
                    </button>
                    <div style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 50%; filter: blur(30px);"></div>
                    <h2 class="fw-bolder mb-1" style="font-family: 'Outfit', sans-serif;">System Analytics Overview</h2>
                    <p class="mb-0 text-white-50">Here's what's happening in 4LAZIE today.</p>
                </div>

                <!-- Stats Grid -->
                <div class="row g-3 mb-4">
                    <!-- Total Users -->
                    <div class="col-md-6 col-lg-3">
                        <div style="padding: 20px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.1); box-shadow: 0 8px 24px rgba(0,0,0,0.03); text-align: center; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)';" onmouseout="this.style.transform='none';">
                            <i class="bi bi-people-fill" style="font-size: 2rem; color: #3b82f6;"></i>
                            <h3 class="fw-bold mt-2 mb-0" style="font-family: 'Outfit', sans-serif; color: #1e293b;" th:text="${totalUsers}">0</h3>
                            <p class="text-muted small fw-semibold mb-0">Total Users</p>
                        </div>
                    </div>
                    <!-- Total Notes -->
                    <div class="col-md-6 col-lg-3">
                        <div style="padding: 20px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.1); box-shadow: 0 8px 24px rgba(0,0,0,0.03); text-align: center; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)';" onmouseout="this.style.transform='none';">
                            <i class="bi bi-file-earmark-text-fill" style="font-size: 2rem; color: #10b981;"></i>
                            <h3 class="fw-bold mt-2 mb-0" style="font-family: 'Outfit', sans-serif; color: #1e293b;" th:text="${totalNotes}">0</h3>
                            <p class="text-muted small fw-semibold mb-0">Total Notes</p>
                        </div>
                    </div>
                    <!-- Total Downloads -->
                    <div class="col-md-6 col-lg-3">
                        <div style="padding: 20px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.1); box-shadow: 0 8px 24px rgba(0,0,0,0.03); text-align: center; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)';" onmouseout="this.style.transform='none';">
                            <i class="bi bi-cloud-arrow-down-fill" style="font-size: 2rem; color: #f59e0b;"></i>
                            <h3 class="fw-bold mt-2 mb-0" style="font-family: 'Outfit', sans-serif; color: #1e293b;" th:text="${totalDownloads}">0</h3>
                            <p class="text-muted small fw-semibold mb-0">Total Downloads</p>
                        </div>
                    </div>
                    <!-- Total Views -->
                    <div class="col-md-6 col-lg-3">
                        <div style="padding: 20px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.1); box-shadow: 0 8px 24px rgba(0,0,0,0.03); text-align: center; transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-5px)';" onmouseout="this.style.transform='none';">
                            <i class="bi bi-eye-fill" style="font-size: 2rem; color: #8b5cf6;"></i>
                            <h3 class="fw-bold mt-2 mb-0" style="font-family: 'Outfit', sans-serif; color: #1e293b;" th:text="${totalViews}">0</h3>
                            <p class="text-muted small fw-semibold mb-0">Total Views</p>
                        </div>
                    </div>
                </div>

                <!-- Main Tables -->
                <div class="row g-4">
                    <!-- Recent Users -->
                    <div class="col-md-6">
                        <div style="padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); border-radius: 24px; height: 100%;">
                            <h5 class="fw-bold mb-3" style="font-family: 'Outfit', sans-serif; color: #1e293b;"><i class="bi bi-person-lines-fill text-primary me-2"></i>Recent Users</h5>
                            <div class="table-responsive">
                                <table class="table table-borderless table-hover mb-0">
                                    <tbody>
                                        <tr th:each="u : ${recentUsers}" style="border-bottom: 1px solid #f1f5f9;">
                                            <td class="py-2">
                                                <div class="fw-bold d-flex align-items-center" style="color: #334155;">
                                                    <span th:text="${u.name}">User Name</span>
                                                    <span th:if="${u.isSuspended}" class="badge rounded-pill bg-danger ms-2" style="font-size: 0.6rem; padding: 0.3em 0.6em;"><i class="bi bi-slash-circle me-1"></i>SUSPENDED</span>
                                                </div>
                                                <div class="small text-muted" style="font-size: 0.8rem;" th:text="${u.email}">user@email.com</div>
                                            </td>
                                            <td class="py-2 text-end align-middle">
                                                <form th:action="@{/admin/users/{id}/send-recovery(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('Send secure recovery link to this user?');">
                                                    <button type="submit" class="btn btn-sm rounded-pill text-success me-2" style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2);" title="Send Recovery Link">
                                                        <i class="bi bi-life-preserver"></i> Restore
                                                    </button>
                                                </form>
                                                <span class="badge bg-light text-dark border" th:text="${#temporals.format(u.dateJoined, 'MMM dd, yyyy')}">Date</span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Popular Notes -->
                    <div class="col-md-6">
                        <div style="padding: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1); border-radius: 24px; height: 100%;">
                            <h5 class="fw-bold mb-3" style="font-family: 'Outfit', sans-serif; color: #1e293b;"><i class="bi bi-fire text-danger me-2"></i>Most Popular Notes</h5>
                            <div class="table-responsive">
                                <table class="table table-borderless table-hover mb-0">
                                    <tbody>
                                        <tr th:each="n : ${popularNotes}" style="border-bottom: 1px solid #f1f5f9;">
                                            <td class="py-2">
                                                <div class="fw-bold text-truncate" style="color: #334155; max-width: 150px;" th:text="${n.title}">Note Title</div>
                                                <div class="small text-muted" style="font-size: 0.8rem;" th:text="${n.category}">Category</div>
                                            </td>
                                            <td class="py-2 text-end align-middle">
                                                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25"><i class="bi bi-download me-1"></i>[[${n.downloadCount}]]</span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Offcanvas Admin Sidebar -->
            <div th:replace="~{fragments/admin_sidebar :: offcanvas(activePage='analytics')}"></div>
        </div>
    </div>

    <!-- Include Footer -->
    <div style="border-top: 1px solid #e2e8f0; background: #ffffff;">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
