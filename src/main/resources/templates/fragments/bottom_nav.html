<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="nav(activePage)">
        <!-- FLOATING BOTTOM NAV BAR -->
        <div class="fixed-bottom custom-mobile-nav-wrapper d-flex justify-content-center d-block d-lg-none"
            style="z-index: 1040; pointer-events: none;">
            <div class="custom-mobile-nav-inner d-flex align-items-center justify-content-around rounded-pill shadow-lg px-3 py-1"
                style="pointer-events: auto; border: 1px solid rgba(16, 185, 129, 0.2); gap: 5px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);">

                <!-- HOME Button -->
                <a th:href="${session.user != null ? '/dashboard' : '/'}" class="bottom-nav-btn text-decoration-none d-flex flex-column align-items-center py-1 px-2 rounded-4 border border-transparent flex-shrink-0" 
                    style="color: #64748b; width: 60px;">
                    <i class="bi bi-house-door-fill" style="font-size: 1.15rem; margin-bottom: 2px;"></i>
                    <span style="font-size: 0.6rem; font-weight: 700; font-family: 'Outfit', sans-serif;">HOME</span>
                </a>

                <!-- Practice Button -->
                <a href="/quizzes" class="bottom-nav-btn text-decoration-none d-flex flex-column align-items-center py-1 px-2 rounded-4 border border-transparent flex-shrink-0" 
                    style="color: #10b981; width: 60px;">
                    <i class="bi bi-book-fill" style="font-size: 1.15rem; margin-bottom: 2px;"></i>
                    <span style="font-size: 0.6rem; font-weight: 700; font-family: 'Outfit', sans-serif;">PRACTICE</span>
                </a>

                <!-- COMMUNITY (center, elevated) -->
                <a href="/community"
                    class="bottom-nav-btn forum-nav-btn text-decoration-none d-flex flex-column align-items-center py-1 px-2 rounded-4 border border-transparent flex-shrink-0"
                    style="color: #ffffff; width: 60px;">
                    <i class="bi bi-chat-square-text-fill" style="font-size: 1.3rem; margin-bottom: 2px;"></i>
                    <span style="font-size: 0.6rem; font-weight: 700; font-family: 'Outfit', sans-serif;">FORUM</span>
                </a>

                <!-- CAT (combined CAT 1 + CAT 2 — same modal, switchable inside) -->
                <a th:if="${(cat1Passed == null || !cat1Passed) || (cat2Passed == null || !cat2Passed)}" href="#"
                    class="bottom-nav-btn exam-nav-btn cat-combo-btn text-decoration-none d-flex flex-column align-items-center py-1 px-2 rounded-4 border border-transparent flex-shrink-0"
                    style="color: #64748b; width: 60px;" data-bs-toggle="offcanvas" data-bs-target="#examModal" aria-controls="examModal"
                    data-exam-title="CAT 1"
                    th:data-cat1-sem1-degree-date="${currentCalendar != null and currentCalendar.sem1Cat1DegreeDate != null ? currentCalendar.sem1Cat1DegreeDate : ''}"
                    th:data-cat1-sem1-degree-end-date="${currentCalendar != null and currentCalendar.sem1Cat1DegreeEndDate != null ? currentCalendar.sem1Cat1DegreeEndDate : ''}"
                    th:data-cat1-sem1-diploma-date="${currentCalendar != null and currentCalendar.sem1Cat1DiplomaDate != null ? currentCalendar.sem1Cat1DiplomaDate : ''}"
                    th:data-cat1-sem1-diploma-end-date="${currentCalendar != null and currentCalendar.sem1Cat1DiplomaEndDate != null ? currentCalendar.sem1Cat1DiplomaEndDate : ''}"
                    th:data-cat1-sem1-degree-url="${currentCalendar != null ? currentCalendar.sem1Cat1DegreeUrl : ''}"
                    th:data-cat1-sem1-diploma-url="${currentCalendar != null ? currentCalendar.sem1Cat1DiplomaUrl : ''}"
                    th:data-cat1-sem2-degree-date="${currentCalendar != null and currentCalendar.sem2Cat1DegreeDate != null ? currentCalendar.sem2Cat1DegreeDate : ''}"
                    th:data-cat1-sem2-degree-end-date="${currentCalendar != null and currentCalendar.sem2Cat1DegreeEndDate != null ? currentCalendar.sem2Cat1DegreeEndDate : ''}"
                    th:data-cat1-sem2-diploma-date="${currentCalendar != null and currentCalendar.sem2Cat1DiplomaDate != null ? currentCalendar.sem2Cat1DiplomaDate : ''}"
                    th:data-cat1-sem2-diploma-end-date="${currentCalendar != null and currentCalendar.sem2Cat1DiplomaEndDate != null ? currentCalendar.sem2Cat1DiplomaEndDate : ''}"
                    th:data-cat1-sem2-degree-url="${currentCalendar != null ? currentCalendar.sem2Cat1DegreeUrl : ''}"
                    th:data-cat1-sem2-diploma-url="${currentCalendar != null ? currentCalendar.sem2Cat1DiplomaUrl : ''}"
                    th:data-cat2-sem1-degree-date="${currentCalendar != null and currentCalendar.sem1Cat2DegreeDate != null ? currentCalendar.sem1Cat2DegreeDate : ''}"
                    th:data-cat2-sem1-degree-end-date="${currentCalendar != null and currentCalendar.sem1Cat2DegreeEndDate != null ? currentCalendar.sem1Cat2DegreeEndDate : ''}"
                    th:data-cat2-sem1-diploma-date="${currentCalendar != null and currentCalendar.sem1Cat2DiplomaDate != null ? currentCalendar.sem1Cat2DiplomaDate : ''}"
                    th:data-cat2-sem1-diploma-end-date="${currentCalendar != null and currentCalendar.sem1Cat2DiplomaEndDate != null ? currentCalendar.sem1Cat2DiplomaEndDate : ''}"
                    th:data-cat2-sem1-degree-url="${currentCalendar != null ? currentCalendar.sem1Cat2DegreeUrl : ''}"
                    th:data-cat2-sem1-diploma-url="${currentCalendar != null ? currentCalendar.sem1Cat2DiplomaUrl : ''}"
                    th:data-cat2-sem2-degree-date="${currentCalendar != null and currentCalendar.sem2Cat2DegreeDate != null ? currentCalendar.sem2Cat2DegreeDate : ''}"
                    th:data-cat2-sem2-degree-end-date="${currentCalendar != null and currentCalendar.sem2Cat2DegreeEndDate != null ? currentCalendar.sem2Cat2DegreeEndDate : ''}"
                    th:data-cat2-sem2-diploma-date="${currentCalendar != null and currentCalendar.sem2Cat2DiplomaDate != null ? currentCalendar.sem2Cat2DiplomaDate : ''}"
                    th:data-cat2-sem2-diploma-end-date="${currentCalendar != null and currentCalendar.sem2Cat2DiplomaEndDate != null ? currentCalendar.sem2Cat2DiplomaEndDate : ''}"
                    th:data-cat2-sem2-degree-url="${currentCalendar != null ? currentCalendar.sem2Cat2DegreeUrl : ''}"
                    th:data-cat2-sem2-diploma-url="${currentCalendar != null ? currentCalendar.sem2Cat2DiplomaUrl : ''}">
                    <i class="bi bi-ui-checks" style="font-size: 1.15rem; margin-bottom: 2px;"></i>
                    <span style="font-size: 0.6rem; font-weight: 700; font-family: 'Outfit', sans-serif;">CAT</span>
                </a>

                <!-- UE -->
                <a th:if="${uePassed == null || !uePassed}" href="#"
                    class="bottom-nav-btn exam-nav-btn text-decoration-none d-flex flex-column align-items-center py-1 px-2 rounded-4 border border-transparent flex-shrink-0"
                    style="color: #64748b; width: 60px;" data-bs-toggle="offcanvas" data-bs-target="#examModal" aria-controls="examModal"
                    data-exam-title="UE"
                    th:data-sem1-degree-date="${currentCalendar != null and currentCalendar.sem1UeDegreeDate != null ? currentCalendar.sem1UeDegreeDate : ''}"
                    th:data-sem1-degree-end-date="${currentCalendar != null and currentCalendar.sem1UeDegreeEndDate != null ? currentCalendar.sem1UeDegreeEndDate : ''}"
                    th:data-sem1-diploma-date="${currentCalendar != null and currentCalendar.sem1UeDiplomaDate != null ? currentCalendar.sem1UeDiplomaDate : ''}"
                    th:data-sem1-diploma-end-date="${currentCalendar != null and currentCalendar.sem1UeDiplomaEndDate != null ? currentCalendar.sem1UeDiplomaEndDate : ''}"
                    th:data-sem1-degree-url="${currentCalendar != null ? currentCalendar.sem1UeDegreeUrl : ''}"
                    th:data-sem1-diploma-url="${currentCalendar != null ? currentCalendar.sem1UeDiplomaUrl : ''}"
                    th:data-sem2-degree-date="${currentCalendar != null and currentCalendar.sem2UeDegreeDate != null ? currentCalendar.sem2UeDegreeDate : ''}"
                    th:data-sem2-degree-end-date="${currentCalendar != null and currentCalendar.sem2UeDegreeEndDate != null ? currentCalendar.sem2UeDegreeEndDate : ''}"
                    th:data-sem2-diploma-date="${currentCalendar != null and currentCalendar.sem2UeDiplomaDate != null ? currentCalendar.sem2UeDiplomaDate : ''}"
                    th:data-sem2-diploma-end-date="${currentCalendar != null and currentCalendar.sem2UeDiplomaEndDate != null ? currentCalendar.sem2UeDiplomaEndDate : ''}"
                    th:data-sem2-degree-url="${currentCalendar != null ? currentCalendar.sem2UeDegreeUrl : ''}"
                    th:data-sem2-diploma-url="${currentCalendar != null ? currentCalendar.sem2UeDiplomaUrl : ''}">
                    <i class="bi bi-mortarboard-fill" style="font-size: 1.15rem; margin-bottom: 2px;"></i>
                    <span style="font-size: 0.6rem; font-weight: 700; font-family: 'Outfit', sans-serif;">UE</span>
                </a>

            </div>
        </div>

        <style>
            /* ============================================
               BOTTOM NAV — DESKTOP (floating pill)
               ============================================ */
            .custom-mobile-nav-wrapper {
                margin-bottom: 1.5rem;
            }
            .custom-mobile-nav-inner {
                min-width: 280px;
            }

            /* ============================================
               BOTTOM NAV — MOBILE (flat fixed bar, Material Design 3 standard)
               ============================================ */
            @media (max-width: 991.98px) {

                /* Wrapper: stretch full width, flush to bottom edge */
                .custom-mobile-nav-wrapper {
                    margin-bottom: 0 !important;
                    padding-left: 0 !important;
                    padding-right: 0 !important;
                    left: 0 !important;
                    right: 0 !important;
                    bottom: 0 !important;
                    display: block !important;
                    justify-content: unset !important;
                    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
                }
                .custom-mobile-nav-wrapper.nav-hidden {
                    transform: translateY(120%) !important;
                }

                /* Inner bar: flat, full-width, NOT a pill */
                .custom-mobile-nav-inner {
                    width: 100% !important;
                    border-radius: 20px 20px 0 0 !important;   /* only top corners rounded */
                    padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)) !important;
                    justify-content: space-around !important;
                    min-width: unset !important;
                    gap: 0 !important;
                    box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.08), 0 -1px 4px rgba(16, 185, 129, 0.06) !important;
                    border-left: none !important;
                    border-right: none !important;
                    border-bottom: none !important;
                    border-top: 1px solid rgba(16, 185, 129, 0.15) !important;
                    overflow: visible !important;
                    background: rgba(255, 255, 255, 0.97) !important;
                    backdrop-filter: blur(20px) !important;
                    -webkit-backdrop-filter: blur(20px) !important;
                }

                /* Each nav item: equal flex share, vertically stacked icon + label */
                .bottom-nav-btn {
                    flex: 1 1 0 !important;        /* equal width for all items */
                    width: 20% !important;
                    min-width: 0 !important;
                    max-width: none !important;
                    padding: 8px 1px 6px !important;
                    border-radius: 0 !important;
                    border: none !important;
                    display: flex !important;
                    flex-direction: column !important;
                    align-items: center !important;
                    justify-content: center !important;
                    gap: 3px !important;
                    flex-shrink: 1 !important;     /* ensure it can shrink */
                }

                /* Icon size: clear and readable on mobile */
                .bottom-nav-btn i {
                    font-size: 1.25rem !important;
                    margin-bottom: 0 !important;
                    line-height: 1 !important;
                }

                /* Label: always fully visible, never clipped or squeezed */
                .bottom-nav-btn span {
                    font-size: 0.55rem !important;
                    font-weight: 700 !important;
                    letter-spacing: 0 !important;
                    text-align: center !important;
                    white-space: nowrap !important;
                    line-height: 1.2 !important;
                    display: block !important;
                }

                /* Body padding: prevent content going behind nav */
                body {
                    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)) !important;
                }
            }
            .bottom-nav-btn {
                position: relative;
                transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                border: 1px solid transparent !important;
                z-index: 1;
                -webkit-tap-highlight-color: transparent;
            }
            .bottom-nav-btn::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0);
                width: 120%;
                padding-bottom: 120%;
                background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0) 70%);
                border-radius: 50%;
                transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
                opacity: 0;
                z-index: -1;
            }
            .bottom-nav-btn:hover::before {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            .bottom-nav-btn:hover {
                background: rgba(16, 185, 129, 0.1) !important;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                color: #059669 !important;
                transform: translateY(-5px);
                box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
                border: 1px solid rgba(16, 185, 129, 0.2) !important;
            }
            .bottom-nav-btn i {
                transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s, filter 0.3s;
            }
            .bottom-nav-btn:hover i {
                color: #059669 !important;
                transform: translateY(-2px) scale(1.15);
                filter: drop-shadow(0 6px 8px rgba(16, 185, 129, 0.4));
            }
            .bottom-nav-btn:active {
                transform: scale(0.92) translateY(2px) !important;
                box-shadow: inset 0 2px 10px rgba(16, 185, 129, 0.2) !important;
                background: rgba(16, 185, 129, 0.2) !important;
                transition: all 0.1s cubic-bezier(0.4, 0.0, 0.2, 1) !important;
            }
            .bottom-nav-btn:active i {
                transform: scale(0.85) !important;
                filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.8)) !important;
                transition: all 0.1s ease !important;
            }

            /* FORUM — elevated, filled circle so it stands out as the
               center action, same pattern used by apps with one primary
               center nav button. */
            .forum-nav-btn {
                background: linear-gradient(135deg, #10b981, #059669) !important;
                border-radius: 50% !important;
                width: 52px !important;
                height: 52px !important;
                margin-top: -18px !important;
                box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45) !important;
                border: 3px solid #ffffff !important;
            }
            .forum-nav-btn span { display: none !important; }
            .forum-nav-btn:hover {
                transform: translateY(-22px) scale(1.05) !important;
                box-shadow: 0 10px 24px rgba(16, 185, 129, 0.55) !important;
                background: linear-gradient(135deg, #10b981, #059669) !important;
                color: #ffffff !important;
            }
            .forum-nav-btn:hover i { color: #ffffff !important; filter: none !important; }
            @media (max-width: 991.98px) {
                .forum-nav-btn {
                    width: 54px !important;
                    height: 54px !important;
                    margin-top: -22px !important;
                    flex: 0 0 54px !important;
                }
            }
        </style>

        <script>
            // Reads the 12 date/url fields off a button, optionally under a
            // prefix (e.g. "cat1-" / "cat2-") so one button can carry both
            // CAT 1 and CAT 2 datasets at once for the in-modal toggle.
            function readExamFields(btn, prefix) {
                var p = prefix ? ('data-' + prefix + '-') : 'data-';
                return {
                    sem1DegreeDate: btn.getAttribute(p + 'sem1-degree-date'),
                    sem1DegreeEndDate: btn.getAttribute(p + 'sem1-degree-end-date'),
                    sem1DiplomaDate: btn.getAttribute(p + 'sem1-diploma-date'),
                    sem1DiplomaEndDate: btn.getAttribute(p + 'sem1-diploma-end-date'),
                    sem1DegreeUrl: btn.getAttribute(p + 'sem1-degree-url'),
                    sem1DiplomaUrl: btn.getAttribute(p + 'sem1-diploma-url'),
                    sem2DegreeDate: btn.getAttribute(p + 'sem2-degree-date'),
                    sem2DegreeEndDate: btn.getAttribute(p + 'sem2-degree-end-date'),
                    sem2DiplomaDate: btn.getAttribute(p + 'sem2-diploma-date'),
                    sem2DiplomaEndDate: btn.getAttribute(p + 'sem2-diploma-end-date'),
                    sem2DegreeUrl: btn.getAttribute(p + 'sem2-degree-url'),
                    sem2DiplomaUrl: btn.getAttribute(p + 'sem2-diploma-url')
                };
            }

            function fillExamModal(title, f) {
                    var sem1DegreeDate = f.sem1DegreeDate;
                    var sem1DegreeEndDate = f.sem1DegreeEndDate;
                    var sem1DiplomaDate = f.sem1DiplomaDate;
                    var sem1DiplomaEndDate = f.sem1DiplomaEndDate;
                    var sem1DegreeUrl = f.sem1DegreeUrl;
                    var sem1DiplomaUrl = f.sem1DiplomaUrl;
                    var sem2DegreeDate = f.sem2DegreeDate;
                    var sem2DegreeEndDate = f.sem2DegreeEndDate;
                    var sem2DiplomaDate = f.sem2DiplomaDate;
                    var sem2DiplomaEndDate = f.sem2DiplomaEndDate;
                    var sem2DegreeUrl = f.sem2DegreeUrl;
                    var sem2DiplomaUrl = f.sem2DiplomaUrl;

                    var fullTitle = title === 'UE' ? 'UNIVERSITY EXAMINATIONS (UE)' : title.toUpperCase();
                    var titleEl = document.getElementById('examModalTitle');
                    if(titleEl) titleEl.innerText = fullTitle;

                    var elSem1DegreeDate = document.getElementById('examSem1DegreeDate');
                    if(elSem1DegreeDate) elSem1DegreeDate.innerText = (sem1DegreeDate && sem1DegreeDate.trim() !== '') ? sem1DegreeDate : 'Not announced';
                    var elSem1DegreeEndDate = document.getElementById('examSem1DegreeEndDate');
                    if(elSem1DegreeEndDate) elSem1DegreeEndDate.innerText = (sem1DegreeEndDate && sem1DegreeEndDate.trim() !== '') ? sem1DegreeEndDate : 'Not announced';
                    
                    var elSem1DiplomaDate = document.getElementById('examSem1DiplomaDate');
                    if(elSem1DiplomaDate) elSem1DiplomaDate.innerText = (sem1DiplomaDate && sem1DiplomaDate.trim() !== '') ? sem1DiplomaDate : 'Not announced';
                    var elSem1DiplomaEndDate = document.getElementById('examSem1DiplomaEndDate');
                    if(elSem1DiplomaEndDate) elSem1DiplomaEndDate.innerText = (sem1DiplomaEndDate && sem1DiplomaEndDate.trim() !== '') ? sem1DiplomaEndDate : 'Not announced';

                    var elSem2DegreeDate = document.getElementById('examSem2DegreeDate');
                    if(elSem2DegreeDate) elSem2DegreeDate.innerText = (sem2DegreeDate && sem2DegreeDate.trim() !== '') ? sem2DegreeDate : 'Not announced';
                    var elSem2DegreeEndDate = document.getElementById('examSem2DegreeEndDate');
                    if(elSem2DegreeEndDate) elSem2DegreeEndDate.innerText = (sem2DegreeEndDate && sem2DegreeEndDate.trim() !== '') ? sem2DegreeEndDate : 'Not announced';
                    
                    var elSem2DiplomaDate = document.getElementById('examSem2DiplomaDate');
                    if(elSem2DiplomaDate) elSem2DiplomaDate.innerText = (sem2DiplomaDate && sem2DiplomaDate.trim() !== '') ? sem2DiplomaDate : 'Not announced';
                    var elSem2DiplomaEndDate = document.getElementById('examSem2DiplomaEndDate');
                    if(elSem2DiplomaEndDate) elSem2DiplomaEndDate.innerText = (sem2DiplomaEndDate && sem2DiplomaEndDate.trim() !== '') ? sem2DiplomaEndDate : 'Not announced';

                    // Update Timetable Links
                    var sem1DegEl = document.getElementById('examSem1DegreeLink');
                    if(sem1DegEl) {
                        sem1DegEl.style.display = 'block';
                        if(sem1DegreeUrl && sem1DegreeUrl !== 'null' && sem1DegreeUrl.trim() !== '') {
                            sem1DegEl.href = sem1DegreeUrl.startsWith('http') ? sem1DegreeUrl : ('/uploads/' + sem1DegreeUrl);
                            sem1DegEl.onclick = null;
                        } else { 
                            sem1DegEl.href = 'javascript:void(0)';
                            sem1DegEl.onclick = function() { alert('Timetable has not been uploaded yet. Please check back later.'); };
                        }
                    }

                    var sem1DipEl = document.getElementById('examSem1DiplomaLink');
                    if(sem1DipEl) {
                        sem1DipEl.style.display = 'block';
                        if(sem1DiplomaUrl && sem1DiplomaUrl !== 'null' && sem1DiplomaUrl.trim() !== '') {
                            sem1DipEl.href = sem1DiplomaUrl.startsWith('http') ? sem1DiplomaUrl : ('/uploads/' + sem1DiplomaUrl);
                            sem1DipEl.onclick = null;
                        } else { 
                            sem1DipEl.href = 'javascript:void(0)';
                            sem1DipEl.onclick = function() { alert('Timetable has not been uploaded yet. Please check back later.'); };
                        }
                    }

                    var sem2DegEl = document.getElementById('examSem2DegreeLink');
                    if(sem2DegEl) {
                        sem2DegEl.style.display = 'block';
                        if(sem2DegreeUrl && sem2DegreeUrl !== 'null' && sem2DegreeUrl.trim() !== '') {
                            sem2DegEl.href = sem2DegreeUrl.startsWith('http') ? sem2DegreeUrl : ('/uploads/' + sem2DegreeUrl);
                            sem2DegEl.onclick = null;
                        } else { 
                            sem2DegEl.href = 'javascript:void(0)';
                            sem2DegEl.onclick = function() { alert('Timetable has not been uploaded yet. Please check back later.'); };
                        }
                    }

                    var sem2DipEl = document.getElementById('examSem2DiplomaLink');
                    if(sem2DipEl) {
                        sem2DipEl.style.display = 'block';
                        if(sem2DiplomaUrl && sem2DiplomaUrl !== 'null' && sem2DiplomaUrl.trim() !== '') {
                            sem2DipEl.href = sem2DiplomaUrl.startsWith('http') ? sem2DiplomaUrl : ('/uploads/' + sem2DiplomaUrl);
                            sem2DipEl.onclick = null;
                        } else { 
                            sem2DipEl.href = 'javascript:void(0)';
                            sem2DipEl.onclick = function() { alert('Timetable has not been uploaded yet. Please check back later.'); };
                        }
                    }
            }

            // Plain exam buttons (currently just UE) — one dataset per button.
            document.querySelectorAll('.exam-nav-btn:not(.cat-combo-btn)').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    var title = this.getAttribute('data-exam-title');
                    fillExamModal(title, readExamFields(this, null));
                    var tabToggle = document.getElementById('catTabToggle');
                    if (tabToggle) tabToggle.style.display = 'none';
                });
            });

            // The combined CAT button carries BOTH CAT 1 and CAT 2 datasets —
            // opens on CAT 1 by default, with a toggle inside the modal to
            // switch to CAT 2 without leaving/reopening it.
            var catComboBtn = document.querySelector('.cat-combo-btn');
            if (catComboBtn) {
                catComboBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.__lastCatBtn = this;
                    setCatTab('cat1');
                });
            }

            window.setCatTab = function (which) {
                var btn = window.__lastCatBtn;
                if (!btn) return;
                fillExamModal(which === 'cat2' ? 'CAT 2' : 'CAT 1', readExamFields(btn, which));
                var tabToggle = document.getElementById('catTabToggle');
                if (tabToggle) tabToggle.style.display = 'flex';
                document.querySelectorAll('.cat-tab-btn').forEach(function (t) {
                    t.classList.toggle('active', t.getAttribute('data-cat-tab') === which);
                });
            };

            // Auto-hide bottom nav on scroll down, show on scroll up
            var lastScrollY = window.scrollY;
            var bottomNav = document.querySelector('.custom-mobile-nav-wrapper');
            window.addEventListener('scroll', function() {
                if (!bottomNav) return;
                var currentScrollY = window.scrollY;
                if (currentScrollY > lastScrollY && currentScrollY > 50) {
                    bottomNav.classList.add('nav-hidden');
                } else {
                    bottomNav.classList.remove('nav-hidden');
                }
                lastScrollY = currentScrollY;
            }, { passive: true });
        </script>

        <!-- Modals (Calendar & Exams) -->
        <div th:replace="~{fragments/sjuit_components :: calendar_modals}"></div>
    </div>
</body>
</html>
