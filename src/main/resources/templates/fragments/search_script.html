<script th:fragment="script">
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof window.initSearch !== 'function') {
            window.initSearch = function(inputId, resultsId) {
                const input = document.getElementById(inputId);
                const results = document.getElementById(resultsId);
                if (!input || !results) return;
                let timeout = null;
                let cache = {};

                input.addEventListener('input', function(e) {
                    clearTimeout(timeout);
                    const query = e.target.value.trim();
                    if (query.length < 2) { results.classList.add('d-none'); return; }

                    if (cache[query]) {
                        renderResults(cache[query], query, results);
                        return;
                    }

                    results.classList.remove('d-none');
                    results.innerHTML = '<div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>Searching...</div>';

                    timeout = setTimeout(() => {
                        fetch(`/api/search?q=${encodeURIComponent(query)}`)
                            .then(r => r.json())
                            .then(data => {
                                cache[query] = data;
                                renderResults(data, query, results);
                            })
                            .catch(() => {
                                results.innerHTML = '<div class="p-3 text-center text-danger" style="font-size:0.85rem"><i class="bi bi-exclamation-circle me-1"></i>Error loading results</div>';
                            });
                    }, 200);
                });
            };

            window.renderResults = function(data, query, container) {
                container.innerHTML = '';
                container.classList.remove('d-none');
                if (data.results && data.results.length > 0) {
                    const list = document.createElement('div');
                    list.className = 'list-group list-group-flush';
                    data.results.forEach(note => {
                        const a = document.createElement('a');
                        a.href = `/view/${note.id}`;
                        a.className = 'list-group-item list-group-item-action d-flex align-items-center p-3 border-0';
                        a.style.transition = 'background 0.15s';
                        let icon = 'bi-file-earmark-text', iconColor = '#10b981', bg = 'rgba(16,185,129,0.1)';
                        if (note.category === 'Past Paper') { icon = 'bi-file-earmark-pdf'; iconColor = '#ef4444'; bg = 'rgba(239,68,68,0.1)'; }
                        else if (note.category === 'Assignment') { icon = 'bi-journal-check'; iconColor = '#3b82f6'; bg = 'rgba(59,130,246,0.1)'; }
                        a.innerHTML = `
                            <div class="me-3 d-flex align-items-center justify-content-center rounded-3" style="width:36px;height:36px;background:${bg};flex-shrink:0">
                                <i class="bi ${icon}" style="color:${iconColor};font-size:1rem"></i>
                            </div>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="fw-bold text-truncate" style="font-size:0.85rem;color:#1e293b">${note.title}</div>
                                <small class="text-muted" style="font-size:0.7rem;font-weight:500">Level ${note.levelNo || ''} • ${note.category || 'Note'}</small>
                            </div>
                            <i class="bi bi-chevron-right text-muted" style="font-size:0.75rem"></i>`;
                        list.appendChild(a);
                    });
                    if (data.totalMatches > 5) {
                        const viewAll = document.createElement('a');
                        viewAll.href = `/guest-notes?search=${encodeURIComponent(query)}`;
                        viewAll.className = 'list-group-item text-center fw-bold p-2 border-0';
                        viewAll.style.cssText = 'font-size:0.8rem;color:#059669;background:#f0fdf4';
                        viewAll.innerHTML = `View all ${data.totalMatches} results <i class="bi bi-arrow-right ms-1"></i>`;
                        list.appendChild(viewAll);
                    }
                    container.appendChild(list);
                } else {
                    container.innerHTML = '<div class="p-4 text-center text-muted"><i class="bi bi-emoji-frown fs-4 d-block mb-2 text-secondary"></i><span style="font-size:0.85rem">No results for "'+query+'"</span></div>';
                }
            };
        }

        // Initialize smartSearchInput
        if(document.getElementById('smartSearchInput') && document.getElementById('desktopSearchResults')) {
            window.initSearch('smartSearchInput', 'desktopSearchResults');
        }
        if(document.getElementById('mobileSmartSearchInput') && document.getElementById('mobileSearchResults')) {
            window.initSearch('mobileSmartSearchInput', 'mobileSearchResults');
        }
    });
</script>
