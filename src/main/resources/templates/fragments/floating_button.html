<th:block th:fragment="floating_button">
        <!-- ASSIGNMENT HELP FAB (Hidden for Admins) -->
        <th:block th:if="${(user == null or (user.role != null and user.role.name() != 'ADMIN' and user.role.name() != 'SUPER_ADMIN')) and (session.user == null or (session.user.role != null and session.user.role.name() != 'ADMIN' and session.user.role.name() != 'SUPER_ADMIN'))}">
            <!-- ASSIGNMENT HELP FAB (Premium AI Style - Top Right) -->
            <style>
                .btn-assignment-help {
                    top: 130px; /* Desktop: below secondary navbar */
                    right: 20px;
                }
                @media (max-width: 768px) {
                    .btn-assignment-help {
                        top: 85px; /* Mobile: below primary navbar */
                    }
                }
            </style>
            <button type="button" class="btn btn-assignment-help position-fixed d-flex align-items-center gap-3 px-3 py-2" data-bs-toggle="modal" data-bs-target="#assignmentHelpModal" style="z-index: 1035; border-radius: 50px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #0f172a; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.5); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;" onmouseover="this.style.transform='scale(1.05) translateY(-5px)'; this.style.boxShadow='0 20px 40px rgba(16, 185, 129, 0.25), 0 0 0 1px rgba(16, 185, 129, 0.6)';" onmouseout="this.style.transform='scale(1) translateY(0)'; this.style.boxShadow='0 10px 30px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.5)';">
                <!-- Animated AI Pulse Ring -->
                <div style="position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                    <div style="position: absolute; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #10b981, #3b82f6); animation: pulse-glow 2s infinite cubic-bezier(0.4, 0, 0.2, 1);"></div>
                    <img src="/images/logo.png" alt="4LAZIE" style="width: 26px; height: 26px; border-radius: 50%; object-fit: contain; z-index: 2; position: relative; background: #ffffff; padding: 2px;">
                </div>
                <style>
                    @keyframes pulse-glow {
                        0% { transform: scale(0.95); opacity: 0.8; }
                        50% { transform: scale(1.3); opacity: 0; }
                        100% { transform: scale(0.95); opacity: 0; }
                    }
                </style>
                
                <div class="text-start pe-2">
                    <div style="font-size: 0.65rem; font-weight: 700; background: linear-gradient(135deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1;">Stuck on an Assignment?</div>
                    <div style="font-weight: 800; font-family: 'Outfit', sans-serif; font-size: 1rem; color: #1e293b; letter-spacing: 0.3px; line-height: 1.2;">Ask 4LAZIE</div>
                </div>
            </button>

            <!-- ASSIGNMENT HELP MODAL -->
            <div class="modal fade" id="assignmentHelpModal" tabindex="-1" aria-hidden="true" style="backdrop-filter: blur(8px);">
                <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 450px;">
                    <div class="modal-content border-0" style="border-radius: 20px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 20px 40px rgba(0,0,0,0.15); border: 1px solid rgba(16, 185, 129, 0.2);">
                        <div class="modal-header border-0 pb-0 justify-content-center position-relative">
                            <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
                            <div class="text-center mt-2">
                                <div class="mb-2 mx-auto" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
                                    <div style="position: absolute; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2)); animation: pulse-glow 2s infinite cubic-bezier(0.4, 0, 0.2, 1);"></div>
                                    <img src="/images/logo.png" alt="4LAZIE" style="width: 32px; height: 32px; border-radius: 50%; object-fit: contain; z-index: 2; position: relative; background: #ffffff; padding: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                                </div>
                                <h5 class="fw-bold mb-1" style="font-family: 'Outfit', sans-serif; color: #1e293b;">Stuck on an Assignment?</h5>
                            </div>
                        </div>
                        <div class="modal-body p-3 pt-2">
                            <div th:if="${user == null and session.user == null}" class="text-center">
                                <p class="text-muted mb-3" style="font-size: 0.9rem;">Want 4LAZIE to help with your assignment? Create a free account or login to access your Messages and ask for help!</p>
                                <a href="/login" class="btn w-100 fw-bold py-2 mb-2" style="background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">Login</a>
                                <a href="/login" class="btn w-100 fw-bold py-2" style="background: rgba(16, 185, 129, 0.1); color: #059669; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.3);">Create Free Account</a>
                            </div>
                            <div th:if="${user != null or session.user != null}">
                                <p class="text-center text-muted mb-2" style="font-size: 0.85rem; line-height: 1.3;">Drop your question below and our experts will guide you. Check your <a href="/messages" class="fw-bold text-success text-decoration-none">Messages</a> for the reply!</p>
                                <form id="assignmentHelpForm" enctype="multipart/form-data">
                                    <div class="mb-2">
                                        <label class="form-label fw-bold mb-1" style="font-size: 0.8rem; color: #475569;">Subject Name (Required)</label>
                                        <input type="text" name="subjectName" class="form-control" placeholder="e.g. Calculus I" required style="border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); padding: 8px 12px; font-size: 0.85rem; background: #f8fafc;">
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label fw-bold mb-1" style="font-size: 0.8rem; color: #475569;">Question (Optional)</label>
                                        <textarea name="questionText" class="form-control" rows="2" placeholder="Type your question here..." style="border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); padding: 8px 12px; font-size: 0.85rem; background: #f8fafc;"></textarea>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label fw-bold mb-1" style="font-size: 0.8rem; color: #475569;">When do you need this? (Deadline)</label>
                                        <input type="text" name="deadline" class="form-control" placeholder="e.g. Tomorrow morning, Next Friday..." required style="border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); padding: 8px 12px; font-size: 0.85rem; background: #f8fafc;">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold mb-1" style="font-size: 0.8rem; color: #475569;">Attach File/Photo (Optional)</label>
                                        <input type="file" name="file" class="form-control" style="border-radius: 10px; font-size: 0.85rem; padding: 6px 12px; background: #f8fafc;">
                                    </div>
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" id="csrfToken"/>
                                    <button type="submit" id="btnSubmitHelp" class="btn w-100 fw-bold py-2 d-flex justify-content-center align-items-center gap-2" style="background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                                        <i class="bi bi-send-fill"></i> Ask 4LAZIE
                                    </button>
                                </form>
                                <script>
                                    document.getElementById('assignmentHelpForm')?.addEventListener('submit', function(e) {
                                        e.preventDefault();
                                        const btn = document.getElementById('btnSubmitHelp');
                                        const originalBg = 'linear-gradient(135deg, #10b981, #059669)';
                                        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Casting Magic...';
                                        btn.disabled = true;
                                        
                                        const formData = new FormData(this);
                                        
                                        const csrfElement = document.getElementById('csrfToken');
                                        const csrfToken = csrfElement ? csrfElement.value : getCookie('XSRF-TOKEN');
                                        const csrfHeaderName = csrfElement ? csrfElement.name : 'X-CSRF-TOKEN';
                                        
                                        console.log("Sending assignment request with CSRF token length:", csrfToken ? csrfToken.length : 0);
                                        
                                        fetch('/api/assignments/request', {
                                            method: 'POST',
                                            body: formData,
                                            headers: {
                                                'X-CSRF-TOKEN': csrfToken,
                                                'X-XSRF-TOKEN': csrfToken
                                            }
                                        })
                                        .then(async response => {
                                            if(!response.ok) {
                                                throw new Error('Server returned ' + response.status);
                                            }
                                            return response.json();
                                        })
                                        .then(data => {
                                            if(data.success) {
                                                btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> Sent! Check Messages later';
                                                btn.style.background = '#059669';
                                                setTimeout(() => {
                                                    bootstrap.Modal.getInstance(document.getElementById('assignmentHelpModal')).hide();
                                                    this.reset();
                                                    btn.innerHTML = '<i class="bi bi-send-fill"></i> Ask 4LAZIE';
                                                    btn.disabled = false;
                                                    btn.style.background = originalBg;
                                                }, 2000);
                                            } else {
                                                throw new Error(data.message || 'Error occurred');
                                            }
                                        })
                                        .catch(err => {
                                            console.error('Assignment request error:', err);
                                            btn.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> Error! Try again';
                                            btn.style.background = '#ef4444';
                                            setTimeout(() => {
                                                btn.innerHTML = '<i class="bi bi-send-fill"></i> Ask 4LAZIE';
                                                btn.disabled = false;
                                                btn.style.background = originalBg;
                                            }, 3000);
                                        });

                                    });
                                </script>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
</th:block>
