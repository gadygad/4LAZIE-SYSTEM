<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="offcanvas(activePage)">
    <style>
        .premium-sidebar {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: -15px 0 40px rgba(16, 185, 129, 0.08) !important;
            border-left: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .sidebar-nav-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            margin-bottom: 8px;
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .sidebar-nav-item i {
            font-size: 1.25rem;
            margin-right: 14px;
            color: #94a3b8;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Hover Effect */
        .sidebar-nav-item:hover {
            background: rgba(16, 185, 129, 0.06);
            color: #10b981;
            transform: translateX(6px);
            text-decoration: none;
        }
        .sidebar-nav-item:hover i {
            color: #10b981;
            transform: scale(1.15) rotate(5deg);
        }

        /* Active State */
        .sidebar-nav-item.active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.05) 100%);
            color: #059669;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.1);
            border-left: 4px solid #10b981;
            border-radius: 4px 12px 12px 4px;
            text-decoration: none;
        }
        .sidebar-nav-item.active i {
            color: #10b981;
            transform: scale(1.1);
        }

        /* Subtle glow line at bottom of header */
        .sidebar-header-glow {
            position: relative;
        }
        .sidebar-header-glow::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, rgba(16,185,129,0) 0%, rgba(16,185,129,0.3) 50%, rgba(16,185,129,0) 100%);
        }
    </style>

    <div data-bs-scroll="true" data-bs-backdrop="true" class="offcanvas offcanvas-end border-0 premium-sidebar" tabindex="-1" id="adminSidebar" aria-labelledby="adminSidebarLabel" style="width: 280px; max-width: 80vw;">
        <div data-bs-scroll="true" data-bs-backdrop="true" class="offcanvas-header sidebar-header-glow pb-3 pt-4 px-4 border-0">
            <h5 class="offcanvas-title fw-bold d-flex align-items-center" id="adminSidebarLabel" style="font-family: 'Outfit', sans-serif; color: #1e293b; font-size: 1.4rem; letter-spacing: -0.5px;">
                <div style="width: 38px; height: 38px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-right: 12px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);">
                    <i class="bi bi-grid-1x2-fill text-white fs-6"></i>
                </div>
                ADMIN MENU
            </h5>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas" aria-label="Close" style="background-color: rgba(16,185,129,0.1); border-radius: 50%; opacity: 0.8; padding: 10px; transition: all 0.2s;" onmouseover="this.style.backgroundColor='rgba(16,185,129,0.2)'; this.style.opacity='1';" onmouseout="this.style.backgroundColor='rgba(16,185,129,0.1)'; this.style.opacity='0.8';"></button>
        </div>
        <div data-bs-scroll="true" data-bs-backdrop="false" class="offcanvas-body px-4 py-4">
            <div class="d-flex flex-column">
                <p class="text-uppercase fw-bold mb-3 ms-2" style="font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px;">Core Management</p>
                
                <a href="/admin/dashboard" class="sidebar-nav-item" th:classappend="${activePage == 'analytics' ? 'active' : ''}">
                    <i class="bi bi-pie-chart-fill"></i>ANALYTICS DASHBOARD
                </a>
                <a th:if="${session.user != null and session.user.role != null and session.user.role.name() == 'SUPER_ADMIN'}" href="/admin/approvals" class="sidebar-nav-item" th:classappend="${activePage == 'approvals' ? 'active' : ''}">
                    <i class="bi bi-shield-lock-fill"></i>PENDING APPROVALS
                </a>
                <a href="/admin/users" class="sidebar-nav-item" th:classappend="${activePage == 'users' ? 'active' : ''}">
                    <i class="bi bi-people-fill"></i>USERS MANAGEMENT
                </a>
                <a href="/admin/team-members" class="sidebar-nav-item" th:classappend="${activePage == 'team-members' ? 'active' : ''}">
                    <i class="bi bi-person-vcard-fill"></i>TEAM MEMBERS
                </a>
                <a href="/admin/assignments" class="sidebar-nav-item" th:classappend="${activePage == 'assignments' ? 'active' : ''}">
                    <i class="bi bi-question-circle-fill"></i>ASSIGNMENT REQUESTS
                </a>
                <a href="/admin/messages" class="sidebar-nav-item" th:classappend="${activePage == 'messages' ? 'active' : ''}">
                    <i class="bi bi-chat-dots-fill"></i>DIRECT MESSAGES
                    <span th:if="${totalUnreadAdmin != null and totalUnreadAdmin > 0}" class="badge rounded-pill bg-danger ms-auto" th:text="${totalUnreadAdmin}"></span>
                </a>

                <p class="text-uppercase fw-bold mb-3 mt-4 ms-2" style="font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px;">Academic Setup</p>

                <a href="/admin/courses" class="sidebar-nav-item" th:classappend="${activePage == 'courses' ? 'active' : ''}">
                    <i class="bi bi-mortarboard-fill"></i>MANAGE COURSES
                </a>
                <a href="/admin/subjects" class="sidebar-nav-item" th:classappend="${activePage == 'subjects' ? 'active' : ''}">
                    <i class="bi bi-book-half"></i>MANAGE SUBJECTS
                </a>
                <a href="/admin/timetables" class="sidebar-nav-item" th:classappend="${activePage == 'timetables' ? 'active' : ''}">
                    <i class="bi bi-calendar3"></i>TIMETABLES
                </a>
                <a href="/admin/calendar" class="sidebar-nav-item" th:classappend="${activePage == 'calendar' ? 'active' : ''}">
                    <i class="bi bi-calendar-event-fill"></i>ACADEMIC CALENDAR
                </a>

                <p class="text-uppercase fw-bold mb-3 mt-4 ms-2" style="font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px;">Resources</p>

                <a href="/upload" class="sidebar-nav-item" th:classappend="${activePage == 'upload' ? 'active' : ''}">
                    <i class="bi bi-cloud-arrow-up-fill"></i>UPLOAD NOTES
                </a>
                <a href="/admin/notes" class="sidebar-nav-item" th:classappend="${activePage == 'notes' ? 'active' : ''}">
                    <i class="bi bi-journal-text"></i>MANAGE NOTES
                </a>
                <a href="/admin/questions" class="sidebar-nav-item" th:classappend="${activePage == 'questions' ? 'active' : ''}">
                    <i class="bi bi-question-square-fill"></i>QUESTION BANK
                </a>
                <a href="/generate-exam/sjuit-diploma-ue" class="sidebar-nav-item" th:classappend="${activePage == 'generator' ? 'active' : ''}">
                    <i class="bi bi-file-earmark-pdf-fill"></i>EXAM GENERATOR
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Sidebar Global Push Effect -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebars = document.querySelectorAll('.offcanvas');
    sidebars.forEach(function(sidebar) {
        sidebar.addEventListener('show.bs.offcanvas', function () {
            document.body.classList.add('sidebar-is-open');
        });
        sidebar.addEventListener('hide.bs.offcanvas', function () {
            document.body.classList.remove('sidebar-is-open');
        });
    });
});
</script>

</body>
</html>
