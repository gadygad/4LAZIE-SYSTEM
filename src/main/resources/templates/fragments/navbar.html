<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Premium Header Navbar -->
    <nav th:fragment="navbar" id="main-top-navbar" class="navbar sticky-top py-2"
        style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(16,185,129,0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.03); z-index: 99999; width: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
        <style>
            #main-top-navbar.navbar-hidden {
                transform: translateY(-100%);
            }
        </style>
        <div class="container-fluid pe-2 pe-md-4 ps-0">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <!-- Mobile Menu Toggle Button -->
                    <button class="btn border-0 rounded-0" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="Open mobile menu"
                        style="background: rgba(16, 185, 129, 0.1); color: #10b981; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: 10px;">
                        <i class="bi bi-list fs-4"></i>
                    </button>
                    <!-- Brand -->
                    <a class="navbar-brand d-flex align-items-center text-decoration-none"
                        th:href="${session.user != null ? '/dashboard' : '/'}">
                        <div style="background-color: #111111; border: 3px solid #10b981; padding: 6px 12px; margin-right: 8px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);">
                            <span style="color: #ffffff; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.25rem; letter-spacing: 2px; line-height: 1; text-transform: uppercase;">4LAZIE</span>
                        </div>
                    </a>

                </div>

                <div th:replace="~{fragments/top_actions :: actions}"></div>
            </div>
        </div>
        <!-- Premium Horizontal Separator Line -->
        <div
            style="position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, rgba(16, 185, 129, 0) 0%, rgba(16, 185, 129, 0.8) 50%, rgba(16, 185, 129, 0) 100%); box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5);">
        </div>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                var lastScrollTop = 0;
                var navbar = document.getElementById('main-top-navbar');
                window.addEventListener('scroll', function() {
                    if (!navbar) return;
                    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    if (scrollTop > lastScrollTop && scrollTop > 60) {
                        // Scrolling down
                        navbar.classList.add('navbar-hidden');
                    } else {
                        // Scrolling up
                        navbar.classList.remove('navbar-hidden');
                    }
                    lastScrollTop = scrollTop;
                }, { passive: true });
            });
        </script>
    </nav>
</body>
</html>
