<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="actions" class="d-flex align-items-center" style="gap: 0.6rem;">
<!-- Actions (Notifications, Profile) -->
        <!-- Global Search Bar (Desktop only) -->
        <div class="search-container position-relative d-none d-md-block me-2 me-md-3" style="min-width: 160px; max-width: 280px; flex-grow: 1;">
            <i class="bi bi-search position-absolute text-muted" style="left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; z-index: 5; flex-shrink: 0; min-width: 16px;"></i>
            <input type="text" id="globalDesktopSearch" autocomplete="off" class="form-control position-relative" placeholder="Search notes..."
                   style="padding-left: 40px !important; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.1); background: #f8fafc; font-size: 0.85rem; font-weight: 500; transition: all 0.3s ease; color: #1e293b; width: 100%;"
                   onfocus="this.style.boxShadow='0 0 0 4px rgba(16, 185, 129, 0.1)'; this.style.borderColor='rgba(16, 185, 129, 0.3)'; this.style.background='#ffffff';"
                   onblur="setTimeout(()=>{document.getElementById('globalDesktopResults').classList.add('d-none')}, 400); this.style.boxShadow='none'; this.style.borderColor='rgba(0,0,0,0.1)'; this.style.background='#f8fafc';">
            
            <!-- Search Results Dropdown -->
            <div id="globalDesktopResults" class="d-none" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; margin-top: 8px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(16,185,129,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.12); overflow: hidden; max-height: 350px; overflow-y: auto;"></div>
        </div>
        
        <!-- Mobile Search Toggle Button -->
        <button id="mobileSearchToggleBtn" class="d-flex d-md-none align-items-center justify-content-center border-0 me-1" style="width: 40px; height: 40px; border-radius: 50%; background: #f8fafc; border: 1px solid rgba(0,0,0,0.08) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.3s ease;" onmouseover="this.style.background='rgba(16,185,129,0.1)'" onmouseout="this.style.background='#f8fafc'">
            <i class="bi bi-search" style="font-size: 1rem; color: #10b981;"></i>
        </button>

                    
<!-- Home Button -->
                    <a th:href="${session.user != null and (session.user.role.name() == 'ADMIN' or session.user.role.name() == 'SUPER_ADMIN')} ? '/admin/dashboard' : '/dashboard'" 
                       class="d-flex align-items-center justify-content-center text-decoration-none position-relative me-2" 
                       style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #ffffff, #f8fafc); border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);"
                       onmouseover="this.style.boxShadow='0 8px 25px rgba(16, 185, 129, 0.3)'; this.style.transform='translateY(-3px)'; this.style.borderColor='rgba(16, 185, 129, 0.3)'; this.querySelector('i').style.color='#10b981';" 
                       onmouseout="this.style.boxShadow='0 4px 15px rgba(0, 0, 0, 0.05)'; this.style.transform='none'; this.style.borderColor='rgba(0, 0, 0, 0.1)'; this.querySelector('i').style.color='#000000';">
                        <i class="bi bi-house-door-fill" style="color: #000000; font-size: 1.2rem; transition: color 0.3s;"></i>
                    </a>
                    
<!-- Messages Button -->
                    <a href="/messages" class="d-flex align-items-center justify-content-center text-decoration-none position-relative me-2" 
                       style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #ffffff, #f8fafc); border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.08); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);"
                       onmouseover="this.style.boxShadow='0 8px 25px rgba(16, 185, 129, 0.3)'; this.style.transform='translateY(-3px)'; this.querySelector('i').style.color='#10b981';" 
                       onmouseout="this.style.boxShadow='0 4px 15px rgba(16, 185, 129, 0.08)'; this.style.transform='none'; this.querySelector('i').style.color='#10b981';">
                        <i class="bi bi-chat-dots-fill" style="color: #10b981; font-size: 1.2rem; transition: color 0.3s;"></i>
                        <span th:if="${totalUnreadStudent != null and totalUnreadStudent > 0}" th:text="${totalUnreadStudent}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #ef4444; color: #ffffff !important; font-size: 0.75rem; padding: 0.4em 0.6em; border: 2px solid #fff; transform: translate(-30%, 30%) !important; font-weight: 900; box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.4); animation: pulse-red-badge 1.5s infinite;"></span>
                        <span th:if="${totalUnreadAdmin != null and totalUnreadAdmin > 0}" th:text="${totalUnreadAdmin}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #ef4444; color: #ffffff !important; font-size: 0.75rem; padding: 0.4em 0.6em; border: 2px solid #fff; transform: translate(-30%, 30%) !important; font-weight: 900; box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.4); animation: pulse-red-badge 1.5s infinite;"></span>
                    </a>
                    
<!-- Notification Button (Triggers Dropdown) -->
                    <div class="dropdown premium-hover-dropdown">
                        <a href="#" class="d-flex align-items-center justify-content-center text-decoration-none position-relative notification-trigger" id="notificationDropdownTop" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" role="button"
                           style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #ffffff, #f8fafc); border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.08); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);"
                           onmouseover="this.style.boxShadow='0 8px 25px rgba(16, 185, 129, 0.3)'; this.style.transform='translateY(-3px)'; this.querySelector('i').style.color='#10b981';" 
                           onmouseout="this.style.boxShadow='0 4px 15px rgba(16, 185, 129, 0.08)'; this.style.transform='none'; this.querySelector('i').style.color='#10b981';">
                            <i class="bi bi-bell-fill" style="color: #10b981; font-size: 1.2rem; transition: color 0.3s;"></i>
                            <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #ef4444; color: #ffffff !important; font-size: 0.75rem; padding: 0.4em 0.6em; border: 2px solid #fff; transform: translate(-30%, 30%) !important; font-weight: 900; box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(239, 68, 68, 0.4); animation: pulse-red-badge 1.5s infinite;"></span>
                        </a>
                        
                        <!-- Notification Dropdown Menu -->
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg notification-dropdown border-0" aria-labelledby="notificationDropdown" style="border-radius: 16px; min-width: 280px; width: 300px; max-width: 85vw; padding: 0; margin-top: 12px; overflow: hidden; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); top: 100% !important; bottom: auto !important; right: 0 !important; left: auto !important; transform: none !important;">
                            <li class="dropdown-header d-flex justify-content-between align-items-center px-4 py-3 border-bottom" style="background: rgba(248, 250, 252, 0.95);">
                                <h6 class="mb-0 fw-bold" style="font-family: 'Outfit', sans-serif; font-size: 1.1rem; color: #1e293b !important;">Notifications</h6>
                                <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount + ' New'}" class="badge rounded-pill px-2 py-1" style="background: linear-gradient(135deg, #ef4444, #dc2626); color: white !important; font-size: 0.75rem; font-weight: 600; box-shadow: 0 2px 8px rgba(239,68,68,0.4);">3 New</span>
                            </li>
                            
                            <li class="p-0">
                                <div class="list-group list-group-flush" style="max-height: 350px; overflow-y: auto;">
                                    
                                    <div th:if="${notifications == null or #lists.isEmpty(notifications)}" class="text-center py-4">
                                        <i class="bi bi-bell-slash text-muted" style="font-size: 2rem;"></i>
                                        <p class="text-muted mt-2 mb-0" style="font-size: 0.85rem;">No notifications yet</p>
                                    </div>
                                    
                                    <!-- Notification Item -->
                                    <a th:each="notification : ${notifications}" th:href="@{'/api/notifications/click/' + ${notification.id}}" class="list-group-item list-group-item-action py-3 px-4 border-bottom text-decoration-none notification-item flex-shrink-0" th:style="'transition: all 0.3s ease; background-color: ' + (${notification.read} ? 'transparent' : 'rgba(16, 185, 129, 0.05)') + '; position: relative; overflow: hidden; min-height: 80px;'" onmouseover="this.style.backgroundColor='rgba(16, 185, 129, 0.08)'; this.style.paddingLeft='1.8rem';" onmouseout="this.style.backgroundColor=this.getAttribute('data-read') === 'true' ? 'transparent' : 'rgba(16, 185, 129, 0.05)'; this.style.paddingLeft='1.5rem';" th:attr="data-read=${notification.read}">
                                        <div class="accent-bar" style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(to bottom, #10b981, #059669); transform: scaleY(0); transition: transform 0.3s ease; transform-origin: top;"></div>
                                        <div class="d-flex w-100 justify-content-between align-items-start">
                                            <div class="d-flex align-items-start">
                                                <div class="me-3 d-flex justify-content-center align-items-center mt-1" style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.15)); box-shadow: 0 4px 10px rgba(16,185,129,0.1); flex-shrink: 0;">
                                                    <i class="bi bi-info-circle-fill" style="font-size: 1.1rem; color: #10b981;"></i>
                                                </div>
                                                <div>
                                                    <h6 class="mb-1 fw-bold" style="font-size: 0.9rem; color: #0f172a !important;" th:text="${notification.title}">System Update</h6>
                                                    <p class="mb-1" style="font-size: 0.8rem; line-height: 1.4; color: #475569 !important;" th:text="${notification.message}">Message</p>
                                                    <small class="fw-bold text-muted" style="font-size: 0.7rem;" th:text="${#temporals.format(notification.createdAt, 'dd MMM, HH:mm')}">2 hours ago</small>
                                                </div>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            </li>
                            <li class="text-center border-top">
                                <a href="/notifications" class="text-decoration-none fw-bold" style="font-size: 0.9rem; color: #10b981; transition: color 0.2s;">View All Activity</a>
                            </li>
                        </ul>
                        
                        <style>
                            /* Premium Smooth Dropdown Animation */
                            @keyframes premiumDropdownGlow {
                                0% {
                                    opacity: 0;
                                    transform: perspective(1000px) rotateX(-15deg) translateY(-20px) scale(0.95);
                                    box-shadow: 0 0 0 rgba(16, 185, 129, 0);
                                }
                                60% {
                                    transform: perspective(1000px) rotateX(5deg) translateY(5px) scale(1.02);
                                }
                                100% {
                                    opacity: 1;
                                    transform: perspective(1000px) rotateX(0) translateY(0) scale(1);
                                    box-shadow: 0 20px 50px rgba(16, 185, 129, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.1);
                                }
                            }
                            @keyframes pulse-red-badge {
                                0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
                                70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
                                100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
                            }
                            
                            /* Unified class for both dropdowns */
                            .dropdown-menu.notification-dropdown.show,
                            .dropdown-menu.profile-dropdown.show {
                                display: block;
                                transform-origin: top center;
                                animation: premiumDropdownGlow 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
                                box-shadow: 0 20px 50px rgba(16, 185, 129, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.1) !important;
                            }
                            
                            .notification-item:hover .accent-bar {
                                transform: scaleY(1) !important;
                            }
                            
                            /* Staggered falling down animation */
                            @keyframes fallDownFade {
                                0% {
                                    opacity: 0;
                                    transform: translateY(-15px) scale(0.98);
                                }
                                100% {
                                    opacity: 1;
                                    transform: translateY(0) scale(1);
                                }
                            }
                            
                            /* Apply animation when dropdown is shown */
                            .dropdown-menu.show .notification-item {
                                animation: fallDownFade 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                                opacity: 0; /* start hidden */
                            }
                            
                            .dropdown-menu.show .notification-item:nth-child(1) { animation-delay: 0.1s; }
                            .dropdown-menu.show .notification-item:nth-child(2) { animation-delay: 0.15s; }
                            .dropdown-menu.show .notification-item:nth-child(3) { animation-delay: 0.2s; }
                            .dropdown-menu.show .notification-item:nth-child(4) { animation-delay: 0.25s; }
                        </style>
                        <script>
                            if (!window.notificationJsInitialized) {
                                window.notificationJsInitialized = true;
                                document.addEventListener("DOMContentLoaded", function() {
                                    const notifDropdowns = document.querySelectorAll('.notification-trigger');
                                    notifDropdowns.forEach(dropdown => {
                                        dropdown.addEventListener('show.bs.dropdown', function () {
                                            const getCsrfToken = () => {
                                                const match = document.cookie.match(new RegExp('(^| )XSRF-TOKEN=([^;]+)'));
                                                return match ? match[2] : '';
                                            };
                                            fetch('/api/notifications/mark-read', {
                                                method: 'POST',
                                                headers: {
                                                    'Content-Type': 'application/json',
                                                    'X-XSRF-TOKEN': getCsrfToken()
                                                }
                                            }).then(() => {
                                                // Smoothly hide badges
                                                const badges = document.querySelectorAll('.notification-trigger .badge, .notification-dropdown .badge, .notification-badge');
                                                badges.forEach(b => {
                                                    b.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                                                    b.style.opacity = '0';
                                                    b.style.transform = 'scale(0)';
                                                    setTimeout(() => b.style.display = 'none', 300);
                                                });
                                                const items = document.querySelectorAll('.notification-item');
                                                items.forEach(i => {
                                                    i.style.backgroundColor = 'transparent';
                                                    const dot = i.querySelector('.unread-dot');
                                                    if(dot) dot.style.display = 'none';
                                                });
                                            }).catch(e => console.error(e));
                                        });
                                    });
                                });
                            }
                        </script>
                    </div>

        <!-- Portal Switcher Button for Admin/Super Admin -->
        <div th:if="${session.user != null and (session.user.role.name() == 'ADMIN' or session.user.role.name() == 'SUPER_ADMIN')}" class="d-none d-sm-flex align-items-center">
            <a id="portalSwitchBtn" href="/dashboard" class="btn btn-sm rounded-pill px-3 py-1.5 fw-bold d-flex align-items-center gap-2" 
               style="font-size: 0.8rem; background: rgba(16, 185, 129, 0.1); color: #047857; border: 1px solid rgba(16, 185, 129, 0.3); transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
                <i class="bi bi-arrow-left-right"></i>
                <span>Switch Portal</span>
            </a>
        </div>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const switchBtn = document.getElementById('portalSwitchBtn');
                if (switchBtn) {
                    const isAdminPath = window.location.pathname.startsWith('/admin');
                    if (isAdminPath) {
                        switchBtn.href = '/dashboard';
                        switchBtn.querySelector('span').textContent = 'User View';
                        switchBtn.style.background = 'rgba(59, 130, 246, 0.1)';
                        switchBtn.style.color = '#1d4ed8';
                        switchBtn.style.borderColor = 'rgba(59, 130, 246, 0.3)';
                    } else {
                        switchBtn.href = '/admin/dashboard';
                        switchBtn.querySelector('span').textContent = 'Admin View';
                        switchBtn.style.background = 'rgba(16, 185, 129, 0.1)';
                        switchBtn.style.color = '#047857';
                        switchBtn.style.borderColor = 'rgba(16, 185, 129, 0.3)';
                    }
                }
            });
        </script>

        <!-- Profile Dropdown -->
        <div class="dropdown ms-3 premium-hover-dropdown" th:if="${session.user != null}">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="profileDropdownTop" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" 
               style="background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255,255,255,0.6); padding: 5px 16px 5px 5px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,0.8); backdrop-filter: blur(8px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); flex-shrink: 0;"
               onmouseover="this.style.boxShadow='0 8px 25px rgba(16, 185, 129, 0.3), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='translateY(-2px)'; this.style.borderColor='rgba(16, 185, 129, 0.4)';" 
               onmouseout="this.style.boxShadow='0 4px 15px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,0.8)'; this.style.transform='none'; this.style.borderColor='rgba(255, 255, 255, 0.6)';">
                <!-- Profile avatar - single click opens dropdown, double-click opens photo lightbox -->
                <img loading="lazy" th:if="${session.user != null and session.user.profilePicture != null}" th:src="${#strings.startsWith(session.user.profilePicture, 'http')} ? ${session.user.profilePicture} : @{'/uploads/' + ${session.user.profilePicture}}" alt="Profile" class="rounded-circle d-none d-sm-inline-block me-2 profile-pic-trigger" ondblclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); flex-shrink: 0 !important; cursor: pointer;">
                <img loading="lazy" th:unless="${session.user != null and session.user.profilePicture != null}" th:src="'https://ui-avatars.com/api/?name=' + ${session.user != null ? session.user.name : 'Student'} + '&background=10b981&color=fff'" alt="Profile" class="rounded-circle d-none d-sm-inline-block me-2 profile-pic-trigger" ondblclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2); flex-shrink: 0 !important; cursor: pointer;">
                <!-- Mobile-only avatar -->
                <img loading="lazy" th:if="${session.user != null and session.user.profilePicture != null}" th:src="${#strings.startsWith(session.user.profilePicture, 'http')} ? ${session.user.profilePicture} : @{'/uploads/' + ${session.user.profilePicture}}" alt="Profile" class="rounded-circle d-sm-none profile-pic-trigger" ondblclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); flex-shrink: 0 !important; cursor: pointer;">
                <img loading="lazy" th:unless="${session.user != null and session.user.profilePicture != null}" th:src="'https://ui-avatars.com/api/?name=' + ${session.user != null ? session.user.name : 'Student'} + '&background=10b981&color=fff'" alt="Profile" class="rounded-circle d-sm-none profile-pic-trigger" ondblclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2); flex-shrink: 0 !important; cursor: pointer;">
                
                <div class="d-none d-sm-flex flex-column justify-content-center me-2">
                    <span class="fw-bold lh-1" style="font-family: 'Outfit', sans-serif; font-size: 0.9rem; color: #1e293b;" th:text="${session.user != null ? session.user.name : 'Student'}">John Doe</span>
                    <span class="lh-1 mt-1" style="font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #10b981;">Premium</span>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end border-0 mt-3 p-2 profile-dropdown" aria-labelledby="profileDropdownTop" style="border-radius: 24px; min-width: 260px; background: #ffffff; backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.2); transform-origin: top right; z-index: 1050;">
                <li class="px-4 py-3 mb-2" style="background: rgba(16, 185, 129, 0.15); border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.3); box-shadow: inset 0 0 10px rgba(255,255,255,0.2);">
                    <p class="mb-0 fw-bold position-relative" style="font-size: 1.05rem; font-family: 'Outfit', sans-serif; letter-spacing: -0.3px; color: #064e3b !important;" th:text="${session.user != null ? session.user.name : 'Student'}">John Doe</p>
                    <p class="mb-0 fw-bold position-relative" style="font-size: 0.7rem; color: #047857 !important; letter-spacing: 1px; text-transform: uppercase;" th:text="${session.user != null and session.user.courseProgram != null ? session.user.courseProgram : 'STUDENT'}">STUDENT</p>
                </li>
                
                <style>
                    /* Removed old popupAnim since we use the unified premiumDropdownGlow now */
                    @keyframes rotateGlow { 100% { transform: rotate(360deg); } }
                    .premium-dropdown-item {
                        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
                        border-radius: 14px;
                        margin-bottom: 4px;
                        display: flex;
                        align-items: center;
                    }
                    .premium-dropdown-item:hover {
                        background: linear-gradient(90deg, rgba(16, 185, 129, 0.3) 0%, rgba(16, 185, 129, 0.1) 100%) !important;
                        transform: translateX(8px);
                        color: #047857 !important;
                        font-weight: 700 !important;
                        border-left: 3px solid #10b981;
                        box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2);
                    }
                    .premium-dropdown-item:hover .icon-box {
                        transform: scale(1.1);
                        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
                    }
                    .icon-box {
                        width: 36px; height: 36px;
                        border-radius: 10px;
                        display: flex; align-items: center; justify-content: center;
                        transition: all 0.3s ease;
                    }
                    .icon-box-green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
                    .icon-box-red { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
                </style>

                <!-- Admin Dashboard Link (Only visible to admin/super_admin) -->
                <li th:if="${session.user != null and (session.user.role.name() == 'ADMIN' or session.user.role.name() == 'SUPER_ADMIN')}">
                    <a class="dropdown-item py-2 px-3 fw-bold premium-dropdown-item text-secondary" href="/admin/dashboard" style="font-size: 0.95rem;">
                        <div class="icon-box icon-box-green me-3"><i class="bi bi-speedometer2"></i></div>
                        Admin Dashboard
                    </a>
                </li>
                <!-- User Dashboard/Home Link (Visible to everyone) -->
                <li>

                    <a class="dropdown-item py-2 px-3 fw-medium premium-dropdown-item text-secondary" href="/profile" style="font-size: 0.95rem;">
                        <div class="icon-box icon-box-green me-3"><i class="bi bi-person-fill"></i></div>

    <!-- Mobile Search Collapse (Appears below navbar on mobile) -->
    <div class="collapse w-100 d-md-none position-absolute start-0 px-3" id="mobileSearchCollapseGlobal" style="top: 100%; z-index: 1010; background: rgba(255,255,255,0.98); padding-bottom: 15px; border-bottom: 1px solid rgba(16,185,129,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.05);">
        <div class="position-relative mt-2">
            <i class="bi bi-search position-absolute text-muted" style="left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; z-index: 5; color: #059669 !important;"></i>
            <input type="text" id="globalMobileSearch" autocomplete="off" class="form-control w-100" placeholder="Search modules, notes..."
                   style="padding: 10px 16px 10px 40px !important; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); font-size: 0.9rem; font-family: 'Inter', sans-serif; color: #1e293b; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);"
                   onfocus="this.style.boxShadow='0 8px 25px rgba(16, 185, 129,0.15)'; this.style.borderColor='#059669'; this.style.background='#ffffff';"
                   onblur="setTimeout(()=>{document.getElementById('globalMobileResults').classList.add('d-none')}, 400); this.style.boxShadow='inset 0 1px 3px rgba(0,0,0,0.02)'; this.style.borderColor='rgba(16, 185, 129, 0.3)'; this.style.background='rgba(16, 185, 129, 0.05)';">
            <!-- Mobile Search Results Dropdown -->
            <div id="globalMobileResults" class="d-none" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; margin-top: 8px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(16,185,129,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.12); overflow: hidden; max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ====== FAST SEARCH FUNCTIONALITY (Navbar) ======
            const mobileSearchToggleBtn = document.getElementById('mobileSearchToggleBtn');
            const mobileSearchCollapseGlobal = document.getElementById('mobileSearchCollapseGlobal');
            
            if (mobileSearchToggleBtn && mobileSearchCollapseGlobal) {
                mobileSearchToggleBtn.addEventListener('click', () => {
                    if (mobileSearchCollapseGlobal.classList.contains('show')) {
                        mobileSearchCollapseGlobal.classList.remove('show');
                        mobileSearchToggleBtn.innerHTML = '<i class="bi bi-search" style="font-size: 1.1rem;"></i>';
                    } else {
                        mobileSearchCollapseGlobal.classList.add('show');
                        mobileSearchToggleBtn.innerHTML = '<i class="bi bi-x" style="font-size: 1.5rem;"></i>';
                        setTimeout(() => document.getElementById('globalMobileSearch').focus(), 100);
                    }
                });
            }

            function initGlobalSearch(inputId, resultsId) {
                const input = document.getElementById(inputId);
                const results = document.getElementById(resultsId);
                if (!input || !results) return;
                let timeout = null;
                let searchCache = {};

                input.addEventListener('input', function(e) {
                    clearTimeout(timeout);
                    const query = e.target.value.trim();
                    
                    if (query.length < 2) {
                        results.classList.add('d-none');
                        return;
                    }

                    if (searchCache[query]) {
                        results.classList.remove('d-none');
                        results.innerHTML = '';
                        renderGlobalResults(searchCache[query], query, results);
                        return;
                    }

                    results.classList.remove('d-none');
                    results.innerHTML = '<div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Searching...</div>';

                    timeout = setTimeout(() => {
                        fetch(`/api/search?q=${encodeURIComponent(query)}`)
                            .then(response => response.json())
                            .then(data => {
                                searchCache[query] = data;
                                results.innerHTML = '';
                                renderGlobalResults(data, query, results);
                            })
                            .catch(() => {
                                results.innerHTML = '<div class="p-3 text-center text-danger" style="font-size: 0.85rem;"><i class="bi bi-exclamation-circle me-1"></i>Error loading results</div>';
                            });
                    }, 200);
                });
            }

            function renderGlobalResults(data, query, container) {
                container.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    const list = document.createElement('div');
                    list.className = 'list-group list-group-flush rounded-3';
                    data.results.forEach(note => {
                        const a = document.createElement('a');
                        a.href = `/download/${note.id}`;
                        a.className = 'list-group-item list-group-item-action d-flex align-items-center p-3 border-bottom-0';
                        a.style.transition = 'background-color 0.2s';
                        let icon = 'bi-file-earmark-text', iconColor = 'text-primary', bg = 'rgba(59, 130, 246, 0.1)';
                        if (note.category === 'Past Paper') { icon = 'bi-file-earmark-pdf'; iconColor = 'text-danger'; bg = 'rgba(239, 68, 68, 0.1)'; }
                        else if (note.category === 'Assignment') { icon = 'bi-journal-check'; iconColor = 'text-success'; bg = 'rgba(16, 185, 129, 0.1)'; }
                        a.innerHTML = `<div class="icon-box me-3 d-flex align-items-center justify-content-center rounded-3" style="width:36px;height:36px;background:${bg}"><i class="bi ${icon} ${iconColor} fs-6"></i></div><div class="flex-grow-1 overflow-hidden"><h6 class="mb-0 fw-bold text-truncate" style="font-size:0.85rem;color:#1e293b">${note.title}</h6><small class="text-muted" style="font-size:0.7rem;font-weight:500">Level ${note.levelNo} \u2022 ${note.category || 'Note'}</small></div><i class="bi bi-chevron-right text-muted" style="font-size:0.8rem"></i>`;
                        list.appendChild(a);
                    });
                    if (data.totalMatches > 5) {
                        const viewAll = document.createElement('a');
                        viewAll.href = `/notes?search=${encodeURIComponent(query)}`;
                        viewAll.className = 'list-group-item text-center text-primary fw-bold p-2';
                        viewAll.style.fontSize = '0.8rem';
                        viewAll.style.background = '#f8fafc';
                        viewAll.innerHTML = `View all ${data.totalMatches} results <i class="bi bi-arrow-right ms-1"></i>`;
                        list.appendChild(viewAll);
                    }
                    container.appendChild(list);
                } else {
                    container.innerHTML = '<div class="p-4 text-center text-muted"><i class="bi bi-emoji-frown fs-4 d-block mb-2 text-secondary"></i><span style="font-size:0.85rem">No results found for "'+query+'"</span></div>';
                }
            }

            initGlobalSearch('globalDesktopSearch', 'globalDesktopResults');
            initGlobalSearch('globalMobileSearch', 'globalMobileResults');

        });
    </script>
        
        <!-- Profile Picture Lightbox JS -->
        <script>
            function openProfileLightbox(src) {
                let lightbox = document.getElementById('profileLightbox');
                if (!lightbox) {
                    lightbox = document.createElement('div');
                    lightbox.id = 'profileLightbox';
                    lightbox.style.cssText = 'position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 99999; display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); cursor: zoom-out;';
                    
                    const imgContainer = document.createElement('div');
                    imgContainer.style.cssText = 'position: relative; transform: scale(0.8) translateY(20px); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);';
                    
                    const img = document.createElement('img');
                    img.id = 'profileLightboxImg';
                    img.style.cssText = 'max-width: 85vw; max-height: 85vh; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 25px 60px rgba(16,185,129,0.4); object-fit: cover; aspect-ratio: 1/1; width: 400px; height: 400px; background: #f8fafc;';
                    
                    const closeBtn = document.createElement('div');
                    closeBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
                    closeBtn.style.cssText = 'position: absolute; top: -20px; right: -20px; color: #1e293b; font-size: 1.2rem; cursor: pointer; background: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s, background 0.2s;';
                    closeBtn.onmouseover = () => { closeBtn.style.transform = 'scale(1.1) rotate(90deg)'; closeBtn.style.background = '#f8fafc'; };
                    closeBtn.onmouseout = () => { closeBtn.style.transform = 'scale(1) rotate(0deg)'; closeBtn.style.background = '#fff'; };
                    
                    imgContainer.appendChild(img);
                    imgContainer.appendChild(closeBtn);
                    lightbox.appendChild(imgContainer);
                    
                    lightbox.onclick = function() {
                        lightbox.style.opacity = '0';
                        imgContainer.style.transform = 'scale(0.8) translateY(20px)';
                        setTimeout(() => lightbox.style.display = 'none', 400);
                    };
                    
                    document.body.appendChild(lightbox);
                }
                
                const imgElement = document.getElementById('profileLightboxImg');
                imgElement.src = src;
                
                // If it's a ui-avatars URL, make it high-res for the modal
                if (src.includes('ui-avatars.com')) {
                    imgElement.src = src.replace(/&size=\d+/, '') + '&size=500';
                }
                
                lightbox.style.display = 'flex';
                // Trigger reflow
                void lightbox.offsetWidth;
                lightbox.style.opacity = '1';
                lightbox.children[0].style.transform = 'scale(1) translateY(0)';
            }
        </script>
        <!-- 4LAZIE Controls: Hamburger, Dropdowns, Search - must load after Bootstrap JS -->
        <script src="/js/4lazie-controls.js?v=2.2"></script>
    </div>
