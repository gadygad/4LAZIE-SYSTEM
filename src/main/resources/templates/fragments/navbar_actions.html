<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="actions" class="d-flex align-items-center">
        <!-- Global Search Bar -->
        <div class="search-container position-relative me-2 me-md-3 d-block" style="min-width: 140px; max-width: 280px; flex-grow: 1;">
            <i class="bi bi-search position-absolute text-muted" style="left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; z-index: 5; flex-shrink: 0; min-width: 16px;"></i>
            <input type="text" id="globalDesktopSearch" autocomplete="off" class="form-control position-relative" placeholder="Search notes..."
                   style="padding-left: 40px !important; padding-right: 16px; padding-top: 6px; padding-bottom: 6px; border-radius: 50px; border: 1px solid rgba(0,0,0,0.1); background: #f8fafc; font-size: 0.85rem; font-weight: 500; transition: all 0.3s ease; color: #1e293b; width: 100%;"
                   onfocus="this.style.boxShadow='0 0 0 4px rgba(16, 185, 129, 0.1)'; this.style.borderColor='rgba(16, 185, 129, 0.3)'; this.style.background='#ffffff';"
                   onblur="setTimeout(()=>{document.getElementById('globalDesktopResults').classList.add('d-none')}, 400); this.style.boxShadow='none'; this.style.borderColor='rgba(0,0,0,0.1)'; this.style.background='#f8fafc';">
            
            <!-- Search Results Dropdown -->
            <div id="globalDesktopResults" class="d-none" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; margin-top: 8px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(16,185,129,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.12); overflow: hidden; max-height: 350px; overflow-y: auto;"></div>
        </div>


        <!-- Action Buttons -->
        <div class="d-flex align-items-center me-2 me-md-4">
            <!-- Premium Home & Notification Buttons -->
            <div class="d-flex align-items-center">
                
                <style>
                    /* Theme Variables for Notifications */
                    :root {
                        --noti-color: var(--noti-color);
                        --noti-color-dark: #d35400;
                        --noti-bg-light: rgba(230, 126, 34, 0.04);
                        --noti-bg-medium: rgba(230, 126, 34, 0.15);
                        --noti-bg-dark: rgba(211, 84, 0, 0.25);
                        --noti-shadow: var(--noti-border);
                        --noti-border: rgba(230, 126, 34, 0.4);
                    }
                </style>
                <style th:if="${session.user != null}">
                    /* Green Theme for Logged-In Users */
                    :root {
                        --noti-color: #10b981;
                        --noti-color-dark: #059669;
                        --noti-bg-light: rgba(16, 185, 129, 0.04);
                        --noti-bg-medium: rgba(16, 185, 129, 0.15);
                        --noti-bg-dark: rgba(5, 150, 105, 0.25);
                        --noti-shadow: rgba(16, 185, 129, 0.3);
                        --noti-border: rgba(16, 185, 129, 0.4);
                    }
                </style>
                <style>
                    @keyframes popupAnim {
                        0% { opacity: 0; transform: scale(0.9) translateY(-10px); }
                        100% { opacity: 1; transform: scale(1) translateY(0); }
                    }
                    @keyframes pulse-red {
                        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
                        70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
                        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
                    }
                    @media (max-width: 576px) {
                        .dropdown-menu {
                            width: 280px !important;
                            min-width: unset !important;
                            transform-origin: top right !important;
                            box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important;
                            border-radius: 16px !important;
                            margin-top: 10px !important;
                        }
                    }
                </style>
                <!-- Dark Mode Toggle Button -->
                <button id="darkModeToggleGlobal" class="d-none d-sm-flex align-items-center justify-content-center me-2 me-md-3 text-decoration-none position-relative dark-mode-toggle-btn" 
                   style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.85)); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.08), inset 0 2px 5px rgba(255,255,255,1); backdrop-filter: blur(12px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer;"
                   onmouseover="this.style.boxShadow='0 8px 25px rgba(100, 116, 139, 0.3), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='translateY(-3px)';" 
                   onmouseout="this.style.boxShadow='0 4px 15px rgba(0,0,0,0.08), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='none';">
                    <i class="bi bi-moon-stars-fill darkModeIcon" style="color: #64748b; font-size: 1.1rem; transition: color 0.3s, transform 0.5s;"></i>
                </button>

                <!-- Home Button -->
                <a href="/" class="d-none d-sm-flex align-items-center justify-content-center me-2 me-md-3 text-decoration-none position-relative" 
                   style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.85)); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.08), inset 0 2px 5px rgba(255,255,255,1); backdrop-filter: blur(12px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);"
                   onmouseover="this.style.boxShadow='0 8px 25px var(--noti-shadow), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='translateY(-3px)'; this.style.borderColor='var(--noti-border)'; this.querySelector('i').style.color='var(--noti-color)';" 
                   onmouseout="this.style.boxShadow='0 4px 15px rgba(0,0,0,0.08), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='none'; this.style.borderColor='rgba(255, 255, 255, 0.8)'; this.querySelector('i').style.color='#64748b';">
                    <i class="bi bi-house-door-fill" style="color: #64748b; font-size: 1.2rem; transition: color 0.3s;"></i>
                </a>

                <!-- Notification Button -->
                <div class="dropdown me-2 me-md-3">
                    <a href="#" class="d-flex align-items-center justify-content-center text-decoration-none position-relative notification-trigger" data-bs-toggle="dropdown" aria-expanded="false"
                       style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,250,252,0.85)); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.08), inset 0 2px 5px rgba(255,255,255,1); backdrop-filter: blur(12px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);"
                       onmouseover="this.style.boxShadow='0 8px 25px var(--noti-shadow), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='translateY(-3px)'; this.style.borderColor='var(--noti-border)'; this.querySelector('i').style.color='var(--noti-color)';" 
                       onmouseout="this.style.boxShadow='0 4px 15px rgba(0,0,0,0.08), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='none'; this.style.borderColor='rgba(255, 255, 255, 0.8)'; this.querySelector('i').style.color='#64748b';">
                        <i class="bi bi-bell-fill" style="color: #64748b; font-size: 1.1rem; transition: color 0.3s;"></i>
                    <!-- Notification Badge with Pulse -->
                    <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #ef4444; color: #ffffff !important; font-size: 0.75rem; padding: 0.35em 0.6em; border: 2px solid #fff; transform: translate(-30%, 30%) !important; animation: pulse-red 2s infinite; font-weight: 900; box-shadow: 0 2px 5px rgba(239, 68, 68, 0.5);">
                        0
                    </span>
                </a>
                
                <!-- Notification Dropdown Menu -->
                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-3 p-0 notification-dropdown" aria-labelledby="notificationDropdown" style="border-radius: 20px; min-width: 320px; overflow: hidden; transform-origin: top right; border: 1px solid rgba(255,255,255,0.5);">
                    <li class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center" style="background: rgba(248, 250, 252, 0.95); backdrop-filter: blur(10px);">
                        <span class="fw-bold text-dark" style="font-family: 'Outfit', sans-serif; font-size: 1rem;">Notifications</span>
                        <span th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" th:text="${unreadNotificationCount + ' New'}" class="badge rounded-pill px-2 py-1 text-white" style="background: linear-gradient(135deg, var(--noti-color), var(--noti-color-dark)); font-weight: 600; box-shadow: 0 2px 8px var(--noti-shadow); font-size: 0.7rem;">0 New</span>
                    </li>
                    <li>
                        <div class="list-group list-group-flush" style="max-height: 350px; overflow-y: auto;">
                            <!-- Empty State -->
                            <th:block th:if="${notifications == null or #lists.isEmpty(notifications)}">
                                <div class="text-center py-4">
                                    <i class="bi bi-bell-slash text-muted" style="font-size: 2rem;"></i>
                                    <p class="text-muted mt-2 mb-0" style="font-size: 0.85rem;">No notifications yet</p>
                                </div>
                            </th:block>
                            
                            <!-- Dynamic Notifications -->
                            <th:block th:unless="${notifications == null or #lists.isEmpty(notifications)}">
                                <a th:each="notification : ${notifications}" th:href="@{'/api/notifications/click/' + ${notification.id}}" class="list-group-item list-group-item-action py-3 px-4 border-bottom notification-item flex-shrink-0" th:style="'transition: background 0.2s; background: ' + (${notification.read} ? 'transparent' : 'var(--noti-bg-light)') + '; min-height: 80px; position: relative; overflow: hidden;'" th:attr="data-read=${notification.read}">
                                    <div class="d-flex w-100 justify-content-between align-items-start">
                                        <div class="d-flex align-items-start">
                                            <div class="me-3 d-flex justify-content-center align-items-center mt-1" style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--noti-bg-medium), var(--noti-bg-dark)); box-shadow: 0 2px 10px var(--noti-shadow);">
                                                <i class="bi bi-info-circle-fill" style="font-size: 1.2rem; color: var(--noti-color);"></i>
                                            </div>
                                            <div>
                                                <h6 class="mb-1 fw-bold text-dark" style="font-size: 0.95rem;" th:text="${notification.title}">Title</h6>
                                                <p class="mb-1 text-muted" style="font-size: 0.85rem; line-height: 1.4;" th:text="${notification.message}">Message</p>
                                                <small class="fw-bold" style="font-size: 0.75rem; color: var(--noti-color);" th:text="${#temporals.format(notification.createdAt, 'dd MMM, HH:mm')}">Time</small>
                                            </div>
                                        </div>
                                        <div th:unless="${notification.read}" style="width: 10px; height: 10px; background: linear-gradient(135deg, #e67e22, #d35400); border-radius: 50%; margin-top: 6px; box-shadow: 0 0 8px rgba(230,126,34,0.5);"></div>
                                    </div>
                                </a>
                            </th:block>
                        </div>
                    </li>
                    <li class="text-center py-3 bg-light border-top">
                        <a href="/notifications" class="text-decoration-none fw-bold" style="font-size: 0.9rem; color: #10b981; transition: color 0.2s;">View All Notifications</a>
                    </li>
                </ul>
                
                <style>
                    /* Smooth Dropdown Animation */
                    @keyframes customDropdownFadeIn {
                        0% {
                            opacity: 0;
                            transform: perspective(400px) rotateX(-10deg) translateY(15px) scale(0.95);
                        }
                        100% {
                            opacity: 1;
                            transform: perspective(400px) rotateX(0) translateY(0) scale(1);
                        }
                    }
                    
                    .dropdown-menu.notification-dropdown.show {
                        animation: customDropdownFadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
                        display: block;
                        box-shadow: 0 20px 50px rgba(16, 185, 129, 0.15), 0 0 0 1px rgba(16, 185, 129, 0.1) !important;
                    }
                    
                    /* Staggered falling down animation */
                    @keyframes fallDownFade {
                        0% {
                            opacity: 0;
                            transform: translateY(-15px) scale(0.98);
                        }
                        100% {
                            opacity: 1;
                            transform: translateY(0) scale(1);
                        }
                    }
                    
                    /* Apply animation when dropdown is shown */
                    .dropdown-menu.show .notification-item {
                        animation: fallDownFade 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                        opacity: 0; /* start hidden */
                    }
                    
                    .dropdown-menu.show .notification-item:nth-child(1) { animation-delay: 0.05s; }
                    .dropdown-menu.show .notification-item:nth-child(2) { animation-delay: 0.1s; }
                    .dropdown-menu.show .notification-item:nth-child(3) { animation-delay: 0.15s; }
                    .dropdown-menu.show .notification-item:nth-child(4) { animation-delay: 0.2s; }
                </style>
                <script>
                    if (!window.notificationJsInitialized) {
                        window.notificationJsInitialized = true;
                        document.addEventListener("DOMContentLoaded", function() {
                            const notifDropdowns = document.querySelectorAll('.notification-trigger');
                            notifDropdowns.forEach(dropdown => {
                                dropdown.addEventListener('show.bs.dropdown', function () {
                                    const getCsrfToken = () => {
                                        const match = document.cookie.match(new RegExp('(^| )XSRF-TOKEN=([^;]+)'));
                                        return match ? match[2] : '';
                                    };
                                    fetch('/api/notifications/mark-read', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'X-XSRF-TOKEN': getCsrfToken()
                                        }
                                    }).then(() => {
                                        // Smoothly hide badges
                                        const badges = document.querySelectorAll('.notification-trigger .badge, .notification-dropdown .badge, .notification-badge');
                                        badges.forEach(b => {
                                            b.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                                            b.style.opacity = '0';
                                            b.style.transform = 'scale(0)';
                                            setTimeout(() => b.style.display = 'none', 300);
                                        });
                                        const items = document.querySelectorAll('.notification-item');
                                        items.forEach(i => {
                                            i.style.backgroundColor = 'transparent';
                                            const dot = i.querySelector('.unread-dot');
                                            if(dot) dot.style.display = 'none';
                                        });
                                    }).catch(e => console.error(e));
                                });
                            });
                        });
                    }
                </script>
                </div>
            </div>
        </div>

        <!-- Profile Dropdown -->
        <div class="dropdown" th:if="${session.user != null}">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false" 
               style="background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255,255,255,0.6); padding: 5px 16px 5px 5px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,0.8); backdrop-filter: blur(8px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); flex-shrink: 0;"
               onmouseover="this.style.boxShadow='0 8px 25px var(--noti-shadow), inset 0 2px 5px rgba(255,255,255,1)'; this.style.transform='translateY(-2px)'; this.style.borderColor='var(--noti-border)';" 
               onmouseout="this.style.boxShadow='0 4px 15px rgba(0,0,0,0.05), inset 0 2px 5px rgba(255,255,255,0.8)'; this.style.transform='none'; this.style.borderColor='rgba(255, 255, 255, 0.6)';">
                <img loading="lazy" th:if="${session.user != null and session.user.profilePicture != null}" th:src="${#strings.startsWith(session.user.profilePicture, 'http')} ? ${session.user.profilePicture} : @{'/uploads/' + ${session.user.profilePicture}}" alt="Profile" class="rounded-circle d-none d-sm-inline-block me-2 profile-pic-trigger" onclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px var(--noti-shadow); flex-shrink: 0 !important; cursor: pointer;">
                <img loading="lazy" th:unless="${session.user != null and session.user.profilePicture != null}" th:src="'https://ui-avatars.com/api/?name=' + ${session.user != null ? session.user.name : 'Student'} + '&background=10b981&color=fff'" alt="Profile" class="rounded-circle d-none d-sm-inline-block me-2 profile-pic-trigger" onclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2); flex-shrink: 0 !important; cursor: pointer;">
                <!-- Mobile-only avatar without margin -->
                <img loading="lazy" th:if="${session.user != null and session.user.profilePicture != null}" th:src="${#strings.startsWith(session.user.profilePicture, 'http')} ? ${session.user.profilePicture} : @{'/uploads/' + ${session.user.profilePicture}}" alt="Profile" class="rounded-circle d-sm-none profile-pic-trigger" onclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px var(--noti-shadow); flex-shrink: 0 !important; cursor: pointer;">
                <img loading="lazy" th:unless="${session.user != null and session.user.profilePicture != null}" th:src="'https://ui-avatars.com/api/?name=' + ${session.user != null ? session.user.name : 'Student'} + '&background=10b981&color=fff'" alt="Profile" class="rounded-circle d-sm-none profile-pic-trigger" onclick="event.preventDefault(); event.stopPropagation(); openProfileLightbox(this.src);" style="width: 40px; height: 40px; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(16, 185, 129, 0.2); flex-shrink: 0 !important; cursor: pointer;">
                
                <div class="d-none d-sm-flex flex-column justify-content-center me-2">
                    <span class="fw-bold lh-1" style="font-family: 'Outfit', sans-serif; font-size: 0.9rem; color: #1e293b;" th:text="${session.user != null ? session.user.name : 'Student'}">John Doe</span>
                    <span class="lh-1 mt-1" style="font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--noti-color);">Premium</span>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end border-0 mt-3 p-2 profile-dropdown" aria-labelledby="profileDropdown" style="border-radius: 24px; min-width: 260px; background: rgba(16, 185, 129, 0.08); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.25), inset 0 2px 10px rgba(255,255,255,0.4); border: 1px solid rgba(16, 185, 129, 0.3); animation: popupAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform-origin: top right;">
                <li class="px-4 py-3 mb-2" style="background: rgba(16, 185, 129, 0.15); border-radius: 16px; border: 1px solid rgba(16, 185, 129, 0.3); box-shadow: inset 0 0 10px rgba(255,255,255,0.2);">
                    <p class="mb-0 fw-bold position-relative" style="font-size: 1.05rem; font-family: 'Outfit', sans-serif; letter-spacing: -0.3px; color: #064e3b !important;" th:text="${session.user != null ? session.user.name : 'Student'}">John Doe</p>
                    <p class="mb-0 fw-bold position-relative" style="font-size: 0.7rem; color: #047857 !important; letter-spacing: 1px; text-transform: uppercase;" th:text="${session.user != null and session.user.courseProgram != null ? session.user.courseProgram : 'STUDENT'}">STUDENT</p>
                </li>
                
                <style>
                    @keyframes rotateGlow { 100% { transform: rotate(360deg); } }
                    .premium-dropdown-item {
                        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
                        border-radius: 14px;
                        margin-bottom: 4px;
                        display: flex;
                        align-items: center;
                    }
                    .premium-dropdown-item:hover {
                        background: linear-gradient(90deg, rgba(16, 185, 129, 0.3) 0%, rgba(16, 185, 129, 0.1) 100%) !important;
                        transform: translateX(8px);
                        color: #047857 !important;
                        font-weight: 700 !important;
                        border-left: 3px solid #10b981;
                        box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2);
                    }
                    .premium-dropdown-item:hover .icon-box {
                        transform: scale(1.1);
                        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
                    }
                    .icon-box {
                        width: 36px; height: 36px;
                        border-radius: 10px;
                        display: flex; align-items: center; justify-content: center;
                        transition: all 0.3s ease;
                    }
                    .icon-box-green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
                    .icon-box-red { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
                </style>

                <li th:if="${session.user != null and session.user.role == 'ADMIN'}">
                    <a class="dropdown-item py-2 px-3 fw-bold premium-dropdown-item text-secondary" href="/upload" style="font-size: 0.95rem;">
                        <div class="icon-box icon-box-green me-3"><i class="bi bi-speedometer2"></i></div>
                        Admin Dashboard
                    </a>
                </li>
                <li th:unless="${session.user != null and session.user.role == 'ADMIN'}">
                    <a class="dropdown-item py-2 px-3 fw-medium premium-dropdown-item text-secondary" href="/dashboard" style="font-size: 0.95rem;">
                        <div class="icon-box icon-box-green me-3"><i class="bi bi-grid-1x2-fill"></i></div>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a class="dropdown-item py-2 px-3 fw-medium premium-dropdown-item text-secondary" href="/profile" style="font-size: 0.95rem;">
                        <div class="icon-box icon-box-green me-3"><i class="bi bi-person-fill"></i></div>
                        My Profile
                    </a>
                </li>
                <li>
                    <a class="dropdown-item py-2 px-3 fw-medium premium-dropdown-item text-secondary" href="#" style="font-size: 0.95rem;">
                        <div class="icon-box icon-box-green me-3"><i class="bi bi-gear-fill"></i></div>
                        Settings
                    </a>
                </li>
                <li><hr class="dropdown-divider my-2 opacity-25" style="border-color: rgba(16, 185, 129, 0.3);"></li>
                <li>
                    <a class="dropdown-item py-2 px-3 mb-1 fw-bold text-secondary" href="/logout" style="font-size: 0.95rem; border-radius: 14px; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; align-items: center;" onmouseover="this.style.background='linear-gradient(90deg, rgba(239, 68, 68, 0.15) 0%, rgba(239, 68, 68, 0.02) 100%)'; this.style.borderLeft='3px solid #ef4444'; this.style.transform='translateX(5px)'; this.style.color='#dc2626';" onmouseout="this.style.background='transparent'; this.style.borderLeft='none'; this.style.transform='none'; this.style.color='#6c757d';">
                        <div class="icon-box icon-box-red me-3"><i class="bi bi-box-arrow-right"></i></div>
                        Logout
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="d-flex align-items-center gap-2" th:unless="${session.user != null}">
            <!-- Story Pill -->
            <a href="about.html" th:href="@{/about}" class="magic-auth-btn">
                Story
            </a>
            <!-- Login Button -->
            <a th:href="@{/login}" class="magic-auth-btn">
                <i class="bi bi-person-fill" style="font-size: 1rem;"></i> <span>Login</span>
            </a>
        </div>
    </div>
    
    <!-- Mobile Search Collapse (Appears below navbar on mobile) -->
    <div class="collapse w-100 d-md-none position-absolute start-0 px-3" id="mobileSearchCollapseGlobal" style="top: 100%; z-index: 1010; background: rgba(255,255,255,0.98); padding-bottom: 15px; border-bottom: 1px solid rgba(16,185,129,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.05);">
        <div class="position-relative mt-2">
            <i class="bi bi-search position-absolute text-muted" style="left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; z-index: 5; color: #059669 !important;"></i>
            <input type="text" id="globalMobileSearch" autocomplete="off" class="form-control w-100" placeholder="Search modules, notes..."
                   style="padding: 10px 16px 10px 40px !important; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); font-size: 0.9rem; font-family: 'Inter', sans-serif; color: #1e293b; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);"
                   onfocus="this.style.boxShadow='0 8px 25px rgba(16, 185, 129,0.15)'; this.style.borderColor='#059669'; this.style.background='#ffffff';"
                   onblur="setTimeout(()=>{document.getElementById('globalMobileResults').classList.add('d-none')}, 400); this.style.boxShadow='inset 0 1px 3px rgba(0,0,0,0.02)'; this.style.borderColor='rgba(16, 185, 129, 0.3)'; this.style.background='rgba(16, 185, 129, 0.05)';">
            <!-- Mobile Search Results Dropdown -->
            <div id="globalMobileResults" class="d-none" style="position: absolute; top: 100%; left: 0; right: 0; z-index: 9999; margin-top: 8px; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid rgba(16,185,129,0.15); box-shadow: 0 15px 40px rgba(0,0,0,0.12); overflow: hidden; max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Dark Mode Logic
            const toggleBtns = document.querySelectorAll('.dark-mode-toggle-btn');
            const icons = document.querySelectorAll('.darkModeIcon');
            
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
                icons.forEach(i => {
                    i.classList.remove('bi-moon-stars-fill');
                    i.classList.add('bi-sun-fill');
                });
            }

            toggleBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.classList.toggle('dark-mode');
                    let theme = 'light';
                    if (document.body.classList.contains('dark-mode')) {
                        theme = 'dark';
                        icons.forEach(i => {
                            i.classList.remove('bi-moon-stars-fill');
                            i.classList.add('bi-sun-fill');
                        });
                    } else {
                        icons.forEach(i => {
                            i.classList.remove('bi-sun-fill');
                            i.classList.add('bi-moon-stars-fill');
                        });
                    }
                    localStorage.setItem('theme', theme);
                });
            });

            // ====== FAST SEARCH FUNCTIONALITY (Navbar) ======
            const mobileSearchToggleBtn = document.getElementById('mobileSearchToggleBtn');
            const mobileSearchCollapseGlobal = document.getElementById('mobileSearchCollapseGlobal');
            
            if (mobileSearchToggleBtn && mobileSearchCollapseGlobal) {
                mobileSearchToggleBtn.addEventListener('click', () => {
                    if (mobileSearchCollapseGlobal.classList.contains('show')) {
                        mobileSearchCollapseGlobal.classList.remove('show');
                        mobileSearchToggleBtn.innerHTML = '<i class="bi bi-search" style="font-size: 1.1rem;"></i>';
                    } else {
                        mobileSearchCollapseGlobal.classList.add('show');
                        mobileSearchToggleBtn.innerHTML = '<i class="bi bi-x" style="font-size: 1.5rem;"></i>';
                        setTimeout(() => document.getElementById('globalMobileSearch').focus(), 100);
                    }
                });
            }

            function initGlobalSearch(inputId, resultsId) {
                const input = document.getElementById(inputId);
                const results = document.getElementById(resultsId);
                if (!input || !results) return;
                let timeout = null;
                let searchCache = {};

                input.addEventListener('input', function(e) {
                    clearTimeout(timeout);
                    const query = e.target.value.trim();
                    
                    if (query.length < 2) {
                        results.classList.add('d-none');
                        return;
                    }

                    if (searchCache[query]) {
                        results.classList.remove('d-none');
                        results.innerHTML = '';
                        renderGlobalResults(searchCache[query], query, results);
                        return;
                    }

                    results.classList.remove('d-none');
                    results.innerHTML = '<div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Searching...</div>';

                    timeout = setTimeout(() => {
                        fetch(`/api/search?q=${encodeURIComponent(query)}`)
                            .then(response => response.json())
                            .then(data => {
                                searchCache[query] = data;
                                results.innerHTML = '';
                                renderGlobalResults(data, query, results);
                            })
                            .catch(() => {
                                results.innerHTML = '<div class="p-3 text-center text-danger" style="font-size: 0.85rem;"><i class="bi bi-exclamation-circle me-1"></i>Error loading results</div>';
                            });
                    }, 200);
                });
            }

            function renderGlobalResults(data, query, container) {
                container.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    const list = document.createElement('div');
                    list.className = 'list-group list-group-flush rounded-3';
                    data.results.forEach(note => {
                        const a = document.createElement('a');
                        a.href = `/download/${note.id}`;
                        a.className = 'list-group-item list-group-item-action d-flex align-items-center p-3 border-bottom-0';
                        a.style.transition = 'background-color 0.2s';
                        let icon = 'bi-file-earmark-text', iconColor = 'text-primary', bg = 'rgba(59, 130, 246, 0.1)';
                        if (note.category === 'Past Paper') { icon = 'bi-file-earmark-pdf'; iconColor = 'text-danger'; bg = 'rgba(239, 68, 68, 0.1)'; }
                        else if (note.category === 'Assignment') { icon = 'bi-journal-check'; iconColor = 'text-success'; bg = 'rgba(16, 185, 129, 0.1)'; }
                        a.innerHTML = `<div class="icon-box me-3 d-flex align-items-center justify-content-center rounded-3" style="width:36px;height:36px;background:${bg}"><i class="bi ${icon} ${iconColor} fs-6"></i></div><div class="flex-grow-1 overflow-hidden"><h6 class="mb-0 fw-bold text-truncate" style="font-size:0.85rem;color:#1e293b">${note.title}</h6><small class="text-muted" style="font-size:0.7rem;font-weight:500">Level ${note.levelNo} \u2022 ${note.category || 'Note'}</small></div><i class="bi bi-chevron-right text-muted" style="font-size:0.8rem"></i>`;
                        list.appendChild(a);
                    });
                    if (data.totalMatches > 5) {
                        const viewAll = document.createElement('a');
                        viewAll.href = `/notes?search=${encodeURIComponent(query)}`;
                        viewAll.className = 'list-group-item text-center text-primary fw-bold p-2';
                        viewAll.style.fontSize = '0.8rem';
                        viewAll.style.background = '#f8fafc';
                        viewAll.innerHTML = `View all ${data.totalMatches} results <i class="bi bi-arrow-right ms-1"></i>`;
                        list.appendChild(viewAll);
                    }
                    container.appendChild(list);
                } else {
                    container.innerHTML = '<div class="p-4 text-center text-muted"><i class="bi bi-emoji-frown fs-4 d-block mb-2 text-secondary"></i><span style="font-size:0.85rem">No results found for "'+query+'"</span></div>';
                }
            }

            initGlobalSearch('globalDesktopSearch', 'globalDesktopResults');
            initGlobalSearch('globalMobileSearch', 'globalMobileResults');

        });
    </script>
