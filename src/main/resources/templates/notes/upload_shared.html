<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Shared Note - 4LAZIE</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-dark: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(16, 185, 129, 0.2);
            --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .upload-header {
            background: var(--bg-dark);
            padding: 2.5rem 0;
            color: white;
            border-bottom: 3px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .glass-card {
            background: white;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25);
        }

        .subject-checkbox-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #fff;
        }

        .subject-checkbox-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-upload {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
            color: white;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/responsive-system.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-spacing-standards.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark d-flex align-items-center" href="/">
                <i class="bi bi-layers text-success me-2 fs-4"></i>
                <span>4<span class="text-success">LAZIE</span></span>
            </a>
            <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="upload-header text-center">
        <div class="container">
            <h1 class="display-5 fw-bold font-outfit mb-2">Shared Courses <span class="text-success">Upload</span></h1>
            <p class="text-light opacity-75 mb-0">Upload a single document and share it across multiple courses/modules instantly.</p>
        </div>
    </div>

    <div class="container mt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/admin/upload-shared}" method="post" enctype="multipart/form-data" class="glass-card">
                    <h4 class="fw-bold mb-4 font-outfit"><i class="bi bi-cloud-arrow-up text-success me-2"></i> Upload Details</h4>
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Document Title</label>
                            <input type="text" name="title" class="form-control" required placeholder="e.g., Introduction to Communication Skills">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="Note">Note</option>
                                <option value="Past Paper">Past Paper</option>
                                <option value="Assignment">Assignment</option>
                                <option value="Summary">Summary</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Academic Year</label>
                            <input type="text" name="academicYear" class="form-control" required placeholder="e.g., 2024/2025">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label fw-semibold">Select File (PDF only)</label>
                        <input type="file" name="file" class="form-control" accept=".pdf" required>
                    </div>

                    <hr class="my-5">

                    <h4 class="fw-bold mb-2 font-outfit"><i class="bi bi-diagram-3 text-success me-2"></i> Select Target Courses/Modules</h4>
                    <p class="text-muted small mb-4">Select all the modules across different programs that should see this document.</p>

                    <div th:each="course : ${courses}" class="mb-4">
                        <h5 class="fw-bold text-success mb-3" th:text="${course.name}">Course Name</h5>
                        <div class="row">
                            <div class="col-md-6 col-lg-4 mb-3" th:each="sub : ${subjectsByCourseId.get(course.id)}">
                                <div class="subject-checkbox-card" th:onclick="'document.getElementById(\'check-' + ${sub.id} + '\').click();'">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="targetCourses" 
                                               th:value="${course.programType + '|' + sub.levelNo + '|' + sub.semesterNo + '|' + sub.name + '|' + (sub.code != null ? sub.code : '')}" 
                                               th:id="'check-' + ${sub.id}"
                                               onclick="event.stopPropagation();">
                                        <label class="form-check-label fw-medium ms-1 d-block" th:for="'check-' + ${sub.id}" onclick="event.stopPropagation();">
                                            <span class="text-dark" th:text="${sub.name}">Module Name</span>
                                            <div class="text-muted small mt-1">
                                                <span class="badge bg-success-subtle text-success border border-success" th:text="${(sub.levelNo != null and sub.levelNo >= 4 ? 'NTA Level ' + sub.levelNo : 'Year ' + sub.levelNo) + ' - Sem ' + sub.semesterNo}">L4 S1</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-end mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-upload px-5">
                            <i class="bi bi-rocket-takeoff me-2"></i> Upload and Distribute
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Application Footer -->
    <div style="margin-top: auto;">
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>

    <!-- Admin Sidebar Fragment (reused for mobile menu if needed) -->
    <div th:replace="~{fragments/admin_sidebar :: sidebar}"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
