<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recently Added Materials | 4LAZIE - Jifunze Kijanja</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/premium-theme.css">
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .header-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 60px 0 40px 0;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .header-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
            animation: pulse-glow 10s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(2%, 2%); }
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 2;
        }

        .page-subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        /* ═══ Apple-Style Green Note Cards ═══ */
        .dashboard-notes-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .apple-note-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.04) 0%, rgba(5, 150, 105, 0.02) 100%);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none !important;
            gap: 16px;
            
            /* Initial Animation State */
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .apple-note-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(52, 211, 153, 0.05));
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: inherit;
        }

        .apple-note-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.15), 0 5px 15px rgba(16, 185, 129, 0.08);
            background: #ffffff;
        }

        .apple-note-card:hover::before {
            opacity: 1;
        }

        .apple-note-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            font-size: 1.4rem;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 2;
        }

        .apple-note-card:hover .apple-note-icon {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .apple-note-info {
            flex-grow: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            z-index: 2;
        }

        .apple-note-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
            transition: color 0.3s ease;
        }
        
        .apple-note-card:hover .apple-note-title {
            color: #059669;
        }

        .apple-note-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .apple-note-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #059669;
            letter-spacing: 0.5px;
        }

        .apple-note-stat {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 600;
        }

        .apple-note-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            position: relative;
            z-index: 2;
        }

        .apple-btn-read {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white !important;
            border: none;
            border-radius: 100px;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .apple-btn-read:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
            background: linear-gradient(135deg, #059669, #047857);
        }

        .apple-btn-dl {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            color: #10b981 !important;
            border: 2px solid rgba(16, 185, 129, 0.25);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        .apple-btn-dl:hover {
            transform: scale(1.05);
            background: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }

        .apple-note-module {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: #111111;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }
        .back-btn:hover {
            color: #10b981;
        }

        @media (max-width: 768px) {
            .apple-note-card {
                padding: 12px;
                gap: 10px;
                flex-wrap: wrap;
            }
            .apple-note-icon {
                width: 40px;
                height: 40px;
                min-width: 40px;
                font-size: 1.1rem;
            }
            .apple-note-title {
                font-size: 0.95rem;
                white-space: normal;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .apple-note-meta {
                gap: 6px;
            }
            .apple-note-tag, .apple-note-module {
                padding: 2px 6px;
                font-size: 0.65rem;
            }
            .apple-note-stat {
                font-size: 0.65rem;
            }
            .apple-note-actions {
                width: 100%;
                margin-left: 0;
                justify-content: flex-end;
                padding-top: 8px;
                border-top: 1px solid rgba(0,0,0,0.03);
                margin-top: 0px;
            }
            .apple-btn-read, .apple-btn-dl {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            .page-title {
                font-size: 1.5rem;
            }
        }
    </style>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/responsive-system.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-spacing-standards.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="header-banner">
        <div class="container text-center">
            <h1 class="page-title"><i class="bi bi-clock-history text-success me-2"></i>Recently Added Materials</h1>
            <p class="page-subtitle mt-2">Catch up with the latest documents uploaded for your program.</p>
        </div>
    </div>

    <div class="container mb-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <a href="/dashboard" class="back-btn">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
                
                <div class="dashboard-notes-list">
                    <div th:each="note, iterStat : ${notesPage.content}" class="apple-note-card" th:style="'animation-delay: ' + (${iterStat.index} * 0.1) + 's;'">
                        <div class="apple-note-icon">
                            <i th:class="${note.filename != null and note.filename.endsWith('.pdf')} ? 'bi bi-file-earmark-pdf-fill' : 'bi bi-file-earmark-word-fill'"></i>
                        </div>
                        <div class="apple-note-info">
                            <div class="apple-note-title" th:text="${note.title}">Module Title Here</div>
                            <div class="apple-note-meta">
                                <span th:if="${note.category != null && note.category != 'Note'}"
                                    class="apple-note-tag"
                                    style="background: rgba(239,68,68,0.08); color: #ef4444; border-color: rgba(239,68,68,0.15);"><i
                                        class="bi bi-tag-fill"></i> <span
                                        th:text="${note.category}">CAT 1</span></span>
                                <span th:if="${note.academicYear != null && note.academicYear != ''}" class="apple-note-tag"
                                    style="background: rgba(15, 23, 42, 0.05); color: #334155; border-color: rgba(15, 23, 42, 0.1);"><i
                                        class="bi bi-calendar-event-fill"></i> <span
                                        th:text="${note.academicYear}">2024</span></span>
                                <span th:if="${note.programType != null && note.programType.startsWith('DEG')}"
                                    class="apple-note-tag"
                                    style="background: rgba(139,92,246,0.08); color: #7c3aed; border-color: rgba(139,92,246,0.15);"><i
                                        class="bi bi-mortarboard-fill"></i> YEAR <span
                                        th:text="${note.levelNo}">1</span></span>
                                <span th:if="${note.programType == null || !note.programType.startsWith('DEG')}"
                                    class="apple-note-tag"><i class="bi bi-mortarboard-fill"></i> NTA <span
                                        th:text="${note.levelNo}">4</span></span>
                                <span th:if="${note.semesterNo != null}" class="apple-note-tag"
                                    style="background: rgba(59,130,246,0.08); color: #2563eb; border-color: rgba(59,130,246,0.15);"><i
                                        class="bi bi-calendar2-week-fill"></i> S<span
                                        th:text="${note.semesterNo}">1</span></span>
                                <span th:if="${note.moduleName != null && !note.moduleName.isEmpty()}"
                                    class="apple-note-module" th:title="${note.moduleName}"><i
                                        class="bi bi-book-fill"></i> <span
                                        th:text="${note.moduleName}">Module</span></span>
                                <span class="apple-note-stat"><i class="bi bi-eye-fill"></i> <span
                                        th:text="${note.viewCount != null ? note.viewCount : 0}">0</span></span>
                                <span class="apple-note-stat"><i class="bi bi-cloud-arrow-down-fill"></i> <span
                                        th:text="${note.downloadCount != null ? note.downloadCount : 0}">0</span></span>
                            </div>
                        </div>
                        <div class="apple-note-actions">
                            <a th:href="@{'/view/' + ${note.encryptedSlug}}" class="apple-btn-read">
                                <i class="bi bi-eye"></i> READ
                            </a>
                            <a th:href="@{'/download/' + ${note.encryptedSlug}}" class="apple-btn-dl">
                                <i class="bi bi-cloud-arrow-down"></i> DOWNLOAD
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${notesPage.totalPages > 1}" class="d-flex justify-content-center mt-5">
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-sm shadow-sm rounded-pill overflow-hidden" style="border: 1px solid rgba(16,185,129,0.2);">
                            <li class="page-item" th:classappend="${notesPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/recent-materials(page=${notesPage.number - 1})}" tabindex="-1" style="color:#10b981; border:none; padding: 10px 16px;">
                                    <i class="bi bi-chevron-left"></i> Prev
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, notesPage.totalPages - 1)}" 
                                th:classappend="${i == notesPage.number} ? 'active'">
                                <a class="page-link fw-bold" th:href="@{/recent-materials(page=${i})}" th:text="${i + 1}"
                                   th:style="${i == notesPage.number} ? 'background: linear-gradient(135deg, #10b981, #059669); border:none; color:white;' : 'color:#475569; border:none;'">1</a>
                            </li>
                            <li class="page-item" th:classappend="${notesPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/recent-materials(page=${notesPage.number + 1})}" style="color:#10b981; border:none; padding: 10px 16px;">
                                    Next <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>

            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/bottom_nav :: nav('home')}"></div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
