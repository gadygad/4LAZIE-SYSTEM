<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - 4LAZIE'">My Notes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-premium.css?v=5}">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.05), transparent 400px),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.05), transparent 400px);
        }
        .header-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(5, 150, 105, 0.95));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 3rem 1.5rem;
            border-radius: 0 0 2.5rem 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .note-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 1.2rem;
            border: 1px solid rgba(16, 185, 129, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,0.03);
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .note-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #10b981, #34d399);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .note-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(255, 255, 255, 0.9);
        }
        .note-card:hover::before {
            opacity: 1;
        }
        
        /* Mobile Optimizations */
        @media (max-width: 576px) {
            .header-card {
                padding: 2rem 1rem;
                border-radius: 0 0 1.5rem 1.5rem;
            }
            .header-card h1 {
                font-size: 1.8rem;
            }
            .note-card {
                padding: 1.5rem !important;
            }
            .note-card h5 {
                font-size: 1rem !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <!-- SEO and Developer Identity (JSON-LD Schema) -->
    <meta name="author" content="Godfrey Charles Nyagwisi">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "4LAZIE Student Community Forum",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Access thousands of premium student notes, past papers, and timetables for free.",
      "creator": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi",
        "jobTitle": "Founder & Developer",
        "url": "https://github.com/GodfreyNyagwisi"
      },
      "author": {
        "@type": "Person",
        "name": "Godfrey Charles Nyagwisi"
      },
      "dateCreated": "2026-06-01",
      "publisher": {
        "@type": "Organization",
        "name": "4LAZIE Student Community Forum",
        "founder": {
          "@type": "Person",
          "name": "Godfrey Charles Nyagwisi"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Who is the founder of 4LAZIE Student Community Forum and in what year?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Godfrey Charles Nyagwisi is the founder and developer of 4LAZIE Student Community Forum, established in June 2026."
        }
      }]
    }
    </script>
</head>
<body class="has-bottom-nav">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Mobile Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar_fragments :: mobile_sidebar}"></div>

    <!-- Header -->
    <div class="header-card text-center">
        <i class="bi fs-1 mb-2" th:classappend="${pageIcon}" style="color: #10b981;"></i>
        <h1 class="fw-bold mb-0" th:text="${pageTitle}">My Notes</h1>
        <p class="text-white-50 mt-2" th:text="'You have ' + ${notes.size()} + ' notes here.'">0 notes</p>
    </div>

    <!-- Notes Container -->
    <div class="container mb-5 pb-5">
        <div th:if="${notes.empty}" class="text-center py-5">
            <i class="bi bi-folder-x fs-1 text-muted mb-3 d-block"></i>
            <h5 class="fw-bold text-dark">No Notes Found</h5>
            <p class="text-muted">It looks like this list is empty. Go explore some notes!</p>
            <a href="/dashboard" class="btn btn-success rounded-pill px-4 py-2 fw-bold mt-2" style="background: #10b981; border: none;">Browse Notes</a>
        </div>

        <div class="row g-4" th:if="${!notes.empty}">
            <div class="col-12 col-md-6 col-lg-4" th:each="note : ${notes}">
                <div class="note-card p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(16,185,129,0.1); display:flex; align-items:center; justify-content:center; color:#10b981;">
                                <i class="bi bi-file-earmark-pdf-fill fs-5"></i>
                            </div>
                            <div>
                                <span class="badge bg-light text-dark border fw-bold" th:text="${note.programType}">Prog</span>
                                <small class="text-muted d-block mt-1" style="font-size:0.75rem;" th:text="${#temporals.format(note.uploadDate, 'dd MMM yyyy')}">Date</small>
                            </div>
                        </div>
                        <button class="btn btn-sm text-danger" th:onclick="'toggleSaveNote(this, \'' + ${note.id} + '\')'" style="background: rgba(239, 68, 68, 0.1); border-radius: 8px; padding: 4px 8px; transition: all 0.2s;" onmouseover="this.style.background='rgba(239, 68, 68, 0.2)'" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'" title="Remove from Saved">
                            <i class="bi bi-bookmark-x-fill"></i>
                        </button>
                    </div>
                    
                    <h5 class="fw-bold mb-2" style="color: #1e293b; font-size: 1.1rem; line-height: 1.4;" th:text="${note.title}">Note Title</h5>
                    <p class="text-muted mb-3" style="font-size: 0.85rem;" th:text="${note.moduleName}">Module Name</p>
                    
                    <div class="mt-auto pt-3 border-top">
                        <a th:href="@{'/view/' + ${note.encryptedSlug}}" class="btn w-100 rounded-pill fw-bold text-white" style="background: linear-gradient(135deg, #10b981, #059669); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='none'">
                            View Document
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Mobile Bottom Navigation -->
    <div th:replace="~{fragments/bottom_nav :: nav('notes')}"></div>


    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

    <script>
        function toggleSaveNote(btn, noteId) {
            fetch('/save-note/' + noteId, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    // It was successfully toggled.
                    // Since this is the "Saved Notes" page, clicking it should remove it from the view.
                    const card = btn.closest('.col-12');
                    card.style.transition = 'all 0.4s ease';
                    card.style.transform = 'scale(0.9)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        card.remove();
                        // Check if grid is empty
                        const remaining = document.querySelectorAll('.note-card');
                        if(remaining.length === 0) {
                            window.location.reload(); // Reload to show empty state
                        }
                    }, 400);
                } else {
                    if(data.message === 'Not logged in') {
                        window.location.href = '/login';
                    }
                }
            })
            .catch(err => console.error(err));
        }
    </script>
    <div th:replace="~{fragments/search_script :: script}"></div>
</body>
</html>
