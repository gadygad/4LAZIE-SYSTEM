<body class="has-bottom-nav">

                            </div>
                            <span class="fs-4 fw-bold" style="font-family: 'Outfit', sans-serif; color: #1e293b; letter-spacing: -0.5px;">4LAZIE <span class="d-none d-sm-inline" style="color: #10b981;">NOTES</span></span>

                    </div>

                                <div th:replace="~{fragments/top_actions :: actions}"></div>
                </div>
            </div>

        </nav>

    <!-- PAGE LAYOUT CONTAINER -->
    <div class="page-layout">
        
        <!-- Sidebar removed, using offcanvas now -->

        <!-- MAIN CONTENT AREA -->
        <div class="main-content">
            
            <!-- Animated Background Blobs -->
            <div style="position: absolute; top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(16,185,129,0) 70%); border-radius: 50%; filter: blur(40px); animation: float 10s ease-in-out infinite;"></div>
            <div style="position: absolute; bottom: -50px; right: -50px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, rgba(59,130,246,0) 70%); border-radius: 50%; filter: blur(40px); animation: float 8s ease-in-out infinite reverse;"></div>
            <div style="position: absolute; top: 40%; right: 20%; width: 250px; height: 250px; background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, rgba(245,158,11,0) 70%); border-radius: 50%; filter: blur(30px); animation: float 12s ease-in-out infinite 2s;"></div>
            <style>
                @keyframes float {
                    0% { transform: translate(0, 0) rotate(0deg); }
                    33% { transform: translate(30px, -50px) rotate(10deg); }
                    66% { transform: translate(-20px, 20px) rotate(-5deg); }
                    100% { transform: translate(0, 0) rotate(0deg); }
                }
            </style>

            <!-- CENTER COLUMN (DASHBOARD OVERVIEW) -->
            <div class="center-col position-relative z-1" style="padding: 20px; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; width: 100%;">
                

                <!-- CUSTOM CSS FOR GLASSMORPHISM & ANIMATIONS -->
                <style>
                    .glass-stat-card {
                        background: rgba(255, 255, 255, 0.7);
                        backdrop-filter: blur(16px);
                        -webkit-backdrop-filter: blur(16px);
                        border: 1px solid rgba(255, 255, 255, 0.8);
                        border-radius: 16px;
                        box-shadow: 0 4px 24px rgba(16, 185, 129, 0.08);
                        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                        position: relative;
                        overflow: hidden;
                        cursor: pointer;
                    }
                    .glass-stat-card:hover {
                        transform: translateY(-8px) scale(1.02);
                        box-shadow: 0 15px 35px rgba(16, 185, 129, 0.2);
                        background: rgba(255, 255, 255, 0.9);
                        border-color: rgba(16, 185, 129, 0.3);
                    }
                    .glass-stat-card:active {
                        transform: translateY(-2px) scale(0.98);
                    }
                    .glass-stat-card::before {
                        content: '';
                        position: absolute;
                        top: 0; left: 0;
                        width: 100%; height: 100%;
                        background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
                        z-index: 0;
                    }
                    .glass-stat-card > * {
                        position: relative;
                        z-index: 1;
                    }
                    .icon-container-premium {
                        width: 55px; height: 55px; 
                        border-radius: 16px; 
                        display: flex; align-items: center; justify-content: center; 
                        background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
                        box-shadow: inset 0 2px 4px rgba(255,255,255,0.8);
                        color: #10b981;
                        transition: all 0.3s ease;
                    }
                    .glass-stat-card:hover .icon-container-premium {
                        background: linear-gradient(135deg, #10b981, #059669);
                        color: #fff;
                        transform: rotate(5deg) scale(1.1);
                        box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
                    }
                    
                    /* Table Glass Styling */
                    .glass-table-container {
                        background: rgba(255, 255, 255, 0.6);
                        backdrop-filter: blur(12px);
                        -webkit-backdrop-filter: blur(12px);
                        border: 1px solid rgba(255, 255, 255, 0.6);
                        border-radius: 16px;
                        padding: 1.25rem;
                        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
                        transition: transform 0.3s ease;
                    }
                    .glass-table-container:hover {
                        transform: translateY(-4px);
                        box-shadow: 0 12px 40px rgba(16, 185, 129, 0.1);
                    }
                    .premium-table {
                        border-collapse: separate;
                        border-spacing: 0 8px;
                    }
                    .premium-table th {
                        border-bottom: none;
                        text-transform: uppercase;
                        font-size: 0.75rem;
                        letter-spacing: 1px;
                        color: #64748b;
                        padding-bottom: 10px;
                    }
                    .premium-table td {
                        background: rgba(255,255,255,0.8);
                        border: none;
                        padding: 12px 15px;
                        transition: all 0.2s ease;
                    }
                    .premium-table tr:hover td {
                        background: #fff;
                        box-shadow: 0 2px 10px rgba(16,185,129,0.08);
                    }
                    .premium-table td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
                    .premium-table td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
                </style>






                <!-- WELCOME HERO SECTION -->
                <div class="welcome-hero mb-4 position-relative" style="padding: 1rem 0; margin-top: 1rem;">
                    <style>
                        .welcome-hero-content {
                            display: flex;
                            flex-direction: column;
                            gap: 0.5rem;
                        }
                        .welcome-subtitle {
                            font-family: 'Inter', sans-serif;
                            font-size: 0.8rem;
                            font-weight: 700;
                            letter-spacing: 3px;
                            color: #666666;
                            text-transform: uppercase;
                            transition: all 0.4s ease;
                            cursor: default;
                        }
                        .welcome-subtitle:hover {
                            color: #000000;
                            letter-spacing: 5px;
                        }
                        .welcome-name {
                            font-family: 'Outfit', sans-serif;
                            font-size: clamp(1.8rem, 4vw, 2.5rem);
                            font-weight: 900;
                            color: #000000;
                            line-height: 1.1;
                            letter-spacing: -2px;
                            margin: 0;
                            transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
                            cursor: default;
                        }
                        .welcome-name:hover {
                            transform: translateY(-2px) scale(1.01);
                            text-shadow: 0 15px 35px rgba(0,0,0,0.1);
                        }
                        .welcome-course {
                            font-family: 'Outfit', sans-serif;
                            font-size: clamp(1.1rem, 3vw, 1.4rem);
                            font-weight: 800;
                            color: #333333;
                            text-transform: uppercase;
                            white-space: nowrap;
                            overflow: hidden;
                            text-overflow: ellipsis;
                            max-width: 100%;
                            transition: all 0.4s ease;
                            letter-spacing: 1px;
                            cursor: default;
                        }
                        .welcome-course:hover {
                            color: #000000;
                            padding-left: 8px;
                        }
                        .welcome-meta {
                            font-family: 'Inter', sans-serif;
                            font-size: 0.95rem;
                            font-weight: 600;
                            color: #666666;
                            display: flex;
                            align-items: center;
                            gap: 15px;
                            transition: all 0.4s ease;
                            margin-top: 5px;
                            letter-spacing: 1px;
                            cursor: default;
                        }
                        .welcome-meta:hover {
                            color: #000000;
                        }
                        .meta-dot {
                            color: #cccccc;
                            font-size: 1.5rem;
                            line-height: 0;
                        }
                        @media (max-width: 768px) {
                            .welcome-hero { padding: 1.75rem !important; }
                        }
                    </style>

                    <div class="row align-items-center position-relative z-1">
                        <div class="col-12">
                            <div class="welcome-hero-content">
                                <div class="welcome-subtitle">WELCOME BACK</div>
                                <h1 class="welcome-name" th:text="${session.user != null ? session.user.name : 'Student'}">Dr. Alex Carter</h1>
                                <div class="welcome-course" th:text="${session.user != null and session.user.courseProgram != null ? session.user.courseProgram : 'GENERAL PROGRAM'}">DIPLOMA IN INFORMATION TECHNOLOGY</div>
                                <div class="welcome-meta">
                                    <span>SEMESTER <span th:text="${session.user != null and session.user.semester != null ? session.user.semester : '1'}">2</span></span>
                                    <span class="meta-dot">&bull;</span>
                                    <span th:text="${session.user != null and session.user.courseProgram != null and (session.user.courseProgram.toUpperCase().contains('DEG') or session.user.courseProgram.toUpperCase().contains('BSC') or session.user.courseProgram.toUpperCase().contains('MD')) ? 'DEGREE' : 'DIPLOMA'}">DIPLOMA</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PREMIUM FEATURES (Moved from right column) -->
                <div th:replace="~{fragments/sjuit_components :: premium_sidebar}"></div>

                <!-- Side-by-Side Recent & Popular Notes Section (Premium Compact Grid) -->
                <style>
                    .dashboard-notes-list {
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    }
                    .glassmorphism-card {
                        background: rgba(255, 255, 255, 0.65);
                        backdrop-filter: blur(20px);
                        -webkit-backdrop-filter: blur(20px);
                        border: 1px solid rgba(255, 255, 255, 0.85);
                        border-radius: 14px;
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.015);
                        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
                        position: relative;
                        padding: 10px 14px !important;
                        cursor: pointer;
                    }
                    .glassmorphism-card::before {
                        content: '';
                        position: absolute;
                        left: 0; top: 15%; height: 70%; width: 4px;
                        border-radius: 0 4px 4px 0;
                        opacity: 0;
                        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                    }
                    .glassmorphism-card:hover::before {
                        opacity: 1;
                        height: 100%;
                        top: 0;
                    }
                    .recent-card::before {
                        background: #10b981;
                    }
                    .popular-card::before {
                        background: #ef4444;
                    }
                    .glassmorphism-card:hover {
                        background: rgba(255, 255, 255, 0.96);
                        border-color: rgba(16, 185, 129, 0.25);
                        transform: translateY(-3px) scale(1.002);
                        box-shadow: 0 10px 22px rgba(16, 185, 129, 0.08);
                        z-index: 2;
                    }
                    .glassmorphism-card.popular-card:hover {
                        border-color: rgba(239, 68, 68, 0.25);
                        box-shadow: 0 10px 22px rgba(239, 68, 68, 0.08);
                    }
                    .glassmorphism-card .note-card-title {
                        font-family: 'Outfit', sans-serif;
                        font-size: 0.85rem !important;
                        font-weight: 700;
                        color: #0f172a;
                        line-height: 1.35;
                        display: -webkit-box;
                        -webkit-line-clamp: 2;
                        -webkit-box-orient: vertical;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        white-space: normal;
                        transition: color 0.3s ease;
                    }
                    .recent-card:hover .note-card-title {
                        color: #10b981;
                    }
                    .popular-card:hover .note-card-title {
                        color: #ef4444;
                    }
                    .glassmorphism-card .icon-box {
                        width: 40px !important;
                        height: 40px !important;
                        min-width: 40px !important;
                        font-size: 1.2rem !important;
                        border-radius: 10px !important;
                        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
                        border: 1px solid transparent;
                    }
                    .recent-card:hover .icon-box {
                        background: linear-gradient(135deg, #10b981, #059669) !important;
                        color: white !important;
                        transform: scale(1.08) rotate(3deg);
                        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
                        border-color: transparent;
                    }
                    .popular-card:hover .icon-box {
                        background: linear-gradient(135deg, #ef4444, #dc2626) !important;
                        color: white !important;
                        transform: scale(1.08) rotate(3deg);
                        box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
                        border-color: transparent;
                    }
                    .glass-badge-nta {
                        background: rgba(16, 185, 129, 0.05);
                        color: #059669;
                        padding: 3px 8px !important;
                        border-radius: 6px !important;
                        border: 1px solid rgba(16, 185, 129, 0.1);
                        font-weight: 700;
                        font-size: 0.65rem !important;
                        display: inline-flex;
                        align-items: center;
                        gap: 4px;
                    }
                    .glass-badge-sem {
                        background: rgba(59, 130, 246, 0.05);
                        color: #2563eb;
                        padding: 3px 8px !important;
                        border-radius: 6px !important;
                        border: 1px solid rgba(59, 130, 246, 0.1);
                        font-weight: 700;
                        font-size: 0.65rem !important;
                        display: inline-flex;
                        align-items: center;
                        gap: 4px;
                    }
                    
                    /* Clean Button Actions */
                    .btn-read-glass {
                        background: rgba(239, 68, 68, 0.1);
                        color: #ef4444;
                        border: 1px solid rgba(239, 68, 68, 0.2);
                        border-radius: 20px;
                        padding: 5px 12px;
                        font-size: 0.72rem;
                        font-weight: 700;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        transition: all 0.3s ease;
                        gap: 4px;
                        box-shadow: inset 0 0 5px rgba(239, 68, 68, 0.05);
                    }
                    .btn-read-glass:hover {
                        background: #ef4444;
                        color: white !important;
                        border-color: transparent;
                        transform: translateY(-1px);
                        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
                    }
                    
                    .btn-download-icon {
                        width: 28px;
                        height: 28px;
                        border-radius: 50%;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        background: rgba(239, 68, 68, 0.08);
                        color: #ef4444;
                        border: 1px solid rgba(239, 68, 68, 0.2);
                        font-size: 0.85rem;
                        transition: all 0.3s ease;
                        text-decoration: none;
                        box-shadow: inset 0 0 5px rgba(239, 68, 68, 0.05);
                    }
                    .btn-download-icon:hover {
                        background: rgba(239, 68, 68, 0.15);
                        color: #dc2626 !important;
                        border-color: rgba(239, 68, 68, 0.3);
                        transform: scale(1.05);
                        box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);
                    }

                    
                    /* Responsive adjustments for mobile */
                    @media (max-width: 576px) {
                        .glassmorphism-card {
                            flex-direction: column;
                            align-items: flex-start !important;
                            gap: 0.75rem !important;
                        }
                        .glassmorphism-card .right-actions {
                            width: 100%;
                            justify-content: space-between;
                        }
                    }
                </style>

                <div class="row g-4 mb-4">
                    <!-- Recently Added (Left Column) -->
                    <div class="col-lg-6 col-12">
                        <div class="d-flex justify-content-between align-items-end mb-3 px-1">
                            <h6 class="fw-bold mb-0 text-dark text-uppercase section-header-premium" style="font-family: 'Outfit', sans-serif; letter-spacing: 1px; border-bottom: 2px solid #10b981; font-size: 0.85rem;"><i class="bi bi-clock-history text-primary me-2"></i>Recently Added</h6>
                        </div>
                        
                        <div class="dashboard-notes-list">
                            <div th:each="note : ${recentNotes}" th:data-slug="${note.encryptedSlug}" class="glassmorphism-card recent-card click-to-view d-flex align-items-center justify-content-between gap-3">
                                <!-- Left Side: Icon & Title -->
                                <div class="d-flex align-items-center gap-3 w-100" style="min-width: 0;">
                                    <div class="icon-box flex-shrink-0 d-flex align-items-center justify-content-center shadow-sm" style="background: rgba(16, 185, 129, 0.08); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.15);">
                                        <i th:class="${note.filename != null and note.filename.endsWith('.pdf')} ? 'bi bi-file-earmark-pdf-fill' : 'bi bi-file-earmark-word-fill'"></i>
                                    </div>
                                    <div class="d-flex flex-column w-100" style="min-width: 0;">
                                        <div class="note-card-title th-title-truncate mb-1" th:text="${note.title}">TITLE</div>
                                        <div class="d-flex flex-wrap align-items-center" style="color: #64748b; gap: 8px; text-transform: uppercase;">
                                            <span class="glass-badge-nta"><i class="bi bi-mortarboard-fill"></i> NTA <span th:text="${note.levelNo}"></span></span>
                                            <span th:if="${note.semesterNo != null}" class="glass-badge-sem"><i class="bi bi-calendar2-week-fill"></i> S<span th:text="${note.semesterNo}"></span></span>
                                            <span class="d-md-none badge bg-primary bg-opacity-10 text-primary px-2 py-1 rounded-pill" style="font-size: 0.65rem;"><i class="bi bi-eye-fill me-1"></i><span th:text="${note.viewCount != null ? note.viewCount : 0}"></span></span>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Right Side: Stats & Buttons -->
                                <div class="right-actions d-flex align-items-center gap-2 flex-shrink-0" onclick="event.stopPropagation();">
                                    <div class="d-none d-md-flex align-items-center gap-1">
                                        <span class="badge bg-primary bg-opacity-10 text-primary px-2 py-1 rounded-pill d-flex align-items-center" style="font-size: 0.65rem;"><i class="bi bi-eye-fill me-1"></i><span th:text="${note.viewCount != null ? note.viewCount : 0}"></span></span>
                                        <span class="badge bg-success bg-opacity-10 text-success px-2 py-1 rounded-pill d-flex align-items-center" style="font-size: 0.65rem;"><i class="bi bi-cloud-arrow-down-fill me-1"></i><span th:text="${note.downloadCount != null ? note.downloadCount : 0}"></span></span>
                                    </div>
                                    <div class="d-flex gap-1.5 align-items-center">
                                        <a th:href="@{'/view/' + ${note.encryptedSlug}}" class="btn-read-glass" title="Soma">
                                            Soma <i class="bi bi-arrow-right-short"></i>
                                        </a>
                                        <a th:href="@{'/download/' + ${note.encryptedSlug}}" class="btn-download-icon" title="Download">
                                            <i class="bi bi-cloud-arrow-down"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            
                            <div th:if="${#lists.isEmpty(recentNotes)}" class="w-100 text-center py-4 rounded-4" style="background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border: 1px dashed rgba(16, 185, 129, 0.4);">
                                <p class="text-muted mb-0 fw-medium" style="font-size: 0.85rem;">No recent materials found.</p>

    <!-- Smart Search Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // ====== FAST SEARCH FUNCTIONALITY ======
            function initSearch(inputId, resultsId) {
                const input = document.getElementById(inputId);
                const results = document.getElementById(resultsId);
                if (!input || !results) return;
                let timeout = null;
                let cache = {};

                input.addEventListener('input', function(e) {
                    clearTimeout(timeout);
                    const query = e.target.value.trim();
                    if (query.length < 2) { results.classList.add('d-none'); return; }

                    if (cache[query]) {
                        renderResults(cache[query], query, results);
                        return;
                    }

                    results.classList.remove('d-none');
                    results.innerHTML = '<div class="p-3 text-center text-muted"><div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>Searching...</div>';

                    timeout = setTimeout(() => {
                        fetch(`/api/search?q=${encodeURIComponent(query)}`)
                            .then(r => r.json())
                            .then(data => {
                                cache[query] = data;
                                renderResults(data, query, results);
                            })
                            .catch(() => {
                                results.innerHTML = '<div class="p-3 text-center text-danger" style="font-size:0.85rem"><i class="bi bi-exclamation-circle me-1"></i>Error loading results</div>';
                            });
                    }, 200);
                });
            }

            function renderResults(data, query, container) {
                container.innerHTML = '';
                container.classList.remove('d-none');
                if (data.results && data.results.length > 0) {
                    const list = document.createElement('div');
                    list.className = 'list-group list-group-flush';
                    data.results.forEach(note => {
                        const a = document.createElement('a');
                        a.href = `/view/${note.id}`;
                        a.className = 'list-group-item list-group-item-action d-flex align-items-center p-3 border-0';
                        a.style.transition = 'background 0.15s';
                        let icon = 'bi-file-earmark-text', iconColor = '#10b981', bg = 'rgba(16,185,129,0.1)';
                        if (note.category === 'Past Paper') { icon = 'bi-file-earmark-pdf'; iconColor = '#ef4444'; bg = 'rgba(239,68,68,0.1)'; }
                        else if (note.category === 'Assignment') { icon = 'bi-journal-check'; iconColor = '#3b82f6'; bg = 'rgba(59,130,246,0.1)'; }
                        a.innerHTML = `
                            <div class="me-3 d-flex align-items-center justify-content-center rounded-3" style="width:36px;height:36px;background:${bg};flex-shrink:0">
                                <i class="bi ${icon}" style="color:${iconColor};font-size:1rem"></i>
                            </div>
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="fw-bold text-truncate" style="font-size:0.85rem;color:#1e293b">${note.title}</div>
                                <small class="text-muted" style="font-size:0.7rem;font-weight:500">Level ${note.levelNo || ''} • ${note.category || 'Note'}</small>
                            </div>
                            <i class="bi bi-chevron-right text-muted" style="font-size:0.75rem"></i>`;
                        list.appendChild(a);
                    });
                    container.appendChild(list);
                } else {
                    container.innerHTML = '<div class="p-4 text-center text-muted"><i class="bi bi-emoji-frown fs-4 d-block mb-2 text-secondary"></i><span style="font-size:0.85rem">No results for "'+query+'"</span></div>';
                }
            }

            // Card click redirection
            document.querySelectorAll('.glassmorphism-card.click-to-view').forEach(card => {
                card.addEventListener('click', function() {
                    const slug = this.getAttribute('data-slug');
                    if (slug) {
                        window.location.href = '/view/' + slug;
                    }
                });
            });

            // Initialize search (ensure IDs match what is in fragments/sjuit_components.html for the header)
            initSearch('smartSearchInput', 'desktopSearchResults');
            initSearch('mobileSmartSearchInput', 'mobileSearchResults');
        });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
