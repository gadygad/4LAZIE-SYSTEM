<!DOCTYPE html>

    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Magical Header */
        .page-header {
            background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
            color: white;
            padding: 4rem 0 3rem;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            margin-bottom: -40px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: -1;
        }
        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Notification Cards */
        .noti-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            
            /* CSS Animation instead of JS */
            opacity: 0;
            animation: slideUpFade 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            position: relative;
            overflow: hidden;
        }
        
        /* Stagger the animations for up to 10 cards */
        .noti-card:nth-child(1) { animation-delay: 0.1s; }
        .noti-card:nth-child(2) { animation-delay: 0.2s; }
        .noti-card:nth-child(3) { animation-delay: 0.3s; }
        .noti-card:nth-child(4) { animation-delay: 0.4s; }
        .noti-card:nth-child(5) { animation-delay: 0.5s; }
        .noti-card:nth-child(6) { animation-delay: 0.6s; }
        .noti-card:nth-child(7) { animation-delay: 0.7s; }
        .noti-card:nth-child(8) { animation-delay: 0.8s; }
        .noti-card:nth-child(9) { animation-delay: 0.9s; }
        .noti-card:nth-child(10) { animation-delay: 1.0s; }
        .noti-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            transition: all 0.6s ease;
        }
        .noti-card:hover {
            transform: translateY(-5px) scale(1.02) !important;
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(255, 255, 255, 0.95);
        }
        .noti-card:hover::after {
            left: 200%;
        }
        .noti-card.unread {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(255, 255, 255, 0.8) 100%);
            border-left: 5px solid #10b981;
        }
        .noti-card.unread:hover {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(255, 255, 255, 0.95) 100%);
        }

        /* Animated Icons */
        .noti-icon {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .noti-card:hover .noti-icon {
            transform: scale(1.15) rotate(8deg);
        }
        .noti-icon.info { background: rgba(59, 130, 246, 0.1); color: #3b82f6; box-shadow: 0 4px 15px rgba(59,130,246,0.2); }
        .noti-icon.success { background: rgba(16, 185, 129, 0.1); color: #10b981; box-shadow: 0 4px 15px rgba(16,185,129,0.2); }
        .noti-icon.warning { background: rgba(245, 158, 11, 0.1); color: #f59e0b; box-shadow: 0 4px 15px rgba(245,158,11,0.2); }
        .noti-icon.danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; box-shadow: 0 4px 15px rgba(239,68,68,0.2); }
        
        .noti-title-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            color: #0f172a !important; /* Force dark text for readability */
            transition: color 0.3s ease;
        }
        .noti-card:hover .noti-title-text {
            color: #10b981 !important;
        }
        
        .noti-desc-text {
            font-size: 0.95rem; 
            line-height: 1.5;
            color: #475569 !important; /* Dark slate for description */
        }
        
        .noti-time-text {
            color: #64748b !important;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
    <!-- Navbars & Sidebar (Outside of main flow) -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sjuit_components :: secondary_nav}"></div>
    <div th:replace="~{fragments/sidebar_fragments :: mobile_sidebar}"></div>
    <div th:replace="~{fragments/sjuit_components :: calendar_modals}"></div>

    <div class="main-content" style="padding-top: 10px;">

            <div class="page-header shadow-sm">
                <div class="container text-center position-relative z-1">
                    <h2 class="fw-bold mb-2" style="font-family: 'Outfit', sans-serif; letter-spacing: -0.5px;"><i class="bi bi-bell me-2"></i> All Notifications</h2>
                    <p class="mb-0" style="opacity: 0.9;">View your recent updates and activity</p>
                </div>
            </div>

            <div class="container" style="max-width: 800px; padding-top: 60px; padding-bottom: 80px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold text-dark mb-0">Your Activity</h5>
                    <button class="btn btn-sm btn-outline-success rounded-pill" onclick="markAllRead()" th:if="${unreadNotificationCount > 0}">
                        <i class="bi bi-check-all"></i> Mark all as read
                    </button>
                </div>

                <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                    <div class="mb-3">
                        <i class="bi bi-bell-slash text-muted" style="font-size: 3rem; opacity: 0.5;"></i>
                    </div>
                    <h5 class="fw-bold text-dark">No Notifications Yet</h5>
                    <p class="text-muted">You're all caught up! Check back later for updates.</p>
                </div>

                <div th:if="${not #lists.isEmpty(notifications)}">
                    <a th:each="noti : ${notifications}" th:href="@{'/api/notifications/click/' + ${noti.id}}" class="noti-card" th:classappend="${!noti.read} ? 'unread' : ''">
                        <div class="noti-icon" th:classappend="${#strings.containsIgnoreCase(noti.title, 'Download') ? 'success' : (#strings.containsIgnoreCase(noti.title, 'Upload') ? 'info' : 'warning')}">
                            <i th:class="${#strings.containsIgnoreCase(noti.title, 'Download') ? 'bi bi-download' : (#strings.containsIgnoreCase(noti.title, 'Upload') ? 'bi bi-upload' : 'bi bi-bell-fill')}"></i>
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h6 class="fw-bold mb-0 noti-title-text" th:text="${noti.title}">Notification Title</h6>
                                <small class="noti-time-text" th:text="${#temporals.format(noti.createdAt, 'dd MMM, HH:mm')}">Just now</small>
                            </div>
                            <p class="mb-0 noti-desc-text" th:text="${noti.message}">Notification message content goes here.</p>
                        </div>
                        <div th:if="${!noti.read}" class="align-self-center ms-2">
                            <span class="badge bg-success rounded-pill" style="width: 10px; height: 10px; padding: 0;">&nbsp;</span>
                        </div>
                    </a>
                </div>
            </div>

            <div th:replace="~{fragments/bottom_nav :: nav('notifications')}"></div>
        </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        function markAllRead() {
            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
            fetch('/api/notifications/mark-read', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                }
            }).then(response => {
                if(response.ok) {
                    window.location.reload();
                }
            });
        }
    </script>

<!-- Sidebar Global Push Effect -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebars = document.querySelectorAll('.offcanvas');
    sidebars.forEach(function(sidebar) {
        sidebar.addEventListener('show.bs.offcanvas', function () {
            document.body.classList.add('sidebar-is-open');
        });
        sidebar.addEventListener('hide.bs.offcanvas', function () {
            document.body.classList.remove('sidebar-is-open');
        });
    });
});
</script>

</body>
</html>
