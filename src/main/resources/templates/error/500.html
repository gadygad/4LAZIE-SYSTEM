<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/images/logo.png">

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/images/logo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error - 4LAZIE Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/global-premium.css}">
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
</head>
    <style>
        body {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: #10b981;
            top: -100px;
            left: -100px;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: #059669;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(50px) scale(1.1); }
        }
        .error-container {
            position: relative;
            z-index: 1;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }
        .glass-card {
            background: rgba(16, 185, 129, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .glass-card i {
            color: #34d399; /* Light green icon */
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.5);
        }
        .glass-card h1 {
            font-size: 5rem;
            background: linear-gradient(to right, #6ee7b7, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
            line-height: 1.1;
        }
        .glass-card h3 {
            color: #f8fafc;
            font-weight: 600;
            margin-top: 1rem;
        }
        .glass-card p {
            color: #a7f3d0;
            font-size: 1.1rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        .btn-home {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.5);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -10px rgba(16, 185, 129, 0.6);
            color: white;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile-spacing-standards.css">
</head>
<body>
    <div class="bg-glow">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    <div class="error-container">
        <div class="glass-card">
            <i class="bi bi-shield-exclamation" style="font-size: 4rem;"></i>
            <h1 class="fw-bold">500</h1>
            <h3>System Error</h3>
            <p th:text="${errorMessage != null ? errorMessage : 'Oops! Something went wrong on our end. Don''t worry, our team has been notified. Please try again in a few minutes.'}">Oops! Something went wrong on our end. Don't worry, our team has been notified. Please try again in a few minutes.</p>
            <a href="/" class="btn-home d-inline-block">Go Back Home</a>
        </div>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        function urlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('PWA ServiceWorker registered with scope:', registration.scope);
                        
                        // Push Notification Subscription
                        if ('PushManager' in window) {
                            fetch('/api/notifications/public-key')
                                .then(response => response.json())
                                .then(data => {
                                    if (data.publicKey) {
                                        const applicationServerKey = urlB64ToUint8Array(data.publicKey);
                                        registration.pushManager.subscribe({
                                            userVisibleOnly: true,
                                            applicationServerKey: applicationServerKey
                                        }).then(subscription => {
                                            fetch('/api/notifications/subscribe', {
                                                method: 'POST',
                                                headers: { 'Content-Type': 'application/json' },
                                                body: JSON.stringify(subscription)
                                            }).then(res => res.json())
                                              .then(resData => console.log('Push subscription saved:', resData))
                                              .catch(err => console.error('Failed to save push subscription', err));
                                        }).catch(err => {
                                            console.log('Failed to subscribe the user: ', err);
                                        });
                                    }
                                }).catch(err => console.log('Failed to fetch VAPID public key', err));
                        }
                    })
                    .catch(err => {
                        console.error('PWA ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>

</body>
</html>
